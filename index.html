<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="color-scheme" content="dark light"/>
<title>English Mastery — منصة الاختبارات</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --navy:#0f172a;
  --navy2:#1e293b;
  --gold:#d4af37;
  --gold2:#e8c547;
  --ok:#22c55e;
  --bad:#ef4444;
  --warn:#f59e0b;
  --r:20px;
  --r2:14px;
  /* Prefer clear Arabic first, then system UI */
  --font: Tajawal,Cairo,"Noto Sans Arabic","Noto Kufi Arabic",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --mono: ui-monospace,SFMono-Regular,Menlo,monospace;
  /* Modern UI sans for English verbs (irregular verbs tables / quiz) */
  --irr-en: "Manrope","Plus Jakarta Sans","DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* Fluid layout tokens (mobile-first) */
  --page-pad: clamp(12px, 3.5vw, 22px);
  --page-pad-lg: clamp(18px, 4vw, 28px);
  --content-max: 1100px;
  --touch-min: 44px;
  --tabbar-h: 56px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
[data-theme="dark"] {
  --bg:#020617;
  --bg2:#0f172a;
  --surface: rgba(255,255,255,.06);
  --surface2: rgba(255,255,255,.09);
  --border: rgba(255,255,255,.12);
  --text:#f8fafc;
  --muted: rgba(248,250,252,.72);
  --shadow: 0 25px 80px rgba(0,0,0,.45);
  --glass: blur(20px);
}
[data-theme="light"] {
  --bg:#f4f4f5;
  --bg2:#e4e4e7;
  --surface: rgba(255,255,255,.72);
  --surface2: rgba(255,255,255,.9);
  --border: rgba(15,23,42,.1);
  --text:#0f172a;
  --muted: rgba(15,23,42,.62);
  --shadow: 0 25px 60px rgba(15,23,42,.12);
  --glass: blur(16px);
}
* { box-sizing:border-box; margin:0; }
html {
  height:100%;
  overflow-x: clip;
  scroll-behavior:smooth;
  -webkit-text-size-adjust:100%;
}
body {
  min-height:100%;
  min-height:100dvh;
  overflow-x:clip;
  font-size:clamp(15px, 0.22vw + 14px, 17px);
  font-family:var(--font);
  /* تدرّج واحد مستمر (بدون بقع/حركة) */
  background: linear-gradient(180deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 35%, var(--bg2)) 45%, var(--bg2) 100%);
  background-attachment: fixed;
  color:var(--text);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a { color:inherit; text-decoration:none; }
button,input { font:inherit; color:inherit; }
.sr { position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden; }

.app { min-height:100%; display:flex; flex-direction:column; }

.topbar {
  position:sticky; top:0; z-index:100;
  padding-top:var(--safe-top);
  backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
  background: color-mix(in srgb, var(--bg2) 82%, transparent);
  border-bottom:1px solid var(--border);
  transition: background .25s ease, box-shadow .2s ease;
}
.topbar.is-scrolled {
  box-shadow: 0 10px 40px rgba(0,0,0,.14);
}
.tb-in {
  max-width:min(var(--content-max), 100%);
  margin:0 auto;
  padding:10px var(--page-pad);
  display:flex;
  align-items:center;
  gap:clamp(8px, 2vw, 14px);
  flex-wrap:wrap;
}
.topbar-cluster {
  display:flex;
  flex:1;
  align-items:center;
  justify-content:center;
  gap:4px;
  flex-wrap:wrap;
  min-width:0;
}
.topbar-menu-btn {
  display:none !important;
}
.topbar-backdrop {
  display:none;
}
@media (min-width:901px) {
  .tb-in .topbar-cluster .nav {
    flex:1;
    justify-content:center;
  }
}
@media (max-width:900px) {
  .tb-in {
    flex-wrap:nowrap;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding-top:max(8px, var(--safe-top));
    padding-left:max(10px, var(--page-pad));
    padding-right:max(10px, var(--page-pad));
  }
  .brand {
    min-width:0;
    flex:1;
  }
  .brand h1 { font-size:clamp(13px, 3.8vw, 15px); line-height:1.25; }
  .brand p { font-size:10px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .logo { width:36px; height:36px; flex-shrink:0; border-radius:11px; }
  .topbar-menu-btn {
    display:inline-flex !important;
    flex-shrink:0;
  }
  .topbar-cluster {
    display:none;
    position:fixed;
    left:0;
    right:0;
    top:var(--topbar-menu-top, 56px);
    z-index:140;
    flex-direction:column;
    align-items:stretch;
    gap:14px;
    padding:16px 18px calc(18px + env(safe-area-inset-bottom));
    margin:0;
    flex:unset;
    max-height:min(78vh, calc(100dvh - var(--topbar-menu-top, 56px) - 12px));
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:color-mix(in srgb, var(--bg2) 96%, transparent);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
    box-shadow:0 18px 50px rgba(0,0,0,.22);
  }
  .topbar.is-menu-open .topbar-cluster {
    display:flex;
  }
  .topbar-cluster .nav {
    width:100%;
    flex-wrap:nowrap;
    flex-direction:column;
    align-items:stretch;
    justify-content:flex-start;
    overflow:visible;
    gap:8px;
    padding:0;
    margin:0;
    border:none;
    mask-image:none;
    -webkit-mask-image:none;
  }
  .topbar-cluster .nav a {
    width:100%;
    text-align:center;
    padding:12px 14px;
    border-radius:14px;
  }
  .topbar-cluster .tools {
    width:100%;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    padding-top:12px;
    border-top:1px solid color-mix(in srgb, var(--border) 55%, transparent);
  }
  .topbar-backdrop {
    display:none;
    position:fixed;
    inset:0;
    z-index:135;
    background:rgba(2,6,23,.42);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
  }
  .topbar.is-menu-open .topbar-backdrop {
    display:block;
  }
}
@media (max-width:380px) {
  .icobtn { min-width:42px; min-height:42px; font-size:15px; }
  .chip { padding:6px 10px; font-size:11px; gap:6px; }
}
.brand {
  display:flex; align-items:center; gap:10px; cursor:pointer;
}
.logo {
  width:40px;height:40px;border-radius:12px;
  background: linear-gradient(145deg,var(--gold),#9a7b0a);
  box-shadow: 0 8px 24px rgba(212,175,55,.25);
}
.brand h1 { font-size:15px; font-weight:800; letter-spacing:-.02em; }
.brand p { font-size:11px; color:var(--muted); font-weight:600; margin-top:2px; }

.nav { display:flex; gap:4px; flex:1; justify-content:center; flex-wrap:wrap; }
.nav a {
  padding:10px 14px; border-radius:999px; font-size:13px; font-weight:650;
  color:var(--muted); transition: color .2s, background .2s, transform .2s;
}
.nav a:hover { background:var(--surface); color:var(--text); }
.nav a[aria-current="page"] {
  background: color-mix(in srgb, var(--gold) 22%, var(--surface));
  color:var(--text); font-weight:750;
}
.nav a.nav-home-ic {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 12px;
  border-radius:14px;
  line-height:0;
}
.nav a.nav-home-ic .em-ic {
  width:22px;
  height:22px;
  flex-shrink:0;
}

.tools { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.icobtn {
  min-width:44px; min-height:44px; border-radius:12px;
  border:1px solid var(--border); background:var(--surface);
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  font-size:16px; transition: transform .15s ease, background .2s;
}
.icobtn:hover { transform: scale(1.04); background:var(--surface2); }
.icobtn:active { transform: scale(.97); }

.chip {
  display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
  background:var(--surface); border:1px solid var(--border); font-size:12px; font-weight:650;
}

.shell {
  flex:1;
  width:100%;
  max-width:min(var(--content-max), 100%);
  margin:0 auto;
  padding:var(--page-pad-lg) var(--page-pad) calc(48px + var(--safe-bottom));
}

.hero {
  border-radius: calc(var(--r) + 4px);
  padding:clamp(18px, 4vw, 28px) clamp(16px, 3.5vw, 24px);
  background: var(--surface2);
  border:1px solid var(--border);
  box-shadow: var(--shadow);
  margin-bottom:22px;
  animation: fadeUp .5s ease both;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
.hero h2 { font-size:clamp(22px,4vw,30px); font-weight:800; letter-spacing:-.03em; margin-bottom:8px; }
.hero .lead { color:var(--muted); font-size:15px; max-width:62ch; font-weight:500; }

.kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:20px; }
@media(max-width:720px){ .kpis { grid-template-columns:1fr; } }
.kpi {
  padding:16px; border-radius:var(--r2); background:var(--surface); border:1px solid var(--border);
}
.kpi .v { font-size:26px; font-weight:800; letter-spacing:-.02em; }
.kpi .l { font-size:12px; color:var(--muted); font-weight:600; margin-top:4px; }

.qgrid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(min(100%, 260px), 1fr));
  gap:clamp(10px, 2.5vw, 14px);
}
.qcard {
  border-radius:var(--r); padding:18px; background:var(--surface2); border:1px solid var(--border);
  box-shadow: 0 12px 40px rgba(0,0,0,.08);
  display:flex; flex-direction:column; gap:10px;
  transition: transform .2s ease, box-shadow .2s;
  animation: fadeUp .45s ease both;
}
.qcard:nth-child(1){animation-delay:.03s} .qcard:nth-child(2){animation-delay:.06s}
.qcard:nth-child(3){animation-delay:.09s} .qcard:nth-child(4){animation-delay:.12s}
.qcard:nth-child(5){animation-delay:.15s} .qcard:nth-child(6){animation-delay:.18s}
.qcard:hover { transform: translateY(-3px); box-shadow: 0 18px 50px rgba(0,0,0,.12); }
.qcard h3 { font-size:16px; font-weight:750; }
.qcard .meta { font-size:12px; color:var(--muted); font-weight:600; }
.bar { height:7px; border-radius:99px; background:var(--surface); overflow:hidden; border:1px solid var(--border); }
.bar>i { display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--gold),var(--gold2)); transition:width .4s cubic-bezier(.22,1,.36,1); }

.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 18px; border-radius:14px; font-weight:650; font-size:14px;
  border:none; cursor:pointer; transition: transform .15s, filter .2s, box-shadow .2s;
  min-height:48px;
}
.btn-primary {
  background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#0f172a;
  box-shadow:0 8px 28px rgba(212,175,55,.28);
}
.btn-primary:hover { filter:brightness(1.05); }
.btn-primary:active { transform:scale(.98); }
.btn-sec { background:var(--surface); border:1px solid var(--border); color:var(--text); }
.btn-sec:hover { background:var(--surface2); }

.toolbar {
  display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px;
  padding:14px; border-radius:var(--r2); background:var(--surface); border:1px solid var(--border);
}
@media (max-width:520px) {
  .toolbar { flex-direction:column; align-items:stretch; }
  .toolbar .btn { width:100%; }
}
.search {
  flex:1; min-width:min(220px, 100%); display:flex; align-items:center; gap:10px;
  padding:12px 14px; border-radius:14px; border:1px solid var(--border); background:var(--surface2);
}
.search input { flex:1; border:none; background:transparent; outline:none; font-weight:500; }

.rowlist { display:flex; flex-direction:column; gap:10px; }
.qrow {
  padding:14px 16px; border-radius:var(--r2); border:1px solid var(--border);
  background:var(--surface2); cursor:pointer; transition: border-color .2s, transform .15s;
}
.qrow:hover { border-color: color-mix(in srgb, var(--gold) 40%, var(--border)); transform:translateX(-2px); }
html[dir="ltr"] .qrow:hover { transform:translateX(2px); }
.qrow .t { font-weight:650; font-size:14px; line-height:1.45; }
.qrow .m { font-size:11px; color:var(--muted); margin-top:6px; font-weight:600; }

.panel {
  border-radius:var(--r);
  padding:clamp(14px, 3.2vw, 22px);
  background:var(--surface2);
  border:1px solid var(--border);
  box-shadow: var(--shadow);
  max-width:100%;
  overflow-wrap:anywhere;
  word-wrap:break-word;
}
/* Premium glass cards (Grammar lessons) */
.glass-card {
  background: color-mix(in srgb, var(--surface2) 74%, transparent);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border:1px solid color-mix(in srgb, var(--border) 70%, transparent);
  box-shadow: 0 22px 60px rgba(0,0,0,.14);
}
.gram-sec-title {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:0 0 10px;
  font-size:15px;
  font-weight:950;
  letter-spacing:-.01em;
}
.gram-sec-title .warn {
  font-size:13px;
  color:#ef4444;
  font-weight:900;
  margin-inline-start:6px;
}
.gram-sec-kicker {
  margin:0 0 10px;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
  line-height:1.55;
}
.gram-mini-tabs {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:10px 0 14px;
}
.gram-mini-tabs .pill { padding:10px 16px; font-weight:750; }
.qhead { display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:16px; }
.qnum { font-size:13px; font-weight:700; color:var(--muted); }
.qnum-title { font-size:15px; font-weight:800; color:var(--text); margin-bottom:4px; }

.quiz-stat-grid {
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:10px;
  margin-top:12px;
}
.quiz-stat-cell {
  padding:11px 12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--surface);
  text-align:center;
}
.quiz-stat-k {
  display:block;
  font-size:10px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:6px;
}
.quiz-stat-v {
  font-size:18px;
  font-weight:850;
  color:var(--gold);
  font-variant-numeric:tabular-nums;
  line-height:1.15;
}
@media (max-width:420px) {
  .quiz-stat-grid { grid-template-columns:1fr; }
}

.tests-hub-meta {
  font-size:13px;
  font-weight:650;
  color:var(--muted);
  line-height:1.45;
  margin-top:6px;
}

.gram-answer-remain,
.voc-quiz-stats,
.gram-final-remain {
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  margin:0 0 10px;
  padding:8px 10px;
  border-radius:10px;
  background:color-mix(in srgb, var(--gold) 8%, transparent);
  border:1px solid color-mix(in srgb, var(--gold) 22%, var(--border));
}
.voc-quiz-stats { margin-bottom:12px; text-align:center; }
.qtext {
  font-size:clamp(16px, 2.6vw, 19px);
  font-weight:650;
  line-height:1.55;
  margin:16px 0;
  letter-spacing:-.01em;
  overflow-wrap:anywhere;
  word-break:normal;
  text-wrap:pretty;
  hanging-punctuation:first allow-end last allow-end;
  unicode-bidi:plaintext;
}
.quiz-learn-main .qtext {
  text-align:start;
}
.w-token {
  cursor:default; border-bottom:1px dotted color-mix(in srgb, var(--gold) 55%, transparent);
  transition: background .15s;
}
.w-token:hover { background: color-mix(in srgb, var(--gold) 12%, transparent); }

.opts { display:flex; flex-direction:column; gap:10px; }
.opts .opt {
  direction:ltr;
  text-align:left;
}
.opts .opt .txt { direction:ltr; }
.opt {
  display:flex; gap:12px; align-items:flex-start; text-align:start;
  padding:14px 16px; border-radius:16px; border:1px solid var(--border);
  background:var(--surface); cursor:pointer; font-weight:550; font-size:15px;
  transition: background .2s, border-color .2s, transform .1s;
  min-height:52px;
}
.opt:hover:not(:disabled) { background:var(--surface2); }
.opt:active:not(:disabled) { transform:scale(.99); }
.opt .L { font-family:var(--mono); font-weight:800; color:var(--gold); min-width:24px; flex-shrink:0; }
.opt.correct { border-color: rgba(34,197,94,.5); background: rgba(34,197,94,.1); }
.opt.wrong { border-color: rgba(239,68,68,.45); background: rgba(239,68,68,.08); }

.review-banner {
  padding:12px 14px; border-radius:14px; border:1px dashed rgba(245,158,11,.5);
  background: rgba(245,158,11,.1); font-size:13px; font-weight:650; margin-bottom:14px;
}

.learn {
  margin-top:20px; padding-top:18px; border-top:1px solid var(--border);
  display:grid; gap:12px; animation: fadeUp .4s ease both;
}
.lblock {
  padding:14px 16px; border-radius:var(--r2); background:var(--surface); border:1px solid var(--border);
}
.lblock h4 {
  font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--gold);
  font-weight:800; margin-bottom:8px;
}
.lblock .ar { font-weight:600; line-height:1.65; }
.lblock .en { font-family:var(--font); font-weight:550; color:var(--text); }

.pillrow { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.pill {
  padding:10px 14px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface); font-size:12px; font-weight:650; cursor:pointer;
  min-height:var(--touch-min);
  -webkit-tap-highlight-color:transparent;
}
.pill.on { background: color-mix(in srgb, var(--gold) 18%, var(--surface)); border-color: rgba(212,175,55,.35); }

.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
.stat {
  padding:16px; border-radius:var(--r2); border:1px solid var(--border); background:var(--surface2);
}
.stat .n { font-size:24px; font-weight:800; }
.stat .k { font-size:12px; color:var(--muted); margin-top:6px; font-weight:600; }

.footer {
  display:none;
}

.toast-wrap { position:fixed; bottom:20px; inset-inline:0; z-index:200; pointer-events:none; display:flex; flex-direction:column; align-items:center; gap:8px; }
.toast {
  pointer-events:auto; padding:12px 18px; border-radius:14px; background:var(--navy); color:#fff;
  box-shadow:var(--shadow); font-size:13px; font-weight:600; max-width:min(420px,92vw);
  animation: toastIn .35s cubic-bezier(.22,1,.36,1) both;
}
@keyframes toastIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
.toast.ok { border:1px solid rgba(34,197,94,.4); }
.toast.bad { border:1px solid rgba(239,68,68,.4); }

#wtip {
  position:fixed; z-index:300; display:none; max-width:min(320px,92vw);
  padding:14px 16px; border-radius:16px; background:var(--navy2); color:#f8fafc;
  border:1px solid var(--border); box-shadow:var(--shadow); font-size:13px; line-height:1.45;
}
[data-theme="light"] #wtip { background:#fff; color:#0f172a; }
#wtip b { color:var(--gold2); }
#wtip .ac { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
#wtip small { display:block; margin-top:6px; opacity:.85; font-weight:600; }

.gram-q-line { margin:0 0 10px; line-height:1.55; }
.gram-q-num { font-weight:750; margin-inline-end:6px; }
.gram-q-tokens-host .w-token { cursor:help; border-bottom:1px dashed rgba(212,175,55,.45); }
.opt .gram-opt-tok .w-token { cursor:help; border-bottom:1px dashed rgba(212,175,55,.35); }
.gram-deep-fb { margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); text-align:start; }
.gram-fb-block { margin-top:12px; }
.gram-fb-h { margin:0 0 8px; font-size:13px; font-weight:800; color:var(--gold2); }
.gram-fb-p { margin:0; font-size:13px; line-height:1.65; color:var(--text); }
.gram-fb-ul { margin:8px 0 0; padding-inline-start:20px; font-size:13px; line-height:1.6; }

/* Grammar tables: horizontal scroll without breaking layout */
.table-responsive {
  width:100%;
  max-width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  margin:12px 0;
  border-radius:var(--r2);
  border:1px solid var(--border);
}
.table-responsive .irr-group-table {
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  margin:0;
}
.table-responsive .irr-group-table th,
.table-responsive .irr-group-table td {
  padding:12px 14px;
  text-align:start; /* important: avoid centered look */
  vertical-align:top;
}
.table-responsive .irr-group-table thead th {
  background: color-mix(in srgb, var(--navy) 55%, var(--surface));
  color: var(--gold);
  font-weight: 900;
  font-size: 12px;
  letter-spacing: .02em;
}
.table-responsive .irr-group-table tbody td {
  border-top: 1px solid var(--border);
}
.table-responsive .irr-group-table tbody tr:nth-child(even) td {
  background: color-mix(in srgb, var(--surface) 82%, transparent);
}
.table-responsive .irr-group-table tbody tr:hover td {
  background: color-mix(in srgb, var(--surface2) 94%, transparent);
}
.table-responsive .irr-group-table thead th {
  position: sticky;
  top: 0;
  z-index: 1;
}
@media (max-width:640px) {
  /* On mobile: turn table rows into clean cards */
  .table-responsive .irr-group-table thead { display:none; }
  .table-responsive .irr-group-table,
  .table-responsive .irr-group-table tbody,
  .table-responsive .irr-group-table tr,
  .table-responsive .irr-group-table td { display:block; width:100%; }
  .table-responsive .irr-group-table tr {
    border-top: 1px solid var(--border);
    padding: 10px 10px;
  }
  .table-responsive .irr-group-table td {
    border-top: none;
    padding: 8px 10px;
  }
}

/* Irregular verbs premium UI */
.irr-dash { padding: 14px; border-radius: calc(var(--r) + 2px); border:1px solid var(--border); background:color-mix(in srgb, var(--surface2) 78%, transparent); box-shadow: var(--shadow); }

const QUESTION_BANK = [{"id":"Q1-01","quiz":"Quiz 1","question_en":"I have a big smart ........... I put it in my living room.","options":["TV","air conditioner","sofa"],"correct":0,"arabic_explanation":"الجملة تصف جهازًا ذكيًا كبيرًا يُوضع عادة في غرفة المعيشة، وهذا يصف التلفاز أكثر من الأثاث أو التكييف.","why_answer_ar":"TV يتناسب مع وصف smart وغرفة المعيشة كمكان للترفيه.","grammar_rule_ar":"استخدم أسماء الأشياء المنزلية حسب السياق: أجهزة مقابل أثاث.","vocabulary":"TV = تلفاز | smart = ذكي | living room = غرفة المعيشة","common_mistake_ar":"الخلط بين sofa (أريكة) وبين جهاز إلكتروني.","example_sentence_en":"We bought a big smart TV for the living room.","needs_review":false},{"id":"Q1-02","quiz":"Quiz 1","question_en":"My bag went missing a few months ago. Yesterday, I found it ........... the bedroom cabinet when I was deep-cleaning.","options":["opposite","on","behind"],"correct":2,"arabic_explanation":"وجدت الحقيبة خلف خزانة غرفة النوم؛ behind تدل على موضع الإخفاء أو الوضع الخلفي.","why_answer_ar":"السياق يفيد أن المكان غير ظاهر مباشرة أثناء التنظيف العميق.","grammar_rule_ar":"حروف الجر للمكان: behind = خلف، on = على، opposite = مقابل.","vocabulary":"bedroom = غرفة نوم | cabinet = خزانة | deep-cleaning = تنظيف عميق","common_mistake_ar":"استخدام on فقط لأي سطح دون التفكير في إخفاء الشيء.","example_sentence_en":"The keys fell behind the cabinet.","needs_review":false},{"id":"Q1-03","quiz":"Quiz 1","question_en":"Ahmad Saleh works in a hospital. His ........... is a doctor.","options":["occupation","surname","relationship"],"correct":0,"arabic_explanation":"الطبيب يصف المهنة وليس اسم العائلة ولا صلة القرابة.","why_answer_ar":"occupation تعني المهنة وهي ما يحتاجه السؤال.","grammar_rule_ar":"occupation / job / profession للحديث عن العمل.","vocabulary":"hospital = مستشفى | occupation = مهنة | doctor = طبيب","common_mistake_ar":"خلط surname (اسم العائلة) مع المهنة.","example_sentence_en":"Her occupation is nursing.","needs_review":false},{"id":"Q1-04","quiz":"Quiz 1","question_en":"I like pizza ........... hamburgers, but I don't like pasta.","options":["but","or","and"],"correct":2,"arabic_explanation":"نربط بين نوعين من الطعام المتشابهين في الإعجاب باستخدام and قبل but.","why_answer_ar":"الجملة الثانية تبدأ بـ but، والأولى تذكر إعجابًا بأكثر من شيء مرتبط.","grammar_rule_ar":"and لجمع عناصر متوافقة؛ but لمعارضة لاحقة.","vocabulary":"pizza = بيتزا | hamburgers = همبرغر | pasta = معكرونة","common_mistake_ar":"استخدام or عندما لا يوجد اختيار بل إعجاب بكليهما.","example_sentence_en":"I like tea and coffee, but I don't like soda.","needs_review":false},{"id":"Q1-05","quiz":"Quiz 1","question_en":"I ........... 3 languages: Arabic, English and Turkish.","options":["talk","have","speak"],"correct":2,"arabic_explanation":"نقول speak مع اللغات عند الحديث عن القدرة على التحدث بها.","why_answer_ar":"التركيب speak + languages ثابت في الإنجليزية.","grammar_rule_ar":"speak a language / talk to someone — فرق شائع.","vocabulary":"languages = لغات","common_mistake_ar":"استخدام talk بدون to بشكل خاطئ مع اللغات.","example_sentence_en":"She speaks French fluently.","needs_review":false},{"id":"Q1-06","quiz":"Quiz 1","question_en":"Jeddah is famous for ........... beautiful beaches.","options":["their","it's","its"],"correct":2,"arabic_explanation":"its (بدون فتحة) ضمير ملكية لشيء أو مكان؛ هنا لجدة.","why_answer_ar":"it's = it is / it has وليست ضمير ملكية.","grammar_rule_ar":"its مقابل it's: ملكية مقابل اختصار.","vocabulary":"famous for = مشهور بـ | beaches = شواطئ","common_mistake_ar":"كتابة it's بدل its قبل اسم.","example_sentence_en":"The city is known for its history.","needs_review":false},{"id":"Q1-07","quiz":"Quiz 1","question_en":"Our car is ........... It was made in Germany.","options":["Italian","British","German"],"correct":2,"arabic_explanation":"صنع في ألمانيا فيعني أن السيارة ألمانية الجنسية/النوع.","why_answer_ar":"German صفة تتوافق مع made in Germany.","grammar_rule_ar":"صفات الجنسية بأحرف كبيرة عند استخدامها كصفة.","vocabulary":"made in = صُنع في","common_mistake_ar":"اختيار صفة لا تطابق بلد الصنع.","example_sentence_en":"This is a German engineering brand.","needs_review":false},{"id":"Q1-08","quiz":"Quiz 1","question_en":"There ........... many books on my desk.","options":["are","is not","is"],"correct":0,"arabic_explanation":"many books جمع، فيتطلب there are.","why_answer_ar":"الاتفاق بين الفعل والاسم الجمع.","grammar_rule_ar":"There is/are حسب المذكور بعدها مباشرة.","vocabulary":"desk = مكتب","common_mistake_ar":"There is مع جمع.","example_sentence_en":"There are two cups on the table.","needs_review":false},{"id":"Q1-09","quiz":"Quiz 1","question_en":"I have 15 ........... in my fishtank.","options":["fish","fishes","fishs"],"correct":0,"arabic_explanation":"fish غالبًا نفس الشكل للمفرد والجمع عند عدّ الأسماك.","why_answer_ar":"15 تدل على جمع، والشكل المعياري fish.","grammar_rule_ar":"fish — جمع غير منتظم شائع؛ fishes نادر لأنواع مختلفة.","vocabulary":"fishtank = حوض سمك","common_mistake_ar":"إضافة s خطأ fishs.","example_sentence_en":"We saw many fish in the lake.","needs_review":false},{"id":"Q1-10","quiz":"Quiz 1","question_en":"A: Is Salim your cousin? B: No, he is my ........... My mom remarried after my dad passed away.","options":["half-brother","brother","sister"],"correct":0,"arabic_explanation":"إعادة الزواج تفسر أخًا من أحد الأبوين فقط: half-brother.","why_answer_ar":"السياق العائلي يحدد نوع القرابة.","grammar_rule_ar":"مصطلحات العائلة: half- vs step-","vocabulary":"remarried = تزوجت مجددًا | passed away = توفي","common_mistake_ar":"brother العام دون تمييز الأخ غير الأشقاء بالكامل.","example_sentence_en":"She has a half-sister on her father's side.","needs_review":false},{"id":"Q1-11","quiz":"Quiz 1","question_en":"A: Where ........... they from? B: They are from Egypt.","options":["are","is","aren't"],"correct":0,"arabic_explanation":"they جمع، مع are في الأسئلة والإجابات.","why_answer_ar":"Where are they from? تركيب ثابت.","grammar_rule_ar":"أدوات be مع الضمائر: they are.","vocabulary":"from Egypt = من مصر","common_mistake_ar":"is مع they.","example_sentence_en":"Where are you from?","needs_review":false},{"id":"Q1-12","quiz":"Quiz 1","question_en":"These are ........... shoes. Look, they're not in your size.","options":["our","my","your"],"correct":1,"arabic_explanation":"المتحدث يشير لحذائه هو وليس للمخاطب.","why_answer_ar":"الجملة الثانية تفند أنها حذاء المخاطب.","grammar_rule_ar":"صفات الملكية: my / your / our.","vocabulary":"size = مقاس","common_mistake_ar":"your عندما يكون الكلام موجهًا لشخص لكن المعنى يقتضي المتحدث.","example_sentence_en":"These are my gloves, not yours.","needs_review":false},{"id":"Q1-13","quiz":"Quiz 1","question_en":"There is ........... in my driveway.","options":["a car","many car","2 cars"],"correct":0,"arabic_explanation":"There is مع مفرد معدود a car صحيح نحويًا.","why_answer_ar":"many car خطأ؛ 2 cars يتطلب there are.","grammar_rule_ar":"there is + مفرد / there are + جمع.","vocabulary":"driveway = ممر سيارات منزل","common_mistake_ar":"there is مع جمع.","example_sentence_en":"There is a problem with the engine.","needs_review":false},{"id":"Q1-14","quiz":"Quiz 1","question_en":"I live in Jeddah, ........... I am from Dammam.","options":["and","but","or"],"correct":1,"arabic_explanation":"تباين بين مكان السكن والأصل يبرره but.","why_answer_ar":"and لا تعارض؛ or للاختيار.","grammar_rule_ar":"but لربط فكرتين متعارضتين.","vocabulary":"live in = أسكن في | from = من (أصل)","common_mistake_ar":"and رغم وجود تباين معنوي.","example_sentence_en":"She is young, but she is very wise.","needs_review":false},{"id":"Q1-15","quiz":"Quiz 1","question_en":"I can't find the ........... I need to light the candles on the cake.","options":["keys","headphones","lighter"],"correct":2,"arabic_explanation":"إشعال الشموع يحتاج ولاعة lighter.","why_answer_ar":"السياق الوظيفي يحدد الأداة.","grammar_rule_ar":"مفردات منزلية حسب الغرض.","vocabulary":"candles = شموع | cake = كعكة","common_mistake_ar":"اختيار أدوات لا علاقة لها بالنار.","example_sentence_en":"Do you have a lighter or matches?","needs_review":false},{"id":"Q1-16","quiz":"Quiz 1","question_en":"I ........... a journalist. I am a photographer.","options":["not am","'m not","isn't"],"correct":1,"arabic_explanation":"نفي I am بصيغة I'm not.","why_answer_ar":"isn't للجمع/الغائب وليس I.","grammar_rule_ar":"أدوات be مع الضمائر: I'm not / you aren't.","vocabulary":"journalist = صحفي | photographer = مصور","common_mistake_ar":"ترتيب not am غير معياري.","example_sentence_en":"I'm not ready yet.","needs_review":false},{"id":"Q1-17","quiz":"Quiz 1","question_en":"My car is not ........... It was made in 2023.","options":["new","old","expensive"],"correct":1,"arabic_explanation":"صنع حديثًا فيعني ليست قديمة؛ old منطقي بعد النفي.","why_answer_ar":"not old يتوافق مع 2023.","grammar_rule_ar":"صفات وصف حالة الشيء مع الزمن.","vocabulary":"made in 2023 = صُنع في 2023","common_mistake_ar":"new بعد النفي رغم أن الجملة تؤكد الحداثة.","example_sentence_en":"The building is not old; it opened last year.","needs_review":false},{"id":"Q1-18","quiz":"Quiz 1","question_en":"I can't reach ........... books. They are up on that shelf.","options":["those","that","these"],"correct":0,"arabic_explanation":"كتب بعيدة على الرف تشير إليها those.","why_answer_ar":"that لمفرد؛ these للقرب غالبًا.","grammar_rule_ar":"this/these قرب — that/those بعد.","vocabulary":"shelf = رف","common_mistake_ar":"these لأشياء بعيدة.","example_sentence_en":"Those boxes are too high for me.","needs_review":false},{"id":"Q1-19","quiz":"Quiz 1","question_en":"I bought some ........... from the supermarket yesterday.","options":["potatoes","potatos","potato"],"correct":0,"arabic_explanation":"بعض البطاطس جمع صحيح potatoes.","why_answer_ar":"potato → potatoes انتظام شائع.","grammar_rule_ar":"جمع potato بـ -es.","vocabulary":"supermarket = سوبرماركت","common_mistake_ar":"potatos إملاء خاطئ.","example_sentence_en":"We need three potatoes for the soup.","needs_review":false},{"id":"Q1-20","quiz":"Quiz 1","question_en":"A: Are you from Boston? B: No, ........... I'm from Chicago.","options":["I'm not","Imn't","am not"],"correct":0,"arabic_explanation":"نفي are you بـ No, I'm not.","why_answer_ar":"Imn't غير موجود في الإنجليزية المعيارية.","grammar_rule_ar":"اختصار am not → I'm not في الكلام.","vocabulary":"from Boston / Chicago = من بوسطن/شيكاغو","common_mistake_ar":"استخدام am not وحدها دون ضمير في الرد القصير.","example_sentence_en":"A: Are you tired? B: No, I'm not.","needs_review":false},{"id":"Q3-01","quiz":"Quiz 3","question_en":"There isn't ........... milk in the fridge.","options":["a","some","any"],"correct":2,"arabic_explanation":"في النفي مع اسم غير معدود نستخدم any أكثر شيوعًا من some.","why_answer_ar":"isn't + any يوافق المعنى: لا يوجد حليب.","grammar_rule_ar":"some في الإثبات؛ any غالبًا في النفي والأسئلة.","vocabulary":"milk = حليب | fridge = ثلاجة","common_mistake_ar":"استخدام some بعد isn't في نفي عام بسيط عن الكمية.","example_sentence_en":"There isn't any sugar left.","needs_review":false},{"id":"Q3-02","quiz":"Quiz 3","question_en":"I bought ........... apple for breakfast.","options":["a","an","some"],"correct":1,"arabic_explanation":"apple تبدأ بصوت علة فنستخدم an وليس a.","why_answer_ar":"قاعدة a/an حسب الصوت الأول وليس الحرف فقط.","grammar_rule_ar":"a قبل صوت ساكن، an قبل صوت علة.","vocabulary":"breakfast = فطور","common_mistake_ar":"a apple خطأ شائع إملائي/نطق.","example_sentence_en":"I ate an orange this morning.","needs_review":false},{"id":"Q3-03","quiz":"Quiz 3","question_en":"We have ........... friends in London.","options":["many","a","much"],"correct":0,"arabic_explanation":"friends جمع معدود فيستخدم many.","why_answer_ar":"much للغير معدود؛ many للجمع المعدود.","grammar_rule_ar":"many/much تمييز أساسي.","vocabulary":"friends = أصدقاء","common_mistake_ar":"much friends خطأ.","example_sentence_en":"There are many students here.","needs_review":false},{"id":"Q3-04","quiz":"Quiz 3","question_en":"How ........... sugar do you take in your coffee?","options":["a lot of","much","any"],"correct":1,"arabic_explanation":"sugar غير معدود فنسأل How much.","why_answer_ar":"How many للمعدود؛ How much للكميات.","grammar_rule_ar":"How much + اسم غير معدود.","vocabulary":"sugar = سكر | coffee = قهوة","common_mistake_ar":"How many sugar خطأ.","example_sentence_en":"How much water do you need?","needs_review":false},{"id":"Q3-05","quiz":"Quiz 3","question_en":"I need some ........... to make a sandwich.","options":["apples","bread","chairs"],"correct":1,"arabic_explanation":"الساندويتش يحتاج خبز bread.","why_answer_ar":"سياق الطعام يحدد المفردات.","grammar_rule_ar":"some + اسم قابل للعدد أو غير معدود حسب المعنى.","vocabulary":"sandwich = شطيرة","common_mistake_ar":"اختيار أشياء لا تُستخدم عادة في الساندويتش.","example_sentence_en":"Buy some bread from the bakery.","needs_review":false},{"id":"Q3-06","quiz":"Quiz 3","question_en":"There are ........... students in the classroom today.","options":["many","a","much"],"correct":0,"arabic_explanation":"students جمع معدود → many.","why_answer_ar":"There are + جمع.","grammar_rule_ar":"there is/are مع العدد والنوع.","vocabulary":"classroom = صف","common_mistake_ar":"much students خطأ.","example_sentence_en":"There are many chairs in the room.","needs_review":false},{"id":"Q3-07","quiz":"Quiz 3","question_en":"We don't have ........... rice left.","options":["any","some","a"],"correct":0,"arabic_explanation":"في النفي مع rice غير معدود نستخدم any.","why_answer_ar":"don't have any شائع في الكلام اليومي.","grammar_rule_ar":"any في النفي؛ some في الإثبات غالبًا.","vocabulary":"rice = أرز","common_mistake_ar":"some بعد don't have عن غير معدود أحيانًا يُقبل في عروض لكن any الأدق هنا.","example_sentence_en":"We don't have any time.","needs_review":false},{"id":"Q3-08","quiz":"Quiz 3","question_en":"How many ........... do we have?","options":["milk","water","bottles"],"correct":2,"arabic_explanation":"How many يتبعه جمع معدود: bottles.","why_answer_ar":"milk/water غير معدود مباشرة هكذا.","grammar_rule_ar":"How many + جمع.","vocabulary":"bottles = زجاجات","common_mistake_ar":"How many milk خطأ.","example_sentence_en":"How many bottles are there?","needs_review":false},{"id":"Q3-09","quiz":"Quiz 3","question_en":"She needs a ........... of milk.","options":["bar","loaf","glass"],"correct":2,"arabic_explanation":"كمية حليب سائلة قد تُقاس بكأس glass في هذا السياق التعليمي.","why_answer_ar":"وحدات القياس: a glass of milk.","grammar_rule_ar":"of لربط الكمية بالمادة.","vocabulary":"milk = حليب","common_mistake_ar":"bar عادة لشوكولاتة وليس حليب.","example_sentence_en":"Pour a glass of milk, please.","needs_review":false},{"id":"Q3-10","quiz":"Quiz 3","question_en":"I bought two ........... of milk.","options":["slices","pieces","bottles"],"correct":2,"arabic_explanation":"زجاجتان من الحليب bottles of milk.","why_answer_ar":"two + جمع معدود.","grammar_rule_ar":"قطع الحليب السائل بالزجاجة شائع في التعبير.","vocabulary":"bottle = زجاجة","common_mistake_ar":"slices للخبز أو الجبن غالبًا.","example_sentence_en":"Two bottles of water, please.","needs_review":false},{"id":"Q3-11","quiz":"Quiz 3","question_en":"He ate a ........... of chocolate after lunch.","options":["jar","bar","loaf"],"correct":1,"arabic_explanation":"شوكولاتة على شكل قالب bar.","why_answer_ar":"a bar of chocolate تعبير ثابت.","grammar_rule_ar":"وحدات الطعام.","vocabulary":"chocolate = شوكولاتة | lunch = غداء","common_mistake_ar":"loaf للخبز.","example_sentence_en":"I bought a bar of chocolate.","needs_review":false},{"id":"Q3-12","quiz":"Quiz 3","question_en":"........... money do you have?","options":["How many","How lot of","How much"],"correct":2,"arabic_explanation":"money غير معدود → How much.","why_answer_ar":"How lot of غير صحيح.","grammar_rule_ar":"How much للأموال والكميات.","vocabulary":"money = مال","common_mistake_ar":"How many money خطأ.","example_sentence_en":"How much time do we have?","needs_review":false},{"id":"Q3-13","quiz":"Quiz 3","question_en":"She ... s Aria and Sam to school. After school, the children play in the garden. On weekends, the family visits the park. They love spending time together.\n\n2. The Patel family goes to the park?","options":["every day","on weekdays","on weekends","Sundays"],"correct":2,"arabic_explanation":"النص: «On weekends, the family visits the park».","why_answer_ar":"الزيارة في عطلة نهاية الأسبوع وليس كل يوم.","grammar_rule_ar":"اقرأ القطعة وحدد الإجابة التي يدعمها النص صراحةً.","vocabulary":"","common_mistake_ar":"","example_sentence_en":"","needs_review":false},{"id":"Q7-03","quiz":"Quiz 7","question_en":"Read the text:\nIn the U.K, there is a man named Mr. Davis. He loves old furniture. Every weekend, he looks for old chairs, tables, and cabinets. Mr. Davis cleans the furniture and fixes it. Some pieces are very old, but he makes them look new again. He has many old chairs and tables in his house. People in the town know him well. Sometimes, they give him old furniture, and he is always happy to take it.\n\n1. What does Mr. Davis do on the weekends?","options":["collects furniture","talks to his friends","visits the market","travels with his family"],"correct":0,"arabic_explanation":"في عطلة الأسبوع يبحث عن أثاث قديم ويجمعه.","why_answer_ar":"«looks for old chairs, tables, and cabinets» يعادل جمع/استقطاب الأثاث.","grammar_rule_ar":"اقرأ القطعة وحدد الإجابة التي يدعمها النص صراحةً.","vocabulary":"furniture = أثاث","common_mistake_ar":"","example_sentence_en":"","needs_review":false},{"id":"Q7-04","quiz":"Quiz 7","question_en":"Read the text:\nIn the U.K, there is a man named Mr. Davis. He loves old furniture. Every weekend, he looks for old chairs, tables, and cabinets. Mr. Davis cleans the furniture and fixes it. Some pieces are very old, but he makes them look new again. He has many old chairs and tables in his house. People in the town know him well. Sometimes, they give him old furniture, and he is always happy to take it.\n\n2. The passage is mainly about?","options":["Possessions (things people own)","A town"],"correct":0,"arabic_explanation":"القطعة تركز على الأثاث القديم وجمعه وليس وصف المدينة.","why_answer_ar":"الموضوع هو امتلاك الأثاث وجمعه وليس المدينة.","grammar_rule_ar":"اقرأ القطعة وحدد الإجابة التي يدعمها النص صراحةً.","vocabulary":"","common_mistake_ar":"","example_sentence_en":"","needs_review":false},{"id":"Q7-05","quiz":"Quiz 7","question_en":"Read the text:\nIn their free time, people like to do many fun activities. Some people read books or watch movies. Others enjoy playing sports like soccer or basketball. Many people like to go for walks in the park or ride bikes. Some enjoy cooking or baking delicious food. Friends often meet to chat and have fun together. Some people like to listen to music or play musical instruments. Others may enjoy painting or drawing. Many people also play video games or spend time on the internet. Everyone has different hobbies, and that makes free time special.\n\n1. In their free time, students like to play video games?","options":["Not mentioned","False","True"],"correct":2,"arabic_explanation":"النص يذكر أن كثيرين من الناس يلعبون ألعاب فيديو؛ الطلاب ضمن الناس العاديين في هذا السياق التعليمي.","why_answer_ar":"«Many people also play video games» يدعم صحة الفكرة.","grammar_rule_ar":"اقرأ القطعة وحدد الإجابة التي يدعمها النص صراحةً.","vocabulary":"","common_mistake_ar":"","example_sentence_en":"","needs_review":false},{"id":"Q7-06","quiz":"Quiz 7","question_en":"Read the text:\nIn their free time, people like to do many fun activities. Some people read books or watch movies. Others enjoy playing sports like soccer or basketball. Many people like to go for walks in the park or ride bikes. Some enjoy cooking or baking delicious food. Friends often meet to chat and have fun together. Some people like to listen to music or play musical instruments. Others may enjoy painting or drawing. Many people also play video games or spend time on the internet. Everyone has different hobbies, and that makes free time special.\n\n2. Why is free time special for people?","options":["Free time is boring.","Everyone has different hobbies.","People do the same things."],"correct":1,"arabic_explanation":"الجملة الختامية توضح أن اختلاف الهوايات يجعل وقت الفراغ مميزًا.","why_answer_ar":"يطابق الجملة الأخيرة في القطعة.","grammar_rule_ar":"اقرأ القطعة وحدد الإجابة التي يدعمها النص صراحةً.","vocabulary":"","common_mistake_ar":"","example_sentence_en":"","needs_review":false},{"id":"Q7-07","quiz":"Quiz 7","question_en":"Read the text:\nPeople work in many places. For example, some work in offices. When they work there, they use computers and write emails to send information. Other people work in schools as teachers. They teach students. Some work in hospitals and help sick people. There are also workers in restaurants. They cook food and serve customers. Factories are also places of work where people make products like toys and cars. Each place of work is important!\n\n1. Which of the following sentences is correct about emails?","options":["People do not usually use them at work.","They are a useless communication tool.","They are used to send information."],"correct":2,"arabic_explanation":"في المكتب يُستخدم الحاسوب والبريد لإرسال المعلومات.","why_answer_ar":"النص يذكر «write emails to send information».","grammar_rule_ar":"اقرأ القطعة وحدد الإجابة التي يدعمها النص صراحةً.","vocabulary":"email = بريد إلكتروني","common_mistake_ar":"","example_sentence_en":"","needs_review":false},{"id":"Q7-08","quiz":"Quiz 7","question_en":"Read the text:\nPeople work in many places. For example, some work in offices. When they work there, they use computers and write emails to send information. Other people work in schools as teachers. They teach students. Some work in hospitals and help sick people. There are also workers in restaurants. They cook food and serve customers. Factories are also places of work where people make products like toys and cars. Each place of work is important!\n\n2. What can you conclude from the passage?","options":["The most important job is to work in a factory.","All kinds of workplaces are needed.","There are only five types of jobs."],"correct":1,"arabic_explanation":"الخاتمة: «Each place of work is important».","why_answer_ar":"كل وظيفة ومكان عمل له أهمية.","grammar_rule_ar":"اقرأ القطعة وحدد الإجابة التي يدعمها النص صراحةً.","vocabulary":"","common_mistake_ar":"","example_sentence_en":"","needs_review":false},{"id":"Q7-09","quiz":"Quiz 7","question_en":"Read the text:\nWhen you go to the supermarket, it's important to understand food labels. The cost tells you how much money you need to pay. Check the 'best before' date to know when the food is still good to eat. Look for the amount of fat on the label—some fat is healthy, but too much is not good for you. Natural foods come from plants or animals and have fewer chemicals, while superfoods are especially nutritious, like blueberries and spinach.\n\n1. What does the \"best before\" date on a food label indicate?","options":["When the food is still good to eat.","How much fat is in the food."],"correct":0,"arabic_explanation":"النص يشرح أن التاريخ يبيّن متى يظل الطعام صالحًا.","why_answer_ar":"يطابق عبارة «when the food is still good to eat».","grammar_rule_ar":"اقرأ القطعة وحدد الإجابة التي يدعمها النص صراحةً.","vocabulary":"","common_mistake_ar":"","example_sentence_en":"","needs_review":false},{"id":"Q7-10","quiz":"Quiz 7","question_en":"Read the text:\nWhen you go to the supermarket, it's important to understand food labels. The cost tells you how much money you need to pay. Check the 'best before' date to know when the food is still good to eat. Look for the amount of fat on the label—some fat is healthy, but too much is not good for you. Natural foods come from plants or animals and have fewer chemicals, while superfoods are especially nutritious, like blueberries and spinach.\n\n2. On a label, \"low-fat\" typically means:","options":["The food has less fat than the regular version of that product.","The food is very expensive."],"correct":0,"arabic_explanation":"المعنى المعتاد لـ low-fat هو كمية دهون أقل مقارنة بالمنتج العادي (استنتاج من السياق عن الدهون).","why_answer_ar":"المصطلح يصف مستوى الدهون وليس السعر.","grammar_rule_ar":"اقرأ القطعة وحدد الإجابة التي يدعمها النص صراحةً.","vocabulary":"","common_mistake_ar":"","example_sentence_en":"","needs_review":false},{"id":"Q7-11","quiz":"Quiz 7","question_en":"Read the text:\nBefore boarding, passengers have to show passports and tickets. You mustn't leave your luggage unattended. You can take one carry-on bag. Food and drink are available after security.\n\n1. What must every passenger do before boarding?","options":["Leave their bags unattended.","Show passports (and tickets)."],"correct":1,"arabic_explanation":"يجب إظهار جواز السفر والتذكرة قبل الصعود.","why_answer_ar":"الجملة الأولى في القطعة.","grammar_rule_ar":"اقرأ القطعة وحدد الإجابة التي يدعمها النص صراحةً.","vocabulary":"","common_mistake_ar":"","example_sentence_en":"","needs_review":false},{"id":"Q7-12","quiz":"Quiz 7","question_en":"Read the text:\nBefore boarding, passengers have to show passports and tickets. You mustn't leave your luggage unattended. You can take one carry-on bag. Food and drink are available after security.\n\n2. What is not allowed?","options":["Showing a ticket.","Taking one carry-on bag.","Leaving bags unattended."],"correct":2,"arabic_explanation":"يُمنع ترك الأمتعة دون مراقبة.","why_answer_ar":"«mustn't leave your luggage unattended».","grammar_rule_ar":"اقرأ القطعة وحدد الإجابة التي يدعمها النص صراحةً.","vocabulary":"","common_mistake_ar":"","example_sentence_en":"","needs_review":false},{"id":"Q7-13","quiz":"Quiz 7","question_en":"My sister's daughter is my...","options":["Father","Nephew","Sister","Niece"],"correct":3,"arabic_explanation":"ابنة الأخت هي niece بالإنجليزية.","why_answer_ar":"Niece = ابنة الأخ/الأخت.","grammar_rule_ar":"الأسرة والقرابة بالإنجليزية.","vocabulary":"niece = ابنة الأخ أو الأخت","common_mistake_ar":"الخلط بين nephew (ابن الأخ/الأخت) وniece.","example_sentence_en":"My niece is five years old.","needs_review":false},{"id":"Q7-14","quiz":"Quiz 7","question_en":"Toyota is a ... company.","options":["Japanese","Japan","Japany","Japanies"],"correct":0,"arabic_explanation":"نحتاج صفًا يصف الشركة: يابانية Japanese.","why_answer_ar":"Japanese صفة؛ Japan اسم البلد.","grammar_rule_ar":"الصفات الوطنية بصيغة صفة قبل الاسم.","vocabulary":"Japanese = ياباني","needs_review":false},{"id":"Q7-15","quiz":"Quiz 7","question_en":"Ahmed: Where ... you from?","options":["Are","Am","This","Is"],"correct":0,"arabic_explanation":"مع الضمير you يُستخدم فعل are.","why_answer_ar":"Where are you from? تعبير ثابت.","grammar_rule_ar":"فعل be مع الضمائر.","needs_review":false},{"id":"Q7-16","quiz":"Quiz 7","question_en":"My daughter's son is my...","options":["Grandson","Grandparent","Parent","Son"],"correct":0,"arabic_explanation":"ابن الابنة هو حفيد grandson.","why_answer_ar":"Grandson = ابن الابن/الابنة.","needs_review":false},{"id":"Q7-17","quiz":"Quiz 7","question_en":"I ... to school every day at 7:30 am.","options":["Go","Goes","Went","Going"],"correct":0,"arabic_explanation":"المضارع البسيط مع I والعادة اليومية.","why_answer_ar":"I go — الزمن الحاضر للعادات.","grammar_rule_ar":"Present simple للروتين.","needs_review":false},{"id":"Q7-18","quiz":"Quiz 7","question_en":"I travelled to Al-Lith last week. The weather ... great.","options":["Were","Are","Is","Was"],"correct":3,"arabic_explanation":"حدث في الماضي؛ الجو مفرد فيستخدم was.","why_answer_ar":"Last week + weather was.","grammar_rule_ar":"Past simple مع الأحداث المنتهية.","needs_review":false},{"id":"Q7-19","quiz":"Quiz 7","question_en":"How ... money do you have?","options":["Lots of","Many","A lot of","Much"],"correct":3,"arabic_explanation":"مع الاسم غير المعدود money نستخدم much في السؤال.","why_answer_ar":"How much money?","grammar_rule_ar":"much / many حسب العدّ والعدم.","needs_review":false},{"id":"Q7-20","quiz":"Quiz 7","question_en":"... are large pieces of cloth that hang across a window to stop light.","options":["Tables","Drawers","Curtains","Chairs"],"correct":2,"arabic_explanation":"الستائر curtains تُعلق على النوافذ.","why_answer_ar":"تعريف الستائر في الجملة.","vocabulary":"curtains = ستائر","needs_review":false},{"id":"Q7-21","quiz":"Quiz 7","question_en":"In Jeddah, there is a ... which has more than 10,000 books.","options":["Theater","Park","Library","Museum"],"correct":2,"arabic_explanation":"مكان يضم آلاف الكتب هو المكتبة.","vocabulary":"library = مكتبة","needs_review":false},{"id":"Q7-22","quiz":"Quiz 7","question_en":"What is the meaning of the word \"identical\"?","options":["Things look very different.","Things look different.","Things look similar.","Things look exactly the same."],"correct":3,"arabic_explanation":"Identical تعني متطابقة تمامًا.","vocabulary":"identical = متطابق تمامًا","needs_review":false},{"id":"Q7-23","quiz":"Quiz 7","question_en":"Muslims around the world ... during the daytime in Ramadan.","options":["Doesn't eat and drink.","Don't eat and drink."],"correct":1,"arabic_explanation":"جمع Muslims يتطلب don't وليس doesn't.","grammar_rule_ar":"لاتفاق الفعل مع الجمع.","needs_review":false},{"id":"Q7-24","quiz":"Quiz 7","question_en":"The summer in Saudi Arabia is ... in Iceland.","options":["Hotter","Hotter than"],"correct":1,"arabic_explanation":"المقارنة بين بلدين تتطلب than.","grammar_rule_ar":"المقارنة comparative + than.","needs_review":false},{"id":"Q7-25","quiz":"Quiz 7","question_en":"Lions are ... than cats.","options":["Dangerous","More dangerous"],"correct":1,"arabic_explanation":"than يدل على مقارنة؛ نستخدم more dangerous.","needs_review":false},{"id":"Q7-26","quiz":"Quiz 7","question_en":"Money used in a country is called ...","options":["Souvenir","Visa","Currency"],"correct":2,"arabic_explanation":"العملة الرسمية currency.","vocabulary":"currency = عملة","needs_review":false},{"id":"Q7-27","quiz":"Quiz 7","question_en":"Have you ever ... a horse?","options":["Ride","Rode","Ridden"],"correct":2,"arabic_explanation":"بعد Have you ever نستخدم التصريف الثالث ridden.","grammar_rule_ar":"Present perfect: have/has + past participle.","needs_review":false},{"id":"Q7-28","quiz":"Quiz 7","question_en":"The Amazon River ... through Brazil.","options":["Flows","Flow","To flow"],"correct":0,"arabic_explanation":"المضارع الثالث مع فاعل مفرد The river flows.","needs_review":false},{"id":"Q7-29","quiz":"Quiz 7","question_en":"Christopher Columbus ... the New World in 1492.","options":["Were discovered.","Discovers.","Was discovered.","Discovered."],"correct":3,"arabic_explanation":"كولومبوس فاعل اكتشف؛ زمن ماضٍ discovered.","grammar_rule_ar":"Past simple للأحداث التاريخية.","needs_review":false},{"id":"Q7-30","quiz":"Quiz 7","question_en":"The news ... very upsetting.","options":["Was.","Were.","Are.","Weren't."],"correct":0,"arabic_explanation":"News غالبًا يُعامل كمفرد؛ was upsetting.","grammar_rule_ar":"الاتفاق مع collective nouns.","needs_review":false},{"id":"Q7-31","quiz":"Quiz 7","question_en":"What time ... you get up in the morning?","options":["Does","Do"],"correct":1,"arabic_explanation":"مع you في السؤال نستخدم do.","needs_review":false},{"id":"Q7-32","quiz":"Quiz 7","question_en":"I have 15 ... in my fishtank.","options":["Fish","Fishes"],"correct":0,"arabic_explanation":"Fish نفس الشكل للجمع عند عدّ الأسماك.","grammar_rule_ar":"أسماء جميعها مثل fish / sheep.","needs_review":false}];

's = it is أو it has. their للجمع؛ they're = they are.","mistakes_ar":"كتابة hes بدل his؛ أو استخدام her مع ذكر الجنس بالخطأ.","compare_ar":"Possessive pronouns (mine, yours…) تأتي بدون اسم بعدها؛ الصفات الملكية يجب أن يتبعها اسم.","quiz":[{"question_en":"Anna forgot ___ keys on the bus.","options":["her","she","hers"],"correct":0,"why_ar":"اسم شيء بعد الصفة الملكية → her.","rule_ar":"Possessive adjective before noun."},{"question_en":"This is ___ house, not ours.","options":["they're","their","there"],"correct":1,"why_ar":"ملكية الجمع → their.","rule_ar":"their + noun."},{"question_en":"The cat drank ___ water.","options":["it's","its","it"],"correct":1,"why_ar":"ضمير ملكية للحيوان → its.","rule_ar":"its + noun."},{"question_en":"___ father works in a hospital.","options":["We","Our","Us"],"correct":1,"why_ar":"قبل اسم → صفة ملكية.","rule_ar":"Our + noun."},{"question_en":"Is this ___ pen? — Yes, it's mine.","options":["you","your","you're"],"correct":1,"why_ar":"your pen.","rule_ar":"Possessive adjective."},{"question_en":"The students forgot ___ books.","options":["his","their","its"],"correct":1,"why_ar":"students جمع → their.","rule_ar":"Plural possessive."},{"question_en":"That's ___ classroom (Paul).","options":["Pauls'","Paul's","Pauls"],"correct":1,"why_ar":"ملكية شخص → 's.","rule_ar":"Possessive ’s."},{"question_en":"___ bag is heavier: yours or mine?","options":["Who's","Whose","Who"],"correct":1,"why_ar":"سؤال عن الملكية → Whose (كلمة استفهام).","rule_ar":"Whose + noun."},{"question_en":"They love ___ new apartment.","options":["there","their","they're"],"correct":1,"why_ar":"their apartment.","rule_ar":"Possessive their."},{"question_en":"Ahmad ___ sister is a doctor.","options":["'s","s'","s's"],"correct":0,"why_ar":"اسم مفرد + ’s.","rule_ar":"Noun + ’s."},{"question_en":"I lost ___ wallet.","options":["my","mine","me"],"correct":0,"why_ar":"قبل اسم → صفة ملكية my.","rule_ar":"my + noun."},{"question_en":"Can we borrow ___ car?","options":["your","you're","you"],"correct":0,"why_ar":"your car.","rule_ar":"Possessive adjective."},{"question_en":"The dog hurt ___ paw.","options":["its","it's","it"],"correct":0,"why_ar":"ملكية للحيوان → its.","rule_ar":"its + body part."},{"question_en":"Is this ___ umbrella?","options":["your","you're","you"],"correct":0,"why_ar":"قبل اسم → your.","rule_ar":"your + noun."},{"question_en":"Those seats are ___. (they belong to us)","options":["ours","our","we"],"correct":0,"why_ar":"ضمير ملكية منفصل بدون اسم بعده.","rule_ar":"Possessive pronoun ours."},{"question_en":"___ dictionary is this?","options":["Who's","Whose","Who"],"correct":1,"why_ar":"Whose = لمن.","rule_ar":"Whose + noun?"},{"question_en":"She spoke to ___ teacher after class.","options":["her","she","hers"],"correct":0,"why_ar":"her teacher.","rule_ar":"her + noun."},{"question_en":"We painted ___ bedroom white.","options":["our","we","hours"],"correct":0,"why_ar":"our bedroom.","rule_ar":"our + noun."},{"question_en":"___ not my coat — pick the contraction for «it is».","options":["It's","Its","Its'"],"correct":0,"why_ar":"It's = it is.","rule_ar":"it's vs its."},{"question_en":"Whose keys ___ these?","options":["are","is","am"],"correct":0,"why_ar":"keys جمع → are.","rule_ar":"Whose + noun + be."},{"question_en":"___ phone keeps ringing.","options":["Mary's","Marys","Marys'"],"correct":0,"why_ar":"Mary's phone.","rule_ar":"Singular name + ’s."},{"question_en":"They sold ___ old bikes.","options":["their","they're","there"],"correct":0,"why_ar":"their bikes.","rule_ar":"their + plural noun."}]},"coordinating-conjunctions-and-or-but":{"categoryId":"unit-1-foundations","title_en":"Coordinating conjunctions: and, or, but","title_ar":"أدوات الربط: and و or و but","keywords":["and","or","but","coordinating conjunctions","linking"],"explanation_ar":"أدوات الربط المتساوية تربط كلمات أو مجموعات كلمات من نفس النوع. and تربط أفكارًا متشابهة أو إضافية؛ or تربط بدائل؛ but تربط تباينًا أو تعارضًا بين جزأين.","rule_en":"and → similar / added ideas; or → alternatives (choice); but → contrast.","table":{"headers":["Conjunction","Role","Example"],"rows":[["and","similar / added ideas","I like apples and bananas."],["or","alternatives","Do you want an apple or a banana?"],["but","contrast","I like apples but I don't like bananas."]]},"examples":[{"en":"I like apples and bananas.","ar":"أحب التفاح والموز."},{"en":"Do you want tea or coffee?","ar":"هل تريد شايًا أم قهوة؟"},{"en":"She's tired but she's happy.","ar":"هي متعبة لكنها سعيدة."}],"notes_ar":"الأجزاء المتصلة يجب أن تكون متوازية نحويًا (اسم واسم، جملة وجملة…).","mistakes_ar":"استخدام but رغم عدم وجود تعارض؛ أو but بين عناصر غير متوازية.","compare_ar":"because تشرح السبب؛ but تعرض التباين فقط.","quiz":[{"question_en":"I bought bread ___ butter at the store.","options":["and","but","or"],"correct":0,"why_ar":"إضافة غرضين متشابهين في القائمة → and.","rule_ar":"and links similar items."},{"question_en":"Do you want the red one ___ the blue one?","options":["and","or","but"],"correct":1,"why_ar":"اختيار بين بديلين → or.","rule_ar":"or for alternatives."},{"question_en":"It's cheap ___ it's good quality.","options":["and","but","or"],"correct":0,"why_ar":"إضافة صفتين متوافقتين → and.","rule_ar":"and for addition."},{"question_en":"She wanted to stay, ___ she had to leave.","options":["and","but","or"],"correct":1,"why_ar":"رغبة مقابل إجبار → تباين → but.","rule_ar":"but links contrasting clauses."},{"question_en":"He's rich ___ unhappy.","options":["and","but","or"],"correct":1,"why_ar":"تعارض بين غني وحزين → but.","rule_ar":"but for contrast."},{"question_en":"Walk straight ___ turn left at the bank.","options":["and","or","but"],"correct":0,"why_ar":"تتابع خطوات → and.","rule_ar":"Sequential instructions with and."},{"question_en":"We can meet today ___ tomorrow.","options":["and","or","but"],"correct":1,"why_ar":"خياران زمنيان → or.","rule_ar":"or between options."},{"question_en":"She likes maths ___ finds physics difficult.","options":["and","but","or"],"correct":1,"why_ar":"إعجاب مقابل صعوبة → contrast → but.","rule_ar":"but."},{"question_en":"Do you travel by bus ___ by train?","options":["and","or","but"],"correct":1,"why_ar":"وسيلتان بديلتان → or.","rule_ar":"or in questions of choice."},{"question_en":"I'd love to go, ___ I'm too busy.","options":["and","but","or"],"correct":1,"why_ar":"رغبة مقابل عائق → but.","rule_ar":"but for contrast."}]},"there-is-there-are":{"categoryId":"unit-1-foundations","title_en":"There is / There are","title_ar":"There is / There are","keywords":["there is","there are","some","existence","singular","plural"],"explanation_ar":"نستخدم There is / There are لقول أن شيئًا موجودًا (أو غير موجود) في مكان أو سياق. الشكل يتبع أول اسم بعد there غالبًا: مفرد أو غير معدود → there is؛ جمع → there are. مع الجمل غير المعدودة مثل milk نستخدم there is some milk.","rule_en":"There is + singular / uncountable. There are + plural nouns. Negative: There isn't / There aren't. Question: Is there…? Are there…?","table":{"headers":["Form","Example"],"rows":[["There is + singular","There is a book on the desk."],["There are + plural","There are books on the desk."],["There is + uncountable","There is some milk in the fridge."]]},"examples":[{"en":"There is a book on the desk.","ar":"هناك كتاب على المكتب."},{"en":"There are books on the desk.","ar":"هناك كتب على المكتب."},{"en":"There is some milk in the fridge.","ar":"هناك بعض الحليب في الثلاجة."},{"en":"There aren't any problems.","ar":"لا توجد أي مشاكل."}],"notes_ar":"في اللغة المنطوقة يُسمع There's مع جمع أحيانًا؛ في الامتحانات الرسمية التزم there are مع الجمع.","mistakes_ar":"There is مع جمع (*There is many books).","compare_ar":"They are يصف «هم»؛ there are يصف وجود أشياء في مكان.","quiz":[{"question_en":"There ___ two pens on the floor.","options":["are","is","am"],"correct":0,"why_ar":"two pens جمع → there are.","rule_ar":"There are + plural."},{"question_en":"There ___ a problem with the Wi‑Fi.","options":["is","are","be"],"correct":0,"why_ar":"a problem مفرد → there is.","rule_ar":"There is + singular."},{"question_en":"___ there any sugar?","options":["Is","Are","Do"],"correct":0,"why_ar":"sugar غير معدود هنا → Is there…?","rule_ar":"Is there + uncountable."},{"question_en":"There ___ some chairs in the room.","options":["are","is","has"],"correct":0,"why_ar":"chairs جمع.","rule_ar":"There are."},{"question_en":"There ___ not enough time.","options":["is","are","were"],"correct":0,"why_ar":"time غير معدود → is.","rule_ar":"There isn't + uncountable."},{"question_en":"___ there many students?","options":["Are","Is","Do"],"correct":0,"why_ar":"many students جمع → Are there…?","rule_ar":"Are there + plural?"},{"question_en":"There ___ a cat and two dogs in the yard.","options":["is","are","have"],"correct":0,"why_ar":"الاتفاق غالبًا مع أول اسم (a cat) في اللغة غير الرسمية؛ المعيار التعليمي يركز there is مع أول عنصر مفرد.","rule_ar":"There is + first item singular (proximity agreement)."},{"question_en":"There ___ no apples left.","options":["are","is","were"],"correct":0,"why_ar":"apples جمع → are.","rule_ar":"There are + plural subject."},{"question_en":"___ there a bank near here?","options":["Is","Are","Does"],"correct":0,"why_ar":"a bank مفرد.","rule_ar":"Is there a…?"},{"question_en":"There ___ lots of people outside.","options":["are","is","was"],"correct":0,"why_ar":"people جمع → are.","rule_ar":"There are + plural."}]},"prepositions-of-place":{"categoryId":"unit-2-nouns-place-tense","title_en":"Prepositions of place","title_ar":"حروف الجر للمكان","keywords":["in","on","under","behind","between","next to","above","below"],"explanation_ar":"حروف الجر التي تلي اسم مكان توضح موضع الشيء بالنسبة لآخر: داخل (in)، على سطح (on)، تحت (under)، أمام (in front of)، خلف (behind)، بجانب (next to)، فوق (above)، أسفل (below)، بين (between)، يمين/يسار، مقابل (opposite).","rule_en":"in / on / under / in front of / behind / next to / above / below / between / on the left / on the right / opposite + noun phrase.","table":{"headers":["Preposition","Arabic hint","Example"],"rows":[["in","في (داخل)","The keys are in the drawer."],["on","على","The phone is on the table."],["under","تحت","The cat is under the chair."],["in front of","أمام","There is a tree in front of the house."],["behind","خلف","Park behind the supermarket."],["next to","بجانب","Sit next to me."],["between","بين","The cafe is between the bank and the library."],["above / below","فوق / أسفل","The flat above ours is noisy."],["opposite","مقابل","The hospital is opposite the park."],["on the left / right","يسار / يمين","Turn right at the corner."]]},"examples":[{"en":"Your bag is under the seat.","ar":"حقيبتك تحت المقعد."},{"en":"The picture hangs above the sofa.","ar":"الصورة معلّقة فوق الأريكة."},{"en":"She waited at the bus stop opposite the school.","ar":"انتظرت عند موقف الحافلة مقابل المدرسة."}],"notes_ar":"أحيانًا يختلف الإنجليزي عن العربية: in the street قد تكون on في الأمريكية — ركّز على ما في المنهج.","mistakes_ar":"خلط on و in (على الطاولة on؛ في الصندوق in).","compare_ar":"next to قريب جدًا؛ near أوسع؛ between يحتاج شيئين على الأقل.","quiz":[{"question_en":"The lamp is ___ the ceiling.","options":["on","above","in"],"correct":1,"why_ar":"الثريا «فوق» الغرفة نحو السقف → above.","rule_ar":"above for higher position."},{"question_en":"There's a spider ___ the bed.","options":["on","under","at"],"correct":1,"why_ar":"شائع تحت السرير → under.","rule_ar":"under."},{"question_en":"She lives ___ the third floor.","options":["in","on","at"],"correct":1,"why_ar":"on + floor.","rule_ar":"on the floor level."},{"question_en":"The bank is ___ the post office and the cafe.","options":["between","under","on"],"correct":0,"why_ar":"بين مبنيين → between.","rule_ar":"between."},{"question_en":"Put the glasses ___ the cupboard.","options":["in","on","over"],"correct":0,"why_ar":"داخل الخزانة → in.","rule_ar":"in."},{"question_en":"He stood ___ me in the queue.","options":["behind","between","next"],"correct":0,"why_ar":"ورائي في الطابور → behind.","rule_ar":"behind."},{"question_en":"There's a hotel ___ the river.","options":["opposite","under","in"],"correct":0,"why_ar":"مقابل النهر → opposite.","rule_ar":"opposite."},{"question_en":"Your shoes are ___ the door.","options":["next to","between","among"],"correct":0,"why_ar":"بجانب الباب.","rule_ar":"next to."},{"question_en":"The cat jumped ___ the table.","options":["onto","into","at"],"correct":0,"why_ar":"حركة إلى فوق السطح → onto (في هذا السياق التعليمي).","rule_ar":"Movement to surface — onto."},{"question_en":"Sign your name ___ the dotted line.","options":["on","in","under"],"correct":0,"why_ar":"على الخط المنقط.","rule_ar":"on."}]},"plural-nouns":{"categoryId":"unit-2-nouns-place-tense","title_en":"Plural nouns","title_ar":"جمع الأسماء","keywords":["plural","s","es","ies","ves","irregular"],"explanation_ar":"جمع الاسم المنتظم غالبًا بإضافة s؛ بعد s, ch, sh, x, z نستخدم es؛ يـاء متحركة + y نحذف y ونضيف ies؛ حرف ساكن + o غالبًا es؛ استثناءات كثيرة للأفعال الشاذة والأسماء التي لا تتغير.","rule_en":"Regular +s; +es after s/ch/sh/x/z; consonant+y → ies; f/fe → often ves (roof/cliff exceptions); irregular: men, children, feet, mice, etc.; same form: sheep, deer, fish.","table":{"headers":["Rule","Examples"],"rows":[["Regular +s","car → cars, book → books"],["s/ch/sh/x/z + es","bus → buses, box → boxes"],["consonant + y → ies","city → cities, baby → babies"],["vowel + y → s","day → days, boy → boys"],["f/fe → ves (exceptions exist)","leaf → leaves; roof → roofs"],["Irregular","man → men, child → children, foot → feet"],["No change","sheep, deer, fish (often)"]]},"examples":[{"en":"two buses","ar":"حافلتان"},{"en":"three babies","ar":"ثلاثة أطفال رضّع"},{"en":"five wolves","ar":"خمسة ذئاب"},{"en":"many people","ar":"كثير من الناس"}],"notes_ar":"quiz → quizzes بحرفين zz + es. piano و photo غالبًا فقط s.","mistakes_ar":"potatos بدل potatoes؛ یا citys بدل cities.","compare_ar":"صفات المقارنة ليست جمع أسماء؛ لا تخلط -er مع جمع الجملة.","quiz":[{"question_en":"one box, two ___","options":["boxs","boxes","boxies"],"correct":1,"why_ar":"ينتهي بـ x → es.","rule_ar":"+es after x."},{"question_en":"one baby, many ___","options":["babys","babies","baby"],"correct":1,"why_ar":"consonant + y → ies.","rule_ar":"y → ies."},{"question_en":"two ___ (knife)","options":["knifes","knives","knife"],"correct":1,"why_ar":"f → ves.","rule_ar":"knives."},{"question_en":"one man, two ___","options":["mans","men","man"],"correct":1,"why_ar":"شاذ.","rule_ar":"irregular plural men."},{"question_en":"several ___ (child)","options":["childs","children","childrens"],"correct":1,"why_ar":"children.","rule_ar":"irregular."},{"question_en":"two ___ (tomato)","options":["tomatos","tomatoes","tomato"],"correct":1,"why_ar":"consonant + o غالبًا es.","rule_ar":"tomatoes."},{"question_en":"many ___ (sheep)","options":["sheeps","sheep","sheepes"],"correct":1,"why_ar":"نفس الشكل.","rule_ar":"sheep unchanged."},{"question_en":"two ___ (quiz)","options":["quizs","quizzes","quize"],"correct":1,"why_ar":"double z + es.","rule_ar":"quizzes."},{"question_en":"The ___ are on sale (city).","options":["citys","cities","city"],"correct":1,"why_ar":"city → cities.","rule_ar":"consonant + y."},{"question_en":"two ___ (photo)","options":["photos","photoes","photoses"],"correct":0,"why_ar":"استثناء شائع → photos.","rule_ar":"photo → photos."}]},"demonstratives-this-that-these-those":{"categoryId":"unit-2-nouns-place-tense","title_en":"This, that, these, those","title_ar":"This و that و these و those","keywords":["this","that","these","those","demonstratives","near","far"],"explanation_ar":"this و that لمفرد؛ these و those لجمع. غالبًا this/these للقرب الزماني أو المكاني؛ that/those للبعد. تُستخدم قبل اسم أو تشير لوحدها حسب السياق.","rule_en":"This/that + singular noun. These/those + plural noun. This/these → nearer; that/those → farther.","table":{"headers":["Word","Number","Typical distance"],"rows":[["this","singular","near"],["that","singular","far"],["these","plural","near"],["those","plural","far"]]},"examples":[{"en":"I like this apple.","ar":"أحب هذا التفاح."},{"en":"I like that apple.","ar":"أحب ذلك التفاح."},{"en":"I like these apples.","ar":"أحب هذه التفاحات."},{"en":"I like those apples.","ar":"أحب تلك التفاحات."}],"notes_ar":"هذه الأدوات تعمل كصفات تشيرية قبل الاسم؛ لا تخلط this مع جمع.","mistakes_ar":"these apple بدل these apples؛ أو those مع مفرد.","compare_ar":"أدوات الإشارة مختلفة عن he/she/it التي للضمير فقط.","quiz":[{"question_en":"___ shoes here are mine; ___ ones over there are yours.","options":["This / that","These / those","That / these"],"correct":1,"why_ar":"أحذية جمع قريبة وبعيدة → these / those.","rule_ar":"these near, those far."},{"question_en":"Look at ___ bird in the tree!","options":["this","these","those"],"correct":0,"why_ar":"bird مفرد قريب → this.","rule_ar":"this + singular."},{"question_en":"___ students in the back row, please stand.","options":["That","Those","This"],"correct":1,"why_ar":"students جمع وبعيد نسبيًا → Those.","rule_ar":"those + plural."},{"question_en":"I prefer ___ coat (near me).","options":["this","these","those"],"correct":0,"why_ar":"معطف واحد قريب.","rule_ar":"this."},{"question_en":"___ was a great concert we saw last year.","options":["That","These","Those"],"correct":0,"why_ar":"حديث عن تجربة في الماضي البعيد نسبيًا → That.","rule_ar":"that for distant idea/time."},{"question_en":"Are ___ your keys on the table?","options":["this","these","that"],"correct":1,"why_ar":"keys جمع → these.","rule_ar":"these."},{"question_en":"I don't like ___ colours.","options":["that","those","this"],"correct":1,"why_ar":"colours جمع وبعد → those.","rule_ar":"those."},{"question_en":"Give me ___ book on the shelf (you point).","options":["that","these","those"],"correct":0,"why_ar":"كتاب واحد تُشير إليه بعيدًا → that.","rule_ar":"that."},{"question_en":"___ days we're very busy.","options":["This","These","Those"],"correct":1,"why_ar":"days جمع وزمن قريب → These.","rule_ar":"these days."},{"question_en":"Who are ___ people?","options":["this","that","those"],"correct":2,"why_ar":"people جمع وبُعد → those.","rule_ar":"those people."}]},"capital-letters":{"categoryId":"unit-3-writing-routines","title_en":"Capital letters in writing","title_ar":"الأحرف الكبيرة في الكتابة","keywords":["capital","uppercase","proper noun","sentence","Monday","English"],"explanation_ar":"نبدأ الجملة بحرف كبير دائمًا. الأسماء الخاصة (أشخاص، مدن، بلدان)، أيام الأسبوع والشهور، الجنسيات واللغات كصفات، أسماء المؤسسات، وعناوين الكتب والأفلام تُكتب بحسب قواعد الأحرف الكبيرة في الإنجليزية.","rule_en":"Capitalize: sentence beginnings; names and titles (Mr./Ms./Dr.); days and months; places; nationalities and languages; companies; book and film titles (major words).","table":{"headers":["Use a capital for…","Examples"],"rows":[["First word in a sentence","Today is sunny."],["Direct speech","\"Stop that man!\" shouted the officer."],["People & titles","Ms. Ali, Professor Omar"],["Days / months","Friday, August"],["Places / languages","Saudi Arabia; She speaks Arabic."],["Organizations","UNICEF"],["Works (titles)","Harry Potter"]]},"examples":[{"en":"english is fun → English is fun.","ar":"اسم اللغة بحرف كبير."},{"en":"i study on monday. → I study on Monday.","ar":"بداية الجملة واسم اليوم."},{"en":"She lives in riyadh. → She lives in Riyadh.","ar":"اسم مدينة."}],"notes_ar":"في الواجبات والامتحان اتبع القواعد المعيارية وليس أسلوب الشات.","mistakes_ar":"أيام الأسبوع بحروف صغيرة؛ أو french بدل French.","compare_ar":"the بحرف صغير؛ الأسماء الخاصة بحرف كبير.","quiz":[{"question_en":"Which sentence is written correctly?","options":["i love english.","I love English.","i Love english."],"correct":1,"why_ar":"بداية الجملة واسم اللغة بحرف كبير.","rule_ar":"Sentence + proper noun capitalization."},{"question_en":"Choose the correct day:","options":["monday","Monday","MONDAY"],"correct":1,"why_ar":"أيام الأسبوع بحرف كبير في الكتابة الرسمية.","rule_ar":"Capitalize day  / -ing","They love football."]]},"examples":[{"en":"I like dancing.","ar":"أحب الرقص."},{"en":"She likes singing.","ar":"تحب الغناء."},{"en":"They love football.","ar":"يحبون كرة القدم."}],"notes_ar":"She likes وليس She like.","mistakes_ar":"نسيان s مع الصف الثالث.","compare_ar":"I like to dance مقبول أيضًا؛ الشرائح تركز على like + ing.","quiz":[{"question_en":"I like ___ .","options":["dance","dancing","dances"],"correct":1,"why_ar":"like + gerund.","rule_ar":"like + -ing."},{"question_en":"She likes ___ to music.","options":["listen","listening","listens"],"correct":1,"why_ar":"likes + gerund.","rule_ar":"likes + -ing."},{"question_en":"We love ___ stories.","options":["read","reading","reads"],"correct":1,"why_ar":"love + gerund.","rule_ar":"love + -ing."},{"question_en":"He ___ cartoons.","options":["like","likes","liking"],"correct":1,"why_ar":"he + likes.","rule_ar":"Third person -s."},{"question_en":"They don't like ___ TV late.","options":["watch","watching","watches"],"correct":1,"why_ar":"don't like + gerund.","rule_ar":"negative + -ing."},{"question_en":"Do you like ___ ?","options":["run","running","runs"],"correct":1,"why_ar":"Do you like + gerund.","rule_ar":"question."},{"question_en":"My brother likes ___ games.","options":["play","playing","plays"],"correct":1,"why_ar":"likes + gerund.","rule_ar":"like + -ing."},{"question_en":"Birds enjoy ___ nuts.","options":["eat","eating","eats"],"correct":1,"why_ar":"enjoy + gerund شائع.","rule_ar":"enjoy + -ing."},{"question_en":"___ your sister like pizza?","options":["Do","Does","Is"],"correct":1,"why_ar":"Does للفعل المعنوي like.","rule_ar":"Does … like?"},{"question_en":"She ___ classical music.","options":["love","loves","loving"],"correct":1,"why_ar":"loves مع she.","rule_ar":"Third person -s."}]},"adverbs-of-frequency":{"categoryId":"unit-3-writing-routines","title_en":"Adverbs of frequency","title_ar":"ظروف التكرار","keywords":["always","usually","often","sometimes","hardly ever","never"],"explanation   /** Turn long comma-separated unit descriptions into a scannable list (Arabic comma ، or Latin comma). */
  function grammarScopeDescHtml(text) {
    const raw = String(text || "").trim();
    if (!raw) return "";
    let parts = raw.split(/\s*،\s*/).map((s) => s.trim()).filter(Boolean);
    if (parts.length <= 1) {
      parts = raw.split(/\s*,\s*/).map((s) => s.trim()).filter(Boolean);
    }
    if (parts.length <= 1) {
      return `<p class="gram-scope-plain">${esc(raw)}</p>`;
    }
    return `<ul class="gram-scope-list" role="list">${parts.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>`;
  }

  /** Arabic notes / mistakes: relaxed blocks + same comma→list behavior as unit descriptions */
  function grammarArabicFlowHtml(raw) {
    const s = String(raw || "").trim();
    if (!s) return "";
    const listed = grammarScopeDescHtml(s);
    if (listed.includes("gram-scope-list")) {
      return `<div class="gram-ar-flow" dir="rtl">${listed}</div>`;
    }
    const paras = s.split(/\n+/).map((x) => x.trim()).filter(Boolean);
    if (paras.length > 1) {
      return `<div class="gram-ar-flow" dir="rtl">${paras.map((p) => `<p class="gram-ar-block">${esc(p)}</p>`).join("")}</div>`;
    }
    return `<div class="gram-ar-flow" dir="rtl"><p class="gram-ar-block">${esc(s)}</p></div>`;
  }

  function grammarPronounTableHtml() {
