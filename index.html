      let picked = {};

      const rebuildQuiz = () => {
        quiz = mkQuiz(irrQuizGroup);
        qi = 0;
        picked = {};
        renderQ();
      };

      $("#irrReset") &&
        ($("#irrReset").onclick = () => {
          rebuildQuiz();
        });

      $("#irrRetryQ") &&
        ($("#irrRetryQ").onclick = () => {
          delete picked[qi];
          renderQ();
        });

      // Stage-based quiz & navigation (premium dashboard)
      const stageBtns = v.querySelectorAll("[data-irr-stage]");
      stageBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          const s = clamp(Number(btn.getAttribute("data-irr-stage")) || 1, 1, 7);
          if (!state.grammar.irregular || typeof state.grammar.irregular !== "object") state.grammar.irregular = {};
          state.grammar.irregular.stage = s;
          saveState();
          render();
        });
      });

      $("#irrStageDoneBtn") &&
        ($("#irrStageDoneBtn").onclick = () => {
          if (!state.grammar.irregular || typeof state.grammar.irregular !== "object") state.grammar.irregular = {};
          if (!state.grammar.irregular.stageDone || typeof state.grammar.irregular.stageDone !== "object") state.grammar.irregular.stageDone = {};
          const s = clamp(Number(state.grammar.irregular.stage || 1) || 1, 1, 7);
          state.grammar.irregular.stageDone[String(s)] = !state.grammar.irregular.stageDone[String(s)];
          saveState();
          render();
        });

      $("#irrStageQuizBtn") &&
        ($("#irrStageQuizBtn").onclick = () => {
          const s = clamp(Number(state.grammar.irregular?.stage || 1) || 1, 1, 7);
          irrQuizGroup = s <= 5 ? 1 : 2;
          // filter quiz pool by stage
          const stageOnly = all.filter((x) => x.stage === s);
          const prevAll = all.slice();
          all.length = 0;
          stageOnly.forEach((x) => all.push(x));
          setPane("quiz");
          rebuildQuiz();
          // restore list so search and other UI remain correct
          all.length = 0;
          prevAll.forEach((x) => all.push(x));
        });

      // (Favorites UI disabled in table-first view)

      function renderQ() {
        if (!$("#irrPaneQuiz")) return;
        if (!quiz.length) {
          $("#irrPaneQuiz").innerHTML = `<p class="empty">لا توجد بيانات كافية لبناء كويز من الجداول الحالية.</p>`;
          return;
        }
        qi = clamp(qi, 0, quiz.length - 1);
        const q = quiz[qi];
        $("#irrProg").textContent = `${qi + 1}/${quiz.length}`;
        $("#irrPrev").disabled = qi <= 0;
        $("#irrNext").disabled = qi >= quiz.length - 1;
        $("#irrPrompt").textContent = q.prompt_ar || "";
        $("#irrStem").textContent = q.stem_en || "";
        const sar = $("#irrStemAr");
        if (sar) {
          const tx = String(q.stem_ar || "").trim();
          sar.textContent = tx;
          sar.style.display = tx ? "block" : "none";
        }

        const lock = typeof picked[qi] === "string";
        const ans = q.answer_en;
        $("#irrOpts").innerHTML = (q.choices_en || [])
          .map((c) => {
            const isAns = lock && c === ans;
            const cls = isAns ? "btn btn-primary" : "btn btn-sec";
            return `<button type="button" class="${cls}" data-irr-pick="${esc(c)}" ${lock ? "disabled" : ""} style="justify-content:flex-start;direction:ltr;text-align:left">${esc(
              c,
            )}</button>`;
          })
          .join("");

        const fb = $("#irrFb");
        fb.style.display = lock ? "block" : "none";
        if (lock) {
          const ok = picked[qi] === ans;
          fb.innerHTML = `<div class="ar-text" style="font-weight:950;color:${ok ? "var(--ok)" : "var(--bad)"}">${esc(
            ok ? "صحيح" : "خطأ",
          )}</div><div class="en-text" dir="ltr" style="margin-top:6px;font-weight:950;font-family:var(--irr-en)">${esc(
            "الإجابة الصحيحة: " + ans,
          )}</div>${q.explain_ar ? `<div class="ar-text" style="margin-top:8px">${esc(q.explain_ar)}</div>` : ""}`;
        }

        $("#irrOpts").querySelectorAll("[data-irr-pick]").forEach((b) => {
          b.addEventListener("click", () => {
            const c = b.getAttribute("data-irr-pick");
            if (!c) return;
            picked[qi] = c;
            renderQ();
          });
        });

        const retryBtn = $("#irrRetryQ");
        if (retryBtn) retryBtn.disabled = !lock;
      }

      $("#irrPrev") && ($("#irrPrev").onclick = () => {
        qi = Math.max(0, qi - 1);
        renderQ();
      });
      $("#irrNext") && ($("#irrNext").onclick = () => {
        qi = Math.min(quiz.length - 1, qi + 1);
        renderQ();
      });
    }

    const stNav = grammarLessonQuiz[lessonId];
    // Multi-stage quiz tab (stage/final) controls
    v.querySelectorAll("[data-gqtab]").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (!stNav.ui || typeof stNav.ui !== "object") stNav.ui = { mode: "stage", stage: 0 };
        const mode = btn.getAttribute("data-gqtab");
        if (mode === "final") {
          stNav.ui.mode = "final";
        } else {
          stNav.ui.mode = "stage";
          const si = Number(btn.getAttribute("data-stage"));
          if (Number.isFinite(si)) stNav.ui.stage = si;
        }
        render();
      });
    });
    $("#gramExPrev")?.addEventListener("click", () => {
      if (stNav.exPos > 0) {
        stNav.exPos--;
        render();
      }
    });
    $("#gramExNext")?.addEventListener("click", () => {
      const maxEx = (L.examples || []).length - 1;
      if (maxEx >= 0 && stNav.exPos < maxEx) {
        stNav.exPos++;
        render();
      }
    });
    if (!hasMultiQuiz) {
      $("#gramQuizPrev")?.addEventListener("click", () => {
        if (stNav.quizPos > 0) {
          stNav.quizPos--;
          render();
        }
      });
      $("#gramQuizNext")?.addEventListener("click", () => {
        if (qs.length && stNav.quizPos < qs.length - 1) {
          stNav.quizPos++;
          render();
        }
      });
    } else {
      L.quizStages.forEach((stage, si) => {
        const n = (stage.quiz || []).length;
        $(`#gqs${si}-quiz-prev`)?.addEventListener("click", () => {
          if (stNav.stages[si].quizPos > 0) {
            stNav.stages[si].quizPos--;
            render();
          }
        });
        $(`#gqs${si}-quiz-next`)?.addEventListener("click", () => {
          if (n && stNav.stages[si].quizPos < n - 1) {
            stNav.stages[si].quizPos++;
            render();
          }
        });
      });
      const nf = (L.quizComprehensive || []).length;
      $("#gqf-quiz-prev")?.addEventListener("click", () => {
        if (stNav.final.quizPos > 0) {
          stNav.final.quizPos--;
          render();
        }
      });
      $("#gqf-quiz-next")?.addEventListener("click", () => {
        if (nf && stNav.final.quizPos < nf - 1) {
          stNav.final.quizPos++;
          render();
        }
      });
    }

    v.querySelectorAll(".gram-qblock .opt").forEach((btn) => {
      btn.onclick = () => {
        const qix = parseInt(btn.getAttribute("data-qix"), 10);
        const oix = parseInt(btn.getAttribute("data-oix"), 10);
        const tag = btn.getAttribute("data-gram-quiz") || "legacy";
        const cur = grammarLessonQuiz[lessonId];
        let item;
        if (tag === "final") {
          item = L.quizComprehensive[qix];
          if (cur.final.picks[qix] !== null && cur.final.picks[qix] !== undefined) return;
          cur.final.picks[qix] = oix;
        } else if (tag.startsWith("stage:")) {
          const si = parseInt(tag.slice("stage:".length), 10);
          item = L.quizStages[si].quiz[qix];
          if (cur.stages[si].picks[qix] !== null && cur.stages[si].picks[qix] !== undefined) return;
          cur.stages[si].picks[qix] = oix;
        } else {
          item = qs[qix];
          if (!item || cur.picks[qix] !== null && cur.picks[qix] !== undefined) return;
          cur.picks[qix] = oix;
        }
        const isCorrect = oix === item.correct;
        if (grammarLessonComplete(lessonId)) grammarMarkLessonDone(lessonId);
        saveState();
        beep(isCorrect);
        if (isCorrect) {
          setTimeout(() => {
            if (tag === "final") {
              const nf = (L.quizComprehensive || []).length;
              if (nf && cur.final.quizPos < nf - 1) cur.final.quizPos++;
            } else if (tag.startsWith("stage:")) {
              const si = parseInt(tag.slice("stage:".length), 10);
              const n = (L.quizStages[si].quiz || []).length;
              if (n && cur.stages[si].quizPos < n - 1) cur.stages[si].quizPos++;
            } else if (qs.length && cur.quizPos < qs.length - 1) {
              cur.quizPos++;
            }
            saveState();
            render();
          }, 420);
        }
        render();
      };
    });

    $("[data-back]")?.addEventListener("click", () => (location.hash = back));
  }

  function renderGrammarFinal() {
    const v = $("#view");
    const unitCatId = grammarSeg.unitQuiz || "";
    const isUnit = !!unitCatId;
    const poolMaster = isUnit ? grammarQuizPoolForCategory(unitCatId) : grammarQuizPoolAll;
    const catMeta = isUnit ? grammarCategoryById(unitCatId) : null;
    const examLabel = isUnit
      ? lang === "en" && catMeta && catMeta.title_en && String(catMeta.title_en).trim()
        ? String(catMeta.title_en).trim()
        : catMeta && catMeta.title_ar
          ? catMeta.title_ar
          : t("gramUnitQuizTitle")
      : t("gramFinalBtn");

    const inFinalReview = grammarSeg.final && grammarSeg.review;
    const inUnitReview = !!(grammarSeg.unitQuiz && grammarSeg.unitReview);
    const inAnyReview = inFinalReview || inUnitReview;

    if (inAnyReview) {
      if (!grammarFinalSession || grammarFinalSession.phase !== "done" || !grammarFinalSession.results) {
        location.hash = inUnitReview ? "#/grammar/quiz/" + encodeURIComponent(unitCatId) : "#/grammar/final";
        return;
      }
      const R = grammarFinalSession.results;
      const rows = R.items
        .map((it, i) => {
          const ok = it.pick === it.correct;
          return `<div class="qrow">
          <div class="t">${i + 1}. ${esc(it.question_en)}</div>
          <div class="m">${ok ? "✓" : "✗"} · ${esc(it.lessonTitle || "")}</div>
          <div style="font-size:13px;margin-top:8px;color:var(--muted)">${esc(t("correctShort"))}: ${esc(it.options[it.correct])}</div>
        </div>`;
        })
        .join("");
      v.innerHTML = `
        ${backBar("#/grammar/tests")}
        <div class="hero">
          <h2>${esc(t("gramFinalReview"))}</h2>
          <p class="lead">${esc(R.score + "/" + R.total)} · ${R.pct}%</p>
        </div>
        <div class="rowlist">${rows}</div>
        <div class="toolbar">
          <button type="button" class="btn btn-primary" id="gramRetakeBtn">${esc(t("gramRetake"))}</button>
        </div>`;
      $("#gramRetakeBtn").onclick = () => {
        grammarFinalSession = null;
        location.hash = inUnitReview ? "#/grammar/quiz/" + encodeURIComponent(unitCatId) : "#/grammar/final";
      };
      $("[data-back]")?.addEventListener("click", () => (location.hash = "#/grammar/tests"));
      return;
    }

    if (!grammarFinalSession) {
      if (!poolMaster.length) {
        v.innerHTML = `
        ${backBar("#/grammar/tests")}
        <div class="hero">
          <h2>${esc(isUnit ? t("gramUnitQuizTitle") : t("gramFinalBtn"))}</h2>
          <p class="lead">${esc(isUnit ? t("gramUnitNoQuestions") : t("gramFinalNoPool"))}</p>
        </div>`;
        $("[data-back]")?.addEventListener("click", () => (location.hash = "#/grammar/tests"));
        return;
      }
      const introLead = isUnit
        ? (lang === "ar"
            ? `أسئلة عشوائية من دروس هذه الوحدة (حتى ٥٠ سؤالًا). المتاح: ${poolMaster.length} سؤالًا.`
            : `Random questions from this unit (up to 50). Available: ${poolMaster.length}.`)
        : lang === "ar"
          ? "٥٠ سؤالًا عشوائيًا من جميع الدروس"
          : "50 random questions from all lessons";
      v.innerHTML = `
        ${backBar("#/grammar/tests")}
        <div class="hero">
          <h2>${esc(examLabel)}</h2>
          <p class="lead">${esc(introLead)}</p>
          <label style="display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:650">
            <input type="checkbox" id="gramTimerCk"/> ${esc(t("gramTimerOpt"))}
          </label>
          <button type="button" class="btn btn-primary" style="margin-top:16px" id="gramStartFinal">${esc(t("gramStartFinal"))}</button>
        </div>`;
      $("#gramStartFinal").onclick = () => {
        const useTimer = $("#gramTimerCk").checked;
        const pool = shuffle(poolMaster.slice());
        const n = Math.min(50, pool.length);
        const items = pool.slice(0, n);
        const timerEnd = useTimer ? Date.now() + 10 * 60 * 1000 : 0;
        grammarFinalSession = {
          phase: "run",
          items,
          picks: Array(n).fill(null),
          pos: 0,
          useTimer,
          timerEnd,
          intervalId: null,
        };
        if (useTimer && timerEnd) {
          grammarFinalSession.intervalId = setInterval(() => {
            const left = Math.max(0, grammarFinalSession.timerEnd - Date.now());
            const el = $("#gramFinalTimerDisp");
            if (el) {
              const mm = Math.floor(left / 60000);
              const ss = Math.floor((left % 60000) / 1000);
              el.textContent = `${mm}:${String(ss).padStart(2, "0")}`;
            }
            if (left <= 0) {
              grammarFinalizeResults();
              render();
            }
          }, 400);
        }
        render();
      };
      $("[data-back]")?.addEventListener("click", () => (location.hash = "#/grammar/tests"));
      return;
    }

    if (grammarFinalSession.phase === "run") {
      const S = grammarFinalSession;
      const total = S.items.length;
      const cur = S.items[S.pos];
      const lesson = grammarLessonsById[cur.lessonId];
      const lessonTitle = lesson ? lesson.title_en : "";
      const picked = S.picks[S.pos];
      const locked = picked !== null && picked !== undefined;
      const okAns = locked && picked === cur.correct;
      const deepWrong = locked && !okAns ? grammarDeepFeedbackHtml(cur, picked) : "";
      const gramRevExam =
        locked && !okAns
          ? grammarReviewOfferHtml(
              cur.lessonId || "_",
              S.pos,
              isUnit ? `finalUnit:${unitCatId}` : "finalAll"
            )
          : "";
      const letters = ["A", "B", "C"];
      const opts = cur.options
        .map((op, oi) => {
          let cls = "opt";
          if (locked) cls += oi === cur.correct ? " correct" : picked === oi ? " wrong" : "";
          return `<button type="button" class="${cls}" data-fo="${oi}" ${locked ? "disabled" : ""}><span class="L">${letters[oi]}</span><span class="txt gram-opt-tok" dir="ltr" id="gramFinal-opt-${oi}"></span></button>`;
        })
        .join("");

      const timeRow =
        S.useTimer && S.timerEnd ? `<div class="gram-toolbar"><span class="gram-final-timer" id="gramFinalTimerDisp"></span></div>` : "";

      const nFinalAns = S.picks.filter((x) => x !== null && x !== undefined).length;

      v.innerHTML = `
        ${backBar("#/grammar/tests")}
        ${timeRow}
        <div class="panel">
          <div class="qnum">${esc(examLabel)} · ${S.pos + 1} / ${total}</div>
          <p class="gram-final-remain">${esc(fmtAnswerRemainLine("quizAnswerRemainLine", nFinalAns, total))}</p>
          <p class="qtext gram-q-line" dir="ltr"><span id="gramFinalQTok" class="gram-q-tokens-host"></span></p>
          <p style="font-size:12px;color:var(--muted);font-weight:650">${esc(lessonTitle)}</p>
          <div class="opts" id="gramFinalOpts">${opts}</div>
          ${
            locked
              ? `<div class="learn" id="gramFinalLearn">
            <div class="lblock"><h4>${esc(t("gramWhy"))}</h4><div class="ar">${esc(cur.why_ar)}</div></div>
            <div class="lblock"><h4>${esc(t("gramUsedRule"))}</h4><div class="ar">${esc(cur.rule_ar)}</div></div>
            ${deepWrong}
            ${gramRevExam}
          </div>`
              : ""
          }
          <div class="pillrow" style="margin-top:16px">
            <button type="button" class="btn btn-sec" id="gramFinalPrev" ${S.pos ? "" : "disabled"}>${esc(t("prev"))}</button>
            <button type="button" class="btn btn-primary" id="gramFinalNext">${esc(t("next"))}</button>
          </div>
        </div>`;

      wireGrammarExamTokens(v, cur, "gramFinalQTok", "gramFinal-opt-");
      bindGrammarReviewOfferClicks(v);

      if (S.useTimer && S.timerEnd) {
        const el = $("#gramFinalTimerDisp");
        if (el) {
          const left = Math.max(0, S.timerEnd - Date.now());
          const mm = Math.floor(left / 60000);
          const ss = Math.floor((left % 60000) / 1000);
          el.textContent = `${mm}:${String(ss).padStart(2, "0")}`;
        }
      }

      $("#gramFinalOpts").querySelectorAll(".opt").forEach((btn) => {
        btn.onclick = () => {
          if (locked) return;
          const oi = parseInt(btn.getAttribute("data-fo"), 10);
          S.picks[S.pos] = oi;
          const isCorrect = oi === cur.correct;
          saveState();
          beep(isCorrect);
          if (isCorrect) {
            setTimeout(() => {
              if (S.pos < total - 1) {
                S.pos++;
                saveState();
                render();
              } else {
                grammarFinalizeResults();
                render();
              }
            }, 420);
          }
          render();
        };
      });

      $("#gramFinalPrev").onclick = () => {
        if (S.pos > 0) {
          S.pos--;
          render();
        }
      };

      $("#gramFinalNext").onclick = () => {
        if (!locked) {
          toast(t("pickAnswer"), "bad");
          return;
        }
        if (S.pos < total - 1) {
          S.pos++;
          render();
        } else {
          grammarFinalizeResults();
          render();
        }
      };

      $("[data-back]")?.addEventListener("click", () => (location.hash = "#/grammar/tests"));
      return;
    }

    if (grammarFinalSession.phase === "done") {
      const R = grammarFinalSession.results;
      v.innerHTML = `
        ${backBar("#/grammar/tests")}
        <div class="hero">
          <h2>${esc(t("gramScore"))}</h2>
          <p class="lead">${esc(R.score + "/" + R.total)} — ${esc(t("gramPct"))}: ${R.pct}%</p>
        </div>
        <div class="kpis">
          <div class="kpi"><div class="v">${esc(String(R.pct))}%</div><div class="l">${esc(t("gramPct"))}</div></div>
          <div class="kpi"><div class="v">${esc(String(R.score))}</div><div class="l">${esc(t("correctShort"))}</div></div>
          <div class="kpi"><div class="v">${esc(String(R.total))}</div><div class="l">${esc(t("solved"))}</div></div>
        </div>
        <div class="toolbar">
          <button type="button" class="btn btn-primary" id="gramRevBtn">${esc(t("gramFinalReview"))}</button>
          <button type="button" class="btn btn-sec" id="gramRetake2">${esc(t("gramRetake"))}</button>
        </div>`;
      $("#gramRevBtn").onclick = () => {
        location.hash = isUnit
          ? "#/grammar/quiz/" + encodeURIComponent(unitCatId) + "/review"
          : "#/grammar/final/review";
      };
      $("#gramRetake2").onclick = () => {
        grammarFinalSession = null;
        location.hash = isUnit ? "#/grammar/quiz/" + encodeURIComponent(unitCatId) : "#/grammar/final";
      };
      $("[data-back]")?.addEventListener("click", () => (location.hash = "#/grammar/tests"));
      return;
    }
  }

  function grammarAuditReadJson(elId) {
    if (typeof __GRAMMAR_AUDIT_EMBED__ !== "undefined" && __GRAMMAR_AUDIT_EMBED__ && Object.prototype.hasOwnProperty.call(__GRAMMAR_AUDIT_EMBED__, elId)) {
      return __GRAMMAR_AUDIT_EMBED__[elId];
    }
    try {
      const el = document.getElementById(elId);
      if (!el || !String(el.textContent || "").trim()) return null;
      return JSON.parse(el.textContent);
    } catch (_) {
      return null;
    }
  }

  /** دوري (وحدات 1–8) + ذاتي (مستقل)، بدون تكرار نفس السؤال الإنجليزي — يُحمَّل من blended_unique_quiz.json */
  function grammarBlendedPoolItems() {
    const data = grammarAuditReadJson("blended-unique-quiz-json");
    const raw = data && Array.isArray(data.items) ? data.items : [];
    return raw.map((it) => ({
      lessonId: it.lessonId,
      question_en: it.question_en,
      options: it.options,
      correct: it.correct,
      why_ar: it.why_ar,
      rule_ar: it.rule_ar,
    }));
  }

      const introLead =
        lang === "ar"
          ? `أسئلة غير مكررة بعد دمج «اختبار الوحدات 1–8» و«الوحدة المستقلة». المتاح: ${poolMaster.length} سؤالًا.${dupStr}`
          : `Unique pool: units 1–8 + standalone irregular verbs. Available: ${poolMaster.length}.${dupStr}`;
      v.innerHTML = `
        ${backBar("#/grammar/tests")}
        <div class="hero">
          <h2>${esc(examLabel)}</h2>
          <p class="lead">${esc(introLead)}</p>
          <label style="display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:650">
            <input type="checkbox" id="gramBlendedTimerCk"/> ${esc(t("gramTimerOpt"))}
          </label>
          <button type="button" class="btn btn-primary" style="margin-top:16px" id="gramBlendedStart">${esc(t("gramStartFinal"))}</button>
        </div>`;
      $("#gramBlendedStart").onclick = () => {
        const useTimer = $("#gramBlendedTimerCk").checked;
        const pool = shuffle(poolMaster.slice());
        const n = Math.min(50, pool.length);
        const items = pool.slice(0, n);
        const timerEnd = useTimer ? Date.now() + 10 * 60 * 1000 : 0;
        grammarBlendedSession = {
          phase: "run",
          items,
          picks: Array(n).fill(null),
          pos: 0,
          useTimer,
          timerEnd,
          intervalId: null,
        };
        if (useTimer && timerEnd) {
          grammarBlendedSession.intervalId = setInterval(() => {
            const left = Math.max(0, grammarBlendedSession.timerEnd - Date.now());
            const el = $("#gramBlendedTimerDisp");
            if (el) {
              const mm = Math.floor(left / 60000);
              const ss = Math.floor((left % 60000) / 1000);
              el.textContent = `${mm}:${String(ss).padStart(2, "0")}`;
            }
            if (left <= 0) {
              grammarFinalizeBlendedResults();
              render();
            }
          }, 400);
        }
        render();
      };
      $("[data-back]")?.addEventListener("click", () => (location.hash = "#/grammar/tests"));
      return;
    }

    if (grammarBlendedSession.phase === "run") {
      const S = grammarBlendedSession;
      const total = S.items.length;
      const cur = S.items[S.pos];
      const picked = S.picks[S.pos];
      const locked = picked !== null && picked !== undefined;
      const okAns = locked && picked === cur.correct;
      const deepWrong = locked && !okAns ? grammarDeepFeedbackHtml(cur, picked) : "";
      const gramRevBlend =
        locked && !okAns
          ? grammarReviewOfferHtml(cur.lessonId || "_", S.pos, "blended")
          : "";
      const letters = ["A", "B", "C"];
      const opts = cur.options
        .map((op, oi) => {
          let cls = "opt";
          if (locked) cls += oi === cur.correct ? " correct" : picked === oi ? " wrong" : "";
          return `<button type="button" class="${cls}" data-bfo="${oi}" ${locked ? "disabled" : ""}><span class="L">${letters[oi]}</span><span class="txt gram-opt-tok" dir="ltr" id="gramBlended-opt-${oi}"></span></button>`;
        })
        .join("");
      const timeRow =
        S.useTimer && S.timerEnd ? `<div class="gram-toolbar"><span class="gram-final-timer" id="gramBlendedTimerDisp"></span></div>` : "";
      const nFinalAns = S.picks.filter((x) => x !== null && x !== undefined).length;

      v.innerHTML = `
        ${backBar("#/grammar/tests")}
        ${timeRow}
        <div class="panel">
          <div class="qnum">${esc(examLabel)} · ${S.pos + 1} / ${total}</div>
          <p class="gram-final-remain">${esc(fmtAnswerRemainLine("quizAnswerRemainLine", nFinalAns, total))}</p>
          <p class="qtext gram-q-line" dir="ltr"><span id="gramBlendedQTok" class="gram-q-tokens-host"></span></p>
          <div class="opts" id="gramBlendedOpts">${opts}</div>
          ${
            locked
              ? `<div class="learn" id="gramBlendedLearn">
            <div class="lblock"><h4>${esc(t("gramWhy"))}</h4><div class="ar">${esc(cur.why_ar)}</div></div>
            <div class="lblock"><h4>${esc(t("gramUsedRule"))}</h4><div class="ar">${esc(cur.rule_ar)}</div></div>
            ${deepWrong}
            ${gramRevBlend}
          </div>`
              : ""
          }
          <div class="pillrow" style="margin-top:16px">
            <button type="button" class="btn btn-sec" id="gramBlendedPrev" ${S.pos ? "" : "disabled"}>${esc(t("prev"))}</button>
            <button type="button" class="btn btn-primary" id="gramBlendedNext">${esc(t("next"))}</button>
          </div>
        </div>`;

      wireGrammarExamTokens(v, cur, "gramBlendedQTok", "gramBlended-opt-");
      bindGrammarReviewOfferClicks(v);

      if (S.useTimer && S.timerEnd) {
        const el = $("#gramBlendedTimerDisp");
        if (el) {
          const left = Math.max(0, S.timerEnd - Date.now());
          const mm = Math.floor(left / 60000);
          const ss = Math.floor((left % 60000) / 1000);
          el.textContent = `${mm}:${String(ss).padStart(2, "0")}`;
        }
      }

      $("#gramBlendedOpts").querySelectorAll(".opt").forEach((btn) => {
        btn.onclick = () => {
          if (locked) return;
          const oi = parseInt(btn.getAttribute("data-bfo"), 10);
          S.picks[S.pos] = oi;
          const isCorrect = oi === cur.correct;
          saveState();
          beep(isCorrect);
          if (isCorrect) {
            setTimeout(() => {
              if (S.pos < total - 1) {
                S.pos++;
                saveState();
                render();
              } else {
                grammarFinalizeBlendedResults();
                render();
              }
            }, 420);
          }
          render();
        };
      });

      $("#gramBlendedPrev").onclick = () => {
        if (S.pos > 0) {
          S.pos--;
          render();
        }
      };

      $("#gramBlendedNext").onclick = () => {
        if (!locked) {
          toast(t("pickAnswer"), "bad");
          return;
        }
        if (S.pos < total - 1) {
          S.pos++;
          render();
        } else {
          grammarFinalizeBlendedResults();
          render();
        }
      };

      $("[data-back]")?.addEventListener("click", () => (location.hash = "#/grammar/tests"));
      return;
    }

    if (grammarBlendedSession.phase === "done") {
      const R = grammarBlendedSession.results;
      v.innerHTML = `
        ${backBar("#/grammar/tests")}
        <div class="hero">
          <h2>${esc(t("gramScore"))}</h2>
          <p class="lead">${esc(R.score + "/" + R.total)} — ${esc(t("gramPct"))}: ${R.pct}%</p>
        </div>
        <div class="kpis">
          <div class="kpi"><div class="v">${esc(String(R.pct))}%</div><div class="l">${esc(t("gramPct"))}</div></div>
          <div class="kpi"><div class="v">${esc(String(R.score))}</div><div class="l">${esc(t("correctShort"))}</div></div>
          <div class="kpi"><div class="v">${esc(String(R.total))}</div><div class="l">${esc(t("solved"))}</div></div>
        </div>
        <div class="toolbar">
          <button type="button" class="btn btn-primary" id="gramBlendedRevBtn">${esc(t("gramFinalReview"))}</button>
          <button type="button" class="btn btn-sec" id="gramBlendedRetake2">${esc(t("gramRetake"))}</button>
        </div>`;
      $("#gramBlendedRevBtn").onclick = () => {
        location.hash = "#/grammar/blended-quiz/review";
      };
      $("#gramBlendedRetake2").onclick = () => {
        grammarBlendedSession = null;
        location.hash = "#/grammar/blended-quiz";
      };
      $("[data-back]")?.addEventListener("click", () => (location.hash = "#/grammar/tests"));
      return;
    }
  }

      </div>
      ${
        summary
          ? `<div class="panel">
        <h3 style="margin-top:0">${esc(t("gramReviewSummary"))}</h3>

        <p style="margin-top:12px;font-size:13px"><strong>totalGrammarQuizItems:</strong> ${esc(String(summary.totalGrammarQuizItems || ""))}
        · <strong>standaloneOnlyCount:</strong> ${esc(String(summary.standaloneOnlyCount || ""))}

  function renderGrammar() {
    if (grammarSeg.track === "g2") {
      renderGrammar2Landing();
      return;
    }
    if (grammarSeg.blendedQuiz) {
      renderGrammarBlendedQuiz();
      return;
    }
    if (grammarSeg.reviewSolutions) {
      renderGrammarReviewSolutions();
      return;
    }
    if (grammarSeg.final || grammarSeg.unitQuiz) {
      renderGrammarFinal();
      return;
    }
    if (grammarSeg.lesson) {
      renderGrammarLesson(grammarSeg.lesson);
      return;
    }
    if (grammarSeg.cat) {
      renderGrammarCategory(grammarSeg.cat);
      return;
    }
    if (grammarSeg.hubTab === "lessons") {
      renderGrammarLessonsHub();
      return;
    }
    if (grammarSeg.hubTab === "tests") {
      renderGrammarTestsHub();
      return;
    }
    renderGrammarLanding();
  }

  function renderVocabBrowse(all) {
    const needle = vocabFilter.trim().toLowerCase();
    const matchRow = (r) =>
      !needle || r.en.toLowerCase().includes(needle) || r.ar.includes(needle);
    const keyForRow = (r) => String(r?.en || "").trim().toLowerCase();
    const isKnown = (r) => {
      const k = keyForRow(r);
      return !!(k && state.vocabKnown && state.vocabKnown[k]);
    };

    const eligible = vocabQuizEligible(all);
    const byPhase = {};
    for (const pid of VOCAB_PHASE_ORDER) byPhase[pid] = [];
    for (const r of eligible) {
      const pid = vocabPhaseIdForRow(r);
      if (!byPhase[pid]) byPhase[pid] = [];
      byPhase[pid].push(r);
    }

    const mount = $("#vocBrowseMount");
    if (!mount) return;
    mount.innerHTML = `
      <label class="search" style="margin-top:4px;display:flex"><input type="search" id="vq" placeholder="${esc(t("vocabSearch"))}" value="${esc(vocabFilter)}"/></label>
      <div class="voc-browse-tools">
        <button type="button" class="btn btn-sec" id="vocOnlyUnknown" aria-pressed="${state.vocabShowUnknownOnly ? "true" : "false"}">${esc(
          state.vocabShowUnknownOnly ? "عرض الكل" : "غير المفهومة فقط"
        )}</button>
        <button type="button" class="btn btn-sec" id="vocClearKnown">${esc("مسح كل الصحّات")}</button>
      </div>
      <div class="panel" id="vlist" style="margin-top:14px"></div>`;
    $("#vq").addEventListener("input", (e) => {
      vocabFilter = e.target.value;
      renderVocabHub();
    });
    $("#vocOnlyUnknown").addEventListener("click", () => {
      state.vocabShowUnknownOnly = !state.vocabShowUnknownOnly;
      saveState();
      renderVocabHub();
    });
    $("#vocClearKnown").addEventListener("click", () => {
      state.vocabKnown = {};
      saveState();
      renderVocabHub();
    });
    const box = $("#vlist");

    const sections = VOCAB_PHASE_ORDER.map((pid) => {
      const rows = (byPhase[pid] || [])
        .filter(matchRow)
        .filter((r) => (state.vocabShowUnknownOnly ? !isKnown(r) : true));
      if (!rows.length) return "";
      const title = vocabPhaseDisplayTitle(pid);
      const openOn = state.vocabPhaseOpen && state.vocabPhaseOpen[pid] !== undefined ? !!state.vocabPhaseOpen[pid] : true;
      const inner = `
        <div class="voc-hub-wrap">
          <div class="voc-hub-head"><span>${esc(t("vocColWord"))}</span><span>${esc(t("vocColMean"))}</span><span style="text-align:end">${esc(t("vocSource"))}</span><span style="text-align:end">${esc("تم")}</span></div>
          <div class="voc-hub-body">
            ${rows
              .map(
                (r) => {
                  const k = keyForRow(r);
                  const on = isKnown(r);
                  return `<div class="voc-hub-row" data-vk="${esc(k)}">
                    <span class="w-en">${esc(r.en)}</span>
                    <span class="w-ar">${esc(r.ar)}</span>
                    <span class="voc-tag ${r.isBank ? "bank" : "auto"}">${esc(r.isBank ? t("vocLegendBank") : t("vocLegendAuto"))}</span>
                    <button type="button" class="voc-known-btn ${on ? "on" : ""}" data-vk="${esc(k)}" aria-pressed="${on ? "true" : "false"}">${esc(on ? "✓" : "تم")}</button>
                  </div>`;
                }
              )
              .join("")}
          </div>
        </div>`;
      return `<details class="voc-phase-details"${openOn ? " open" : ""} data-vpid="${esc(pid)}"><summary class="voc-phase-sum"><span>${esc(
        title,
      )}</span><span class="voc-phase-count">${rows.length}</span></summary>${inner}</details>`;
    }).join("");

    if (!eligible.length) {
      box.innerHTML = `<div class="empty">${esc(t("vocEmpty"))}</div>`;
    } else if (!sections.trim()) {
      box.innerHTML = `<div class="empty">${esc(t("vocabNoResults"))}</div>`;
    } else {
      box.innerHTML = sections;
    }

    // Toggle “known / understood” per word
    box.querySelectorAll("[data-vk].voc-known-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const k = String(btn.getAttribute("data-vk") || "").trim().toLowerCase();
        if (!k) return;
        if (!state.vocabKnown || typeof state.vocabKnown !== "object") state.vocabKnown = {};
        state.vocabKnown[k] = !state.vocabKnown[k];
        saveState();
        renderVocabHub();
      });
    });

    // Persist open/close state per phase so it doesn't collapse on rerender
    box.querySelectorAll("details.voc-phase-details[data-vpid]").forEach((d) => {
      d.addEventListener("toggle", () => {
        const pid = d.getAttribute("data-vpid");
        if (!pid) return;
        if (!state.vocabPhaseOpen || typeof state.vocabPhaseOpen !== "object") state.vocabPhaseOpen = {};
        state.vocabPhaseOpen[pid] = !!d.open;
        saveState();
      });
    });
  }

  function renderVocabQuizUi(all) {
    const main = $("#vocQuizArea") || $("#vocMain");
    const effPhase = vocabQuizMode === "allWords" ? "all" : vocabQuizPhase;
    const pool = vocQ.pool.length ? vocQ.pool : vocabRowsForPhaseFilter(all, effPhase);
    if (pool.length < 2) {
      main.innerHTML = `<div class="panel"><p class="empty">${esc(t("vocQuizTooFew"))}</p></div>`;
      return;
    }
    const totalR = vocQ.order.length;
    const finished = totalR > 0 && vocQ.pos >= totalR;
    if (finished) {
      main.innerHTML = `
        <div class="voc-quiz-card">
          ${vocQ.phaseKey && vocQ.phaseKey !== "all" ? `<p class="voc-quiz-prompt" style="margin-bottom:8px">${esc(t("vocQuizPhaseBadge"))}: ${esc(vocabPhaseDisplayTitle(vocQ.phaseKey))}</p>` : ""}
          <p class="voc-quiz-sum" style="text-align:center;margin-bottom:16px">${esc(t("vocQuizDone"))}</p>
          <p class="voc-quiz-sum" style="text-align:center;font-size:22px">${esc(t("vocQuizResult"))} <b>${vocQ.score}</b> / <b>${totalR}</b></p>
          <div style="margin-top:20px;text-align:center">
            <button type="button" class="btn btn-primary" id="vocAgain">${esc(t("vocQuizAgain"))}</button>
          </div>
        </div>`;
      $("#vocAgain").onclick = () => startVocabQuizRound(all);
      return;
    }
    const pi = vocQ.order[vocQ.pos];
    const row = vocQ.pool[pi];
    const n = vocQ.pos + 1;
    const vocAnsweredSoFar = vocQ.pos + (vocQ.locked ? 1 : 0);
    ensureStateReviews();
    const vk = String(row.en || "").trim().toLowerCase();
    const vocAlready = vk && state.vocabReview.includes(vk);
    const wrongPanelHtml = vocQ.wrongPick
      ? `<div class="voc-wrong-panel quiz-wrong-explain" style="margin-top:14px">
          <p>${esc(t("vocQuizCorrectWas"))}: <strong>${esc(row.ar)}</strong></p>
          ${
            vocAlready
              ? `<p class="home-tool-k" style="margin:10px 0 0">${esc(t("vocQuizInReview"))}</p>`
              : `<button type="button" class="btn btn-sec" id="vocAddRev">${esc(t("vocQuizAddReview"))}</button>`
          }
        </div>`
      : "";
    main.innerHTML = `
      <div class="voc-quiz-card">
        <div class="voc-quiz-foot" style="margin-top:0;margin-bottom:8px">
          ${vocQ.phaseKey && vocQ.phaseKey !== "all" ? `<span class="chip">${esc(t("vocQuizPhaseBadge"))}: ${esc(vocabPhaseDisplayTitle(vocQ.phaseKey))}</span>` : ""}
          <span class="chip">${esc(t("vocQuizProgress"))} ${n} / ${totalR}</span>
          <span class="chip">${esc(t("vocQuizResult"))} ${vocQ.score}</span>
        </div>
        <p class="voc-quiz-stats">${esc(fmtAnswerRemainLine("quizAnswerRemainLine", vocAnsweredSoFar, totalR))}</p>
        <p class="voc-quiz-prompt">${esc(t("vocQuizPrompt"))}</p>
        <div class="voc-quiz-word">${esc(row.en)}</div>
        <div class="voc-quiz-opts" id="vocOpts"></div>
        ${wrongPanelHtml}
        <div class="voc-quiz-foot">
          <span></span>
          <button type="button" class="btn btn-primary" id="vocNext" style="visibility:${vocQ.locked ? "visible" : "hidden"}">${esc(t("vocQuizNext"))}</button>
        </div>
      </div>`;
    const ox = $("#vocOpts");
    vocQ.opts.forEach((text, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      b.textContent = text;
      b.disabled = vocQ.locked;
      b.onclick = () => {
        if (vocQ.locked) return;
        vocQ.locked = true;
        const ok = i === vocQ.correctIdx;
        if (ok) vocQ.score++;
        beep(ok);
        ox.querySelectorAll("button").forEach((btn, j) => {
          btn.disabled = true;
          if (j === vocQ.correctIdx) btn.classList.add("correct");
          else if (j === i && !ok) btn.classList.add("wrong");
        });
        if (ok) {
          $("#vocNext").style.visibility = "hidden";
          setTimeout(() => {
            vocQ.pos++;
            vocQ.locked = false;
            vocQ.wrongPick = false;
            if (vocQ.pos >= vocQ.order.length) {
              renderVocabQuizUi(all);
              return;
            }
            const nextPi = vocQ.order[vocQ.pos];
            const mc = buildArMc(vocQ.pool, nextPi);
            vocQ.opts = mc.opts;
            vocQ.correctIdx = mc.correctIdx;
            renderVocabQuizUi(all);
          }, 420);
        } else {
          vocQ.wrongPick = true;
          $("#vocNext").style.visibility = "visible";
          renderVocabQuizUi(all);
        }
      };
      ox.appendChild(b);
    });
    $("#vocAddRev")?.addEventListener("click", () => {
      addVocabReviewWord(row.en);
      toast(t("vocQuizAddedReview"), "ok");
      renderVocabHub();
    });
    $("#vocNext").onclick = () => {
      vocQ.wrongPick = false;
      vocQ.pos++;
      vocQ.locked = false;
      if (vocQ.pos >= vocQ.order.length) {
        renderVocabQuizUi(all);
        return;
      }
      const nextPi = vocQ.order[vocQ.pos];
      const mc = buildArMc(vocQ.pool, nextPi);
      vocQ.opts = mc.opts;
      vocQ.correctIdx = mc.correctIdx;
      renderVocabQuizUi(all);
    };
  }

  function startVocabQuizRound(all) {
    const phaseKey = vocabQuizMode === "allWords" ? "all" : vocabQuizPhase;
    const pool = vocabRowsForPhaseFilter(all, phaseKey);
    if (pool.length < 2) {
      toast(t("vocQuizTooFew"), "bad");
      return;
    }
    vocQ.pool = pool;
    vocQ.phaseKey = phaseKey;
    vocQ.order = shuffle(pool.map((_, i) => i));
    vocQ.pos = 0;
    vocQ.score = 0;
    vocQ.locked = false;
    vocQ.wrongPick = false;
    const mc = buildArMc(pool, vocQ.order[0]);
    vocQ.opts = mc.opts;
    vocQ.correctIdx = mc.correctIdx;
    renderVocabQuizUi(all);
  }

  function renderDumpPage() {
    const v = $("#view");
    const buildJsonDump = () => {
      const out = {
        generatedAt: new Date().toISOString(),
        locale: lang,
        // from your embedded data (no guessing)
        quizzes: typeof QUESTION_BANK !== "undefined" ? QUESTION_BANK : null,
        grammar: typeof GRAMMAR_DATA !== "undefined" ? GRAMMAR_DATA : null,
        vocabBank: typeof VOCAB_BANK !== "undefined" ? VOCAB_BANK : null,
      };
      try {
        if (typeof READING_DATA !== "undefined") out.reading = READING_DATA;
      } catch (_) {}
      try {
        if (typeof __GRAMMAR_AUDIT_EMBED__ !== "undefined") out.grammarAudit = __GRAMMAR_AUDIT_EMBED__;
      } catch (_) {}
      return JSON.stringify(out, null, 2);
    };

    const buildPromptDump = () => {
      const parts = [];
      parts.push(`## Curriculum dump (for verification)`);
      parts.push(`- generatedAt: ${new Date().toISOString()}`);
      parts.push(`- locale: ${lang}`);

      // Quizzes / questions
      try {
        if (typeof QUESTION_BANK !== "undefined" && Array.isArray(QUESTION_BANK)) {
          parts.push(`\n## Question bank`);
          parts.push(`total: ${QUESTION_BANK.length}`);
          for (const q of QUESTION_BANK) {
            parts.push(`\n### ${q.id || "(no id)"} · quiz: ${q.quiz || ""}`);
            parts.push(`question_en: ${q.question_en || q.question || ""}`);
            if (Array.isArray(q.options)) parts.push(`options: ${q.options.join(" | ")}`);
            if (q.correct !== undefined && q.correct !== null) parts.push(`correctIndex: ${q.correct}`);
            if (q.arabic_explanation) parts.push(`arabic_explanation: ${q.arabic_explanation}`);
            if (q.why_answer_ar) parts.push(`why_answer_ar: ${q.why_answer_ar}`);
            if (q.grammar_rule_ar) parts.push(`grammar_rule_ar: ${q.grammar_rule_ar}`);
            if (q.common_mistake_ar) parts.push(`common_mistake_ar: ${q.common_mistake_ar}`);
            if (q.vocabulary) parts.push(`vocabulary: ${q.vocabulary}`);
            if (q.example_sentence_en) parts.push(`example_sentence_en: ${q.example_sentence_en}`);
            if (q.sentence_translation_ar || q.translation_ar) parts.push(`sentence_translation_ar: ${q.sentence_translation_ar || q.translation_ar}`);
            if (q.needs_review !== undefined) parts.push(`needs_review: ${String(!!q.needs_review)}`);
          }
        } else {
          parts.push(`\n## Question bank\n(not available)`);
        }
      } catch (_) {
        parts.push(`\n## Question bank\n(error while reading)`);
      }

      // Grammar
      try {
        if (typeof GRAMMAR_DATA !== "undefined" && GRAMMAR_DATA) {
          parts.push(`\n## Grammar data`);
          const cats = Array.isArray(GRAMMAR_DATA.categories) ? GRAMMAR_DATA.categories : [];
          parts.push(`categories: ${cats.length}`);
          for (const c of cats) {
            parts.push(`\n### category: ${c.id || ""}`);
            if (c.title_ar) parts.push(`title_ar: ${c.title_ar}`);
            if (c.title_en) parts.push(`title_en: ${c.title_en}`);
            if (c.desc_ar) parts.push(`desc_ar: ${c.desc_ar}`);
            if (c.desc_en) parts.push(`desc_en: ${c.desc_en}`);
            if (Array.isArray(c.lesson_slugs)) parts.push(`lesson_slugs: ${c.lesson_slugs.join(" | ")}`);
          }
        } else {
          parts.push(`\n## Grammar data\n(not available)`);
        }
      } catch (_) {
        parts.push(`\n## Grammar data\n(error while reading)`);
      }

      // Vocab bank
      try {
        if (typeof VOCAB_BANK !== "undefined" && Array.isArray(VOCAB_BANK)) {
          parts.push(`\n## Vocabulary bank`);
          parts.push(`pairs: ${VOCAB_BANK.length}`);
          for (const p of VOCAB_BANK) {
            if (!p || p.length < 2) continue;
            parts.push(`- ${String(p[0])} = ${String(p[1])}`);
          }
        } else {
          parts.push(`\n## Vocabulary bank\n(not available)`);
        }
      } catch (_) {
        parts.push(`\n## Vocabulary bank\n(error while reading)`);
      }

      // Optional embeds
      try {
        if (typeof __GRAMMAR_AUDIT_EMBED__ !== "undefined") {
          parts.push(`\n## Grammar audit embed (raw JSON below)`);
          parts.push(JSON.stringify(__GRAMMAR_AUDIT_EMBED__, null, 2));
        }
      } catch (_) {}
      try {
        if (typeof READING_DATA !== "undefined") {
          parts.push(`\n## Reading data (raw JSON below)`);
          parts.push(JSON.stringify(READING_DATA, null, 2));
        }
      } catch (_) {}

      return parts.join("\n");
    };

    const mode = "json";
    const txt = mode === "json" ? buildJsonDump() : buildPromptDump();
    v.innerHTML = `
      <div style="background:#fff;color:#111;min-height:calc(100dvh - 40px);padding:18px 14px;border-radius:14px;border:1px solid rgba(0,0,0,.08)">
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px">
          <div style="min-width:0">
            <h2 style="margin:0;font-size:18px;font-weight:900">منهج كامل (للتدقيق)</h2>
            <p style="margin:6px 0 0;font-size:12px;color:#444;font-weight:650;line-height:1.55">اختر الصيغة ثم انسخ النص. كل المحتوى هنا من بياناتك نفسها (بدون اختراع).</p>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button type="button" class="btn btn-sec" id="dumpModeJson" aria-pressed="true">JSON</button>
            <button type="button" class="btn btn-sec" id="dumpModePrompt" aria-pressed="false">نص (برومبت)</button>
            <button type="button" class="btn btn-primary" id="hiCopy">نسخ النص</button>
            <a class="btn btn-sec" href="#/" style="text-decoration:none">رجوع</a>
          </div>
        </div>
        <textarea id="hiTxt" readonly data-mode="json" style="width:100%;height:min(78vh,920px);resize:vertical;border-radius:12px;border:1px solid rgba(0,0,0,.15);padding:12px 12px;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, \"Liberation Mono\", \"Courier New\", monospace;font-size:12px;line-height:1.55;white-space:pre;overflow:auto;background:#fff;color:#111">${esc(
          txt,
        )}</textarea>
      </div>`;

    const setMode = (m) => {
      const ta = $("#hiTxt");
      ta.dataset.mode = m;
      $("#dumpModeJson").setAttribute("aria-pressed", m === "json" ? "true" : "false");
      $("#dumpModePrompt").setAttribute("aria-pressed", m === "prompt" ? "true" : "false");
      if (m === "json") ta.value = buildJsonDump();
      else ta.value = buildPromptDump();
    };
    $("#dumpModeJson").onclick = () => setMode("json");
    $("#dumpModePrompt").onclick = () => setMode("prompt");

    $("#hiCopy").onclick = async () => {
      const val = $("#hiTxt").value || "";
      try {
        await navigator.clipboard.writeText(val);
        toast("تم النسخ.", "ok");
      } catch (_) {
        $("#hiTxt").focus();
        $("#hiTxt").select();
        toast("لم يتم النسخ تلقائياً — تم تحديد النص، انسخه يدويًا.", "bad");

    };
  }

  function togglePanel(id, btn, allIds) {
    const p = $("#" + id);
    const on = !p.classList.contains("is-on");
    allIds.forEach((x) => {
      const el = $("#" + x);
      if (el) el.classList.remove("is-on");
    });
    document.querySelectorAll(".smart-bar .btn-sec").forEach((b) => b.classList.remove("on"));
    if (on) {
      p.classList.add("is-on");
      btn.classList.add("on");
    }
  }

  function renderReviewPage() {
    const v = $("#view");
    ensureStateReviews();
    const bankQs = questions.filter((q) => state.qs[q.id]?.rev);
    const allVoc = allVocabAgg();
    const vocByKey = new Map(allVoc.map((r) => [String(r.en || "").trim().toLowerCase(), r]));
    const gramItems = state.grammarReview.filter((x) => x && x.k);

    const bankRows =
      bankQs.length === 0
        ? ""
        : `<div class="rowlist rev-bank-list">${bankQs
            .map(
              (q) => `
          <div class="qrow" data-rev-qid="${esc(q.id)}">
            <div class="t"></div>
            <div class="m">${esc(displayQuizName(q.quiz))}</div>
            <div class="pillrow" style="margin-top:8px">
              <button type="button" class="btn btn-primary rev-open-q">${esc(t("reviewOpen"))}</button>
              <button type="button" class="btn btn-sec rev-master-q">${esc(t("reviewMasteredBtn"))}</button>
            </div>
          </div>`

      state.vocabReview.length === 0
        ? ""
        : `<div class="rowlist">${state.vocabReview
            .map((k) => {

              return `<div class="qrow" data-rev-voc="${esc(k)}">
            <div class="t" dir="ltr">${esc(row.en)}</div>
            <div class="m ar-text">${esc(row.ar)}</div>
            <div class="pillrow" style="margin-top:8px">
              <button type="button" class="btn btn-sec rev-master-voc">${esc(t("reviewMasteredBtn"))}</button>
            </div>
          </div>`;

            .join("")}</div>`;

    const grammarRows =
      gramItems.length === 0
        ? ""
        : `<div class="rowlist">${gramItems
            .map((ent) => {
              const k = ent.k;
              const parts = String(k).split("|");
              const lessonId = parts[0] || "";
              const tag = parts[1] || "";
              const qi = parts[2] || "0";
              const L = grammarLessonsById[lessonId];
              const title = L
                ? lang === "ar"
                  ? L.title_ar || L.title_en
                  : L.title_en || L.title_ar
                : lessonId;
              let tagLbl = t("gramSecQuiz");
              if (tag === "final") tagLbl = t("gramQuizComprehensiveTitle");
              else if (tag === "finalAll") tagLbl = t("gramFinalBtn");
              else if (tag.startsWith("finalUnit:")) tagLbl = t("gramUnitQuizTitle");
              else if (tag === "blended") tagLbl = t("gramBlendedShortBtn");
              else if (tag.startsWith("stage:")) {
                const sn = tag.slice("stage:".length);
                tagLbl = `${t("gramQuizStagesHeading")} (${sn})`;
              }
              return `<div class="qrow" data-rev-grk="${esc(k)}">
            <div class="t">${esc(title)}</div>
            <div class="m">${esc(tagLbl)} · #${parseInt(qi, 10) + 1}</div>
            <div class="pillrow" style="margin-top:8px">
              <button type="button" class="btn btn-primary rev-open-g">${esc(t("reviewOpen"))}</button>
              <button type="button" class="btn btn-sec rev-master-g">${esc(t("reviewMasteredBtn"))}</button>
            </div>
          </div>`;
            })
            .join("")}</div>`;

    const empty = !bankQs.length && !state.vocabReview.length && !gramItems.length;

    v.innerHTML = `
      ${backBar("#/")}
      <div class="hero">
        <h2>${esc(t("reviewPageTitle"))}</h2>
        <p class="lead">${esc(t("reviewPageLead"))}</p>
      </div>
      ${
        empty
          ? `<div class="panel"><p class="empty">${esc(t("reviewEmpty"))}</p></div>`
          : `
      ${bankQs.length ? `<section class="reading-block" style="margin-bottom:18px"><h3 class="reading-block-title">${esc(t("reviewSectionBank"))}</h3>${bankRows}</section>` : ""}
      ${state.vocabReview.length ? `<section class="reading-block" style="margin-bottom:18px"><h3 class="reading-block-title">${esc(t("reviewSectionVocab"))}</h3>${vocabRows}</section>` : ""}
      ${gramItems.length ? `<section class="reading-block" style="margin-bottom:18px"><h3 class="reading-block-title">${esc(t("reviewSectionGrammar"))}</h3>${grammarRows}</section>` : ""}`
      }`;

    const bankListEl = v.querySelector(".rev-bank-list");
    if (bankListEl) {
      bankQs.forEach((q, i) => {
        const row = bankListEl.querySelectorAll(".qrow")[i];
        if (!row) return;
        const te = row.querySelector(".t");
        const map = { ...vocabMap(q), ...EXTRA_HINTS, ...vocabCuratedMap() };
        tokenizeEn(te, q.question, map);
      });
    }

    v.querySelectorAll("[data-rev-qid]").forEach((row) => {
      const id = row.getAttribute("data-rev-qid");
      const q = questions.find((x) => x.id === id);
      if (!q) return;
      row.querySelector(".rev-open-q")?.addEventListener("click", () => {
        state.session.activeQuiz = q.quiz;
        const ix = (byQuiz[q.quiz] || []).findIndex((x) => x.id === q.id);
        state.session.activeIdx = ix < 0 ? 0 : ix;
        saveState();
        location.hash = "#/quiz";
      });
      row.querySelector(".rev-master-q")?.addEventListener("click", () => {
        const s = ensureQs(q.id);
        s.rev = false;
        saveState();
        toast(t("reviewRemovedToast"), "ok");
        render();
      });
    });

    v.querySelectorAll("[data-rev-voc]").forEach((row) => {
      const k = row.getAttribute("data-rev-voc");
      row.querySelector(".rev-master-voc")?.addEventListener("click", () => {
        state.vocabReview = state.vocabReview.filter((x) => x !== k);
        saveState();
        toast(t("reviewRemovedToast"), "ok");
        render();
      });
    });

    v.querySelectorAll("[data-rev-grk]").forEach((row) => {
      const k = row.getAttribute("data-rev-grk");
      row.querySelector(".rev-open-g")?.addEventListener("click", () => {
        const pipes = String(k).split("|");
        const lessonId = pipes[0] || "";
        const tag = pipes[1] || "";
        if (tag === "finalAll") {
          location.hash = "#/grammar/final";
          return;
        }
        if (tag.startsWith("finalUnit:")) {
          const uid = tag.slice("finalUnit:".length);
          location.hash = "#/grammar/quiz/" + encodeURIComponent(uid);
          return;
        }
        if (tag === "blended") {
          location.hash = "#/grammar/blended-quiz";
          return;
        }
        if (lessonId && lessonId !== "_") {
          location.hash = "#/grammar/lesson/" + encodeURIComponent(lessonId);
        }
      });
      row.querySelector(".rev-master-g")?.addEventListener("click", () => {
        state.grammarReview = state.grammarReview.filter((x) => !(x && x.k === k));
        saveState();
        toast(t("reviewRemovedToast"), "ok");
        render();
      });
    });

    $("[data-back]")?.addEventListener("click", () => (location.hash = "#/"));
  }

  function renderQuiz() {
    const v = $("#view");
    const name = state.session.activeQuiz || QUIZ_ORDER[0];
    const list = byQuiz[name] || [];
    if (!list.length) {
      v.innerHTML = `${backBar("#/tests")}<div class="panel"><p class="empty">${esc(t("emptyQuiz"))}</p></div>`;
      $("[data-back]")?.addEventListener("click", () => (location.hash = "#/tests"));
      return;
    }
    let idx = clamp(state.session.activeIdx, 0, list.length - 1);
    state.session.activeIdx = idx;
    const q = list[idx];
    const s = ensureQs(q.id);
    const map = { ...vocabMap(q), ...EXTRA_HINTS, ...vocabCuratedMap() };
    const locked = s.answered !== null;
    const answeredAll = countQuizListAnswered(list);
    const remainAll = Math.max(0, list.length - answeredAll);
    const progDone = list.length ? (answeredAll / list.length) * 100 : 0;
    const disp = displayQuizName(name);
    const yourPick = locked ? q.options[s.answered] : "";
    const correctPick = q.options[q.correctIndex];
    const autoWhyWrong = (() => {
      if (!locked || s.ok) return "";
      const opts = (q.options || []).map((x) => String(x || "").trim());
      const picked = String(yourPick || "").trim();
      const correct = String(correctPick || "").trim();
      const has = (x) => opts.includes(x);
      const join = (lines) => lines.filter(Boolean).join("\n");

      // Heuristics for common patterns in Quizzes 8/9/10
      if (has("many") && has("much")) {
        const isCorrectMuch = correct === "much";
        return join([
          "قاعدة سريعة: much للأسماء غير المعدودة (water, sugar, milk)، وmany للمعدودة (students, apples).",
          picked === "many" && isCorrectMuch ? "إجابتك many خطأ لأن الاسم هنا غير معدود." : "",
          picked === "much" && !isCorrectMuch ? "إجابتك much خطأ لأن الاسم هنا معدود (جمع)." : "",
        ]);
      }
      if (has("some") && has("any")) {
        return join([
          "قاعدة سريعة: any تُستخدم غالبًا في النفي والأسئلة العامة. some تُستخدم غالبًا في الإثبات، وتأتي في السؤال إذا كان عرضًا/طلبًا مهذبًا.",
          picked === "some" && correct === "any" ? "إجابتك some خطأ لأن السؤال هنا عام عن وجود شيء، وليس عرضًا/طلبًا." : "",
        ]);
      }
      if (has("wasn't") && has("weren't")) {
        return join([
          "قاعدة سريعة: wasn't للمفرد (I/he/she/it) وweren't للجمع (you/we/they).",
          picked === "wasn't" && correct === "weren't" ? "إجابتك wasn't خطأ لأن They/parents جمع." : "",
        ]);
      }
      if (has("didn't finish") && has("haven't finished")) {
        return join([
          "قاعدة سريعة: yet في النفي غالبًا مع المضارع التام (haven't/hasn't + V3) لأنها تعني «حتى الآن».",
          picked === "didn't finish" && correct === "haven't finished"
            ? "إجابتك didn't finish خطأ لأنها ماضٍ بسيط مرتبط بوقت منتهٍ، بينما yet تربط الفكرة بالحاضر (حتى الآن)."
            : "",
        ]);
      }
      if (has("good") && has("better") && has("best")) {
        return join([
          "قاعدة سريعة: مع (the) نستخدم superlative مثل best. أما better فهو comparative وغالبًا يحتاج than.",
          picked === "better" && correct === "best" ? "إجابتك better خطأ لأن وجود the هنا يعني أفضل شيء بين الكل، وليس مقارنة بين اثنين." : "",
        ]);
      }
      if (has("can") && has("could")) {
        return join([
          "قاعدة سريعة: can للحاضر، وcould للماضي (القدرة في الماضي).",
          picked === "can" && correct === "could" ? "إجابتك can خطأ لأن الجملة تحتوي when I was five (ماضٍ)." : "",
        ]);
      }
      if (has("watch") && has("watched") && has("were watching")) {
        return join([
          "قاعدة سريعة: (was/were + V-ing) للفعل المستمر في الخلفية + past simple لحدث مفاجئ مع when.",
          picked === "watched" && correct === "were watching"
            ? "إجابتك watched خطأ لأنها لا تعطي معنى الاستمرار وقت رنين الهاتف."
            : "",
        ]);
      }
      if (has("will") && has("would")) {
        return join([
          "قاعدة سريعة: الشرط الأول If + present → will. الشرط الثاني If + past → would.",
          picked === "would" && correct === "will" ? "إجابتك would خطأ لأن جملة الشرط هنا ليست If + past؛ هي If it rains (حاضر)." : "",
        ]);
      }
      if (has("are") && has("were") && has("was")) {
        return join([
          "قاعدة سريعة: في past continuous: I/he/she/it → was، وyou/we/they → were. وare للحاضر.",
          picked === "was" && correct === "were" ? "إجابتك was خطأ لأن you تحتاج were." : "",
          picked === "are" && correct === "were" ? "إجابتك are خطأ لأن السؤال عن الماضي (yesterday/last night)." : "",
        ]);
      }
      return "";
    })();
    const wrongBlock =
      locked && !s.ok
        ? `<div class="quiz-wrong-explain" id="quizWrongPanel">
          <h4>${esc(t("quizWrongExplainTitle"))}</h4>

          )}</span></p>
          <p class="quiz-wrong-meta" style="margin-top:6px"><strong>${esc("الإجابة الصحيحة")}:</strong> <span dir="ltr" style="font-family:var(--irr-en);font-weight:850">${esc(

          <p class="ar-text" style="margin-top:10px;white-space:pre-line">${esc(q.why_answer_ar || q.arabic_explanation || "—")}</p>
          ${autoWhyWrong ? `<p class="ar-text" style="margin-top:10px;white-space:pre-line">${esc(autoWhyWrong)}</p>` : ""}
          ${

          ${

              : ""
          }
        </div>`
        : "";
    const reviewNudgeBlock =
      locked && !s.ok && !s.rev && !s.skipReviewNudge
        ? `<div class="quiz-review-offer" id="quizReviewNudge">
          <p>${esc(t("reviewSaveOffer"))}</p>
          <div class="quiz-review-offer-actions">
            <button type="button" class="btn btn-primary" id="quizRevSave">${esc(t("reviewSaveBtn"))}</button>
            <button type="button" class="btn btn-sec" id="quizRevSkip">${esc(t("reviewSkipNudge"))}</button>
          </div>
        </div>`
        : "";
    const onListHint =
      locked && !s.ok && s.rev
        ? `<p class="home-tool-k quiz-review-on-list-hint" style="margin-top:12px">${esc(t("reviewOnListHint"))}</p>`
        : "";
    const focusOn = !!state.session.quizFocusMode;

    v.innerHTML = `
      <div class="quiz-page-head${focusOn ? " quiz-page-head--focus" : ""}">
        <div class="quiz-page-head-start">
          ${backBar("#/tests")}
          <button type="button" class="btn btn-sec quiz-pause-btn" id="quizPause">${esc(t("quizPauseBtn"))}</button>
        </div>
        <div class="quiz-page-head-trail">
          <div class="quiz-page-head-divider" aria-hidden="true"></div>
          <div class="quiz-page-head-end">
            ${answeredAll > 0 ? `<button type="button" class="btn btn-sec" id="quizRestart">${esc(t("quizRestartBtn"))}</button>` : ""}
            <div class="pillrow quiz-meta-pills">
              <button type="button" class="pill ${s.fav ? "on" : ""}" id="bf">${esc(t("favT"))}</button>
              <button type="button" class="pill ${s.hard ? "on" : ""}" id="bh">${esc(t("hardT"))}</button>
              <button type="button" class="pill ${s.rev ? "on" : ""}" id="br">${esc(t("revT"))}</button>
            </div>
          </div>
        </div>
      </div>
      <div class="panel quiz-panel${focusOn ? " quiz-panel--focus" : ""}">
        <div class="qhead">
          <div>
            <div class="qnum qnum-title">${esc(disp)}</div>
            <div class="quiz-qhead-stats">
            <div class="quiz-stat-grid" role="group" aria-label="${esc(t("testsTitle"))}">
              <div class="quiz-stat-cell">
                <span class="quiz-stat-k">${esc(t("quizStatAnsweredLabel"))}</span>
                <span class="quiz-stat-v">${answeredAll}<span style="opacity:.45;font-weight:700"> / ${list.length}</span></span>

        <div class="quiz-learn-layout">

    $("#quizRevSkip")?.addEventListener("click", () => {

    const qt = $("#qt");

    q.options.forEach((op, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      if (locked) {
        b.disabled = true;
        if (i === q.correctIndex) b.classList.add("correct");
        if (s.answered === i && i !== q.correctIndex) b.classList.add("wrong");
      }
      b.innerHTML = `<span class="L">${String.fromCharCode(65 + i)}</span><span class="txt" dir="ltr"></span>`;
      tokenizeEn(b.querySelector(".txt"), op, map);
      b.onclick = () => {
        if (locked) return;
        s.answered = i;
        s.ok = i === q.correctIndex;
        if (!s.ok) s.skipReviewNudge = false;
        s.t0 = Date.now();
        const dk = new Date().toISOString().slice(0, 10);
        if (state.daily.day !== dk) {
          state.daily.day = dk;
          state.daily.answered = 0;
        }
        if (s.dailyCounted !== dk) {
          s.dailyCounted = dk;
          state.daily.answered++;
        }
        saveState();
        beep(s.ok);
        if (!s.ok) {
          requestAnimationFrame(() => {
            $("#quizWrongPanel")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
          });

            saveState();
            render();
          }, 420);
        }
        render();
      };

    });

      state.session.activeIdx = clamp(idx - 1, 0, list.length - 1);

    $("#nx").onclick = () => {
      if (!locked) {
        toast(t("pickAnswer"), "bad");
        return;
      }
      state.session.activeIdx = clamp(idx + 1, 0, list.length - 1);
      saveState();
      render();
    };
    $("#bf").onclick = () => {
      s.fav = !s.fav;
      saveState();
      render();
    };
    $("#bh").onclick = () => {
      s.hard = !s.hard;
      saveState();
      render();
    };
    $("#br").onclick = () => {
      s.rev = !s.rev;
      saveState();
      render();
    };
    $("[data-back]")?.addEventListener("click", () => (location.hash = "#/tests"));
  }

  function render() {
    closeTopbarMenu();
    parseRoute();
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.documentElement.setAttribute("data-theme", theme);
    $("#brandTitle").textContent = "English Mastery";
    $("#tLang").textContent = lang === "ar" ? "EN" : "AR";
    $("#tTheme").textContent = theme === "dark" ? "☀" : "☾";
    $("#tSound").textContent = soundOn ? "🔊" : "🔇";
    renderNav();
    renderProgChip();
    if (route === "home") renderHub();
    else if (route === "tests") renderTests();
    else if (route === "quiz") renderQuiz();
    else if (route === "grammar") renderGrammar();
    else if (route === "vocab") renderVocabHub();
    else if (route === "reading") renderReading();
    else if (route === "progress") renderProgress();
    else if (route === "favorites") renderFavoritesPage();
    else if (route === "review") renderReviewPage();
    else if (route === "review-later") renderReviewLaterPage();
    else if (route === "dump") renderDumpPage();
    else renderHub();
    syncMobileTabbar();
    bindTopbarScroll();
    // لا نعيد تشغيل أنيميشن الدخول بعد أي ضغط/إعادة رسم
    try {
      document.body.classList.remove("anim-once");
    } catch (_) {}
  }

  function syncMobileTabbar() {
    const bar = $("#mobileTabbar");
    if (!bar) return;
    bar.querySelectorAll("[data-tkey]").forEach((el) => {
      const k = el.getAttribute("data-tkey");
      if (k) el.textContent = t(k);
    });
    const routes = {
      home: () => route === "home",
      tests: () => route === "tests" || route === "quiz" || route === "review-later",
      grammar: () => route === "grammar",
      progress: () =>
        route === "progress" ||
        route === "favorites" ||
        route === "vocab" ||
        route === "reading" ||
        route === "review" ||
        route === "review-later",
    };
    bar.querySelectorAll(".mobile-tab").forEach((a) => {
      const key = a.getAttribute("data-route");
      const active = routes[key] ? routes[key]() : false;
      a.classList.toggle("is-active", active);
      if (active) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }

  function updateTopbarMenuTop() {
    const tb = document.getElementById("topbar");
    if (!tb) return;
    const y = tb.getBoundingClientRect().bottom;
    document.documentElement.style.setProperty("--topbar-menu-top", `${Math.ceil(y)}px`);
  }

  function setTopbarMenuOpen(open) {
    const bar = document.getElementById("topbar");
    const btn = document.getElementById("topbarMenuBtn");
    const bd = document.getElementById("topbarBackdrop");
    if (!bar || !btn) return;
    const on = !!open;
    bar.classList.toggle("is-menu-open", on);
    btn.setAttribute("aria-expanded", on ? "true" : "false");
    if (bd) bd.setAttribute("aria-hidden", on ? "false" : "true");
    if (on) {
      updateTopbarMenuTop();
      document.body.style.overflow = "hidden";
    } else {
      document.body.style.overflow = "";
    }
  }

  function closeTopbarMenu() {
    setTopbarMenuOpen(false);
  }

  let topbarScrollBound = false;
  function bindTopbarScroll() {
    if (topbarScrollBound) return;
    const tb = document.querySelector(".topbar");
    if (!tb) return;
    topbarScrollBound = true;
    const onScroll = () => tb.classList.toggle("is-scrolled", window.scrollY > 6);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
  }

  function wire() {
    $("#goBrand").onclick = () => {
      closeTopbarMenu();
      location.hash = "#/";
    };
    $("#topbarMenuBtn")?.addEventListener("click", (e) => {
      e.stopPropagation();
      const bar = $("#topbar");
      setTopbarMenuOpen(!bar?.classList.contains("is-menu-open"));
    });
    $("#topbarBackdrop")?.addEventListener("click", closeTopbarMenu);
    $("#topbarCluster")?.addEventListener("click", (e) => {
      if (e.target.closest("#mainNav a")) closeTopbarMenu();
    });
    window.addEventListener(
      "resize",
      () => {
        if (window.innerWidth > 900) closeTopbarMenu();
        else updateTopbarMenuTop();
      },
      { passive: true },
    );
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if ($("#topbar")?.classList.contains("is-menu-open")) closeTopbarMenu();
    });
    $("#tLang").onclick = () => {
      lang = lang === "ar" ? "en" : "ar";
      localStorage.setItem("em:lang", lang);
      render();
    };
    $("#tTheme").onclick = () => {
      theme = theme === "dark" ? "light" : "dark";
      localStorage.setItem("em:theme", theme);
      render();
    };
    $("#tSound").onclick = () => {
      soundOn = !soundOn;
      localStorage.setItem("em:sound", soundOn ? "1" : "0");
      render();
    };
    window.addEventListener("hashchange", render);
    document.addEventListener("click", (e) => {
      if (!e.target.closest("#wtip") && !e.target.closest(".w-token")) {
        const tip = $("#wtip");
        if (tip) tip.style.display = "none";
      }
    });
    window.addEventListener("keydown", (e) => {
      if (route !== "quiz" || !questions.length) return;
      const name = state.session.activeQuiz;
      const list = byQuiz[name] || [];
      if (!list.length) return;
      const idx = state.session.activeIdx;
      const q = list[idx];
      const st = state.qs[q.id];
      if (e.key >= "1" && e.key <= "9") {
        const n = parseInt(e.key, 10) - 1;
        if (n >= 0 && n < q.options.length && st.answered === null) {
          $$(".opt", $("#opts"))[n]?.click();
        }
      }
    });
  }

  state = loadState();
  bootQuestions();
  bootGrammar();
  wire();
  render();
})();
</script>
</body>
</html>
