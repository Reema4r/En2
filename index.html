  /** English rule section line-starts — unified card layout (إثبات / نفي / سؤال وأمثالها) */
  const GRAMMAR_RULE_SECTION_PATTERN =
    "Affirmative|Negative|Questions|Positive|Usage(?:\\s+form)?|Form|Structure|Meaning|Summary|Examples?|Notes?|Pattern|Statement";

  function grammarRuleSectionHeaderRe() {
    return new RegExp(`^(${GRAMMAR_RULE_SECTION_PATTERN})\\s*(?:[:：]\\s*)?(?:[—–-]\\s*)?(.*)$`, "i");
  }

  function grammarSectionArabicFallback(normKey) {
    const k = String(normKey || "")
      .toLowerCase()
      .trim();
    const map = {
      affirmative: "gramRuleLblAff",
      positive: "gramRuleLblAff",
      negative: "gramRuleLblNeg",
      questions: "gramRuleLblQ",
      "usage form": "gramRuleLblUsage",
      usage: "gramRuleLblUsage",
      form: "gramRuleLblForm",
      structure: "gramRuleLblStructure",
      meaning: "gramRuleLblMeaning",
      summary: "gramRuleLblSummary",
      examples: "gramRuleLblExamples",
      example: "gramRuleLblExample",
      notes: "gramRuleLblNotes",
      pattern: "gramRuleLblPattern",
      statement: "gramRuleLblStatement",
    };
    const mk = map[k];
    return mk ? String(t(mk)).trim() : "";
  }

  function prettyEnglishSectionTitle(rawHeader) {
    return String(rawHeader || "")
      .trim()
      .toLowerCase()
      .replace(/\b[a-z]/g, (c) => c.toUpperCase());
  }

  /** True if short Arabic gloss on section header line (e.g. إثبات) vs English rule text */
  function grammarRuleLineIsArabicGloss(seg) {
    const s = String(seg || "").trim();
    if (!s) return false;
    const latin = (s.match(/[a-zA-Z]/g) || []).length;
    const hasAr = /[\u0600-\u06FF]/.test(s);
    return hasAr && latin < 5;
  }

  /** Split dense crib lines (; or middle dot ·) into spaced blocks */
  function grammarRuleOneVisualLine(ln) {
    const s = String(ln || "").trim();
    if (!s) return "";
    let parts = s.split(/\s*;\s*/).map((x) => x.trim()).filter(Boolean);
    if (parts.length <= 1) {
      const dotParts = s.split(/\s*·\s*/).map((x) => x.trim()).filter(Boolean);
      if (dotParts.length > 1) parts = dotParts;
    }
    if (parts.length > 1) {
      return `<div class="gram-rule-clauses" dir="ltr">${parts.map((c) => `<div class="gram-rule-clause">${esc(c)}</div>`).join("")}</div>`;
    }
    return `<p class="gram-rule-line" dir="ltr">${esc(s)}</p>`;
  }

  /** One visual block per source line; semicolons inside a line become stacked clauses */
  function grammarRuleBodyLines(body) {
    const lines = String(body || "")
      .split(/\n+/)
      .map((l) => l.trim())
      .filter(Boolean);
    if (!lines.length) return "";
    return lines.map((ln) => grammarRuleOneVisualLine(ln)).join("");
  }

  function grammarRuleEnLooksMultiline(text) {
    const tx = String(text || "").replace(/\r\n/g, "\n");
    if (!tx.trim()) return false;
    const reLine = new RegExp(`\\n\\s*(?:${GRAMMAR_RULE_SECTION_PATTERN})\\b`, "i");
    if (reLine.test(tx)) return true;
    const reFirst = new RegExp(`^(?:${GRAMMAR_RULE_SECTION_PATTERN})\\b[^\\n]{0,240}\\n`, "im");
    return reFirst.test(tx);
  }

  /** Section headers at line start + colon forms (same visual rhythm everywhere) */
  function grammarFormatRuleEnMultiline(text) {
    const lines = text.replace(/\r\n/g, "\n").split("\n");
    const headerRe = grammarRuleSectionHeaderRe();
    const blocks = [];
    const preambleLines = [];
    /** @type {{ headerRaw: string, gloss: string, lines: string[] } | null} */
    let cur = null;

    function flush() {
      if (!cur) return;
      const body = cur.lines.join("\n").trim();
      const titleEn = prettyEnglishSectionTitle(cur.headerRaw);
      const normKey = cur.headerRaw.toLowerCase().replace(/\s+/g, " ").trim();
      const labFallback = grammarSectionArabicFallback(normKey);
      const glossRaw = (cur.gloss && cur.gloss.trim()) || labFallback;
      const headHtml = glossRaw
        ? `<div class="gram-rule-head"><span class="gram-rule-kind" dir="ltr">${esc(titleEn)}</span><span class="gram-rule-head-sep" aria-hidden="true">—</span><span class="gram-rule-gloss">${esc(glossRaw)}</span></div>`
        : `<div class="gram-rule-head gram-rule-head-enonly"><span class="gram-rule-kind" dir="ltr">${esc(titleEn)}</span></div>`;
      const bodyHtml = grammarRuleBodyLines(body);
      blocks.push(`<div class="gram-rule-block">${headHtml}<div class="gram-rule-body">${bodyHtml}</div></div>`);
      cur = null;
    }

    for (const line of lines) {
      const m = line.match(headerRe);
      if (m) {
        flush();
        const rest = (m[2] || "").trim();
        cur = { headerRaw: m[1], gloss: "", lines: [] };
        if (rest && grammarRuleLineIsArabicGloss(rest)) {
          cur.gloss = rest;
        } else if (rest) {
          cur.lines.push(rest);
        }
      } else if (cur) {
        cur.lines.push(line);
      } else if (line.trim()) {
        preambleLines.push(line);
      }
    }
    flush();

    const preambleRaw = preambleLines.join("\n").trim();
    const preambleHtml = preambleRaw
      ? `<div class="gram-rule-preamble">${grammarRuleBodyLines(preambleRaw)}</div>`
      : "";

    return preambleHtml + blocks.join("");
  }

  /** Inline Affirmative: … Negative: … + same section keywords */
  function grammarFormatRuleEn(raw) {
    let text = String(raw || "").trim().replace(/\r\n/g, "\n");
    if (!text) return `<p class="empty">${esc(t("quizEmptySoon"))}</p>`;

    if (grammarRuleEnLooksMultiline(text)) {
      const out = grammarFormatRuleEnMultiline(text);
      return out || `<div class="gram-rule-block"><div class="gram-rule-body" dir="ltr">${grammarRuleBodyLines(text)}</div></div>`;
    }

    text = text.replace(new RegExp(`;\\s*(?=(?:${GRAMMAR_RULE_SECTION_PATTERN})\\s*:)`, "gi"), " ");
    const parts = text.split(new RegExp(`\\s+(?=(?:${GRAMMAR_RULE_SECTION_PATTERN})\\s*:)`, "i"));
    const blocks = [];
    const partHdr = new RegExp(`^(${GRAMMAR_RULE_SECTION_PATTERN})\\s*:\\s*(.*)$`, "is");
    for (const part of parts) {
      const p = part.trim();
      if (!p) continue;
      const m = p.match(partHdr);
      if (m) {
        const normKey = m[1].toLowerCase().replace(/\s+/g, " ").trim();
        const titleEn = prettyEnglishSectionTitle(m[1]);
        const labHint = grammarSectionArabicFallback(normKey);
        const headHtml = labHint
          ? `<div class="gram-rule-head"><span class="gram-rule-kind" dir="ltr">${esc(titleEn)}</span><span class="gram-rule-head-sep" aria-hidden="true">—</span><span class="gram-rule-gloss">${esc(labHint)}</span></div>`
          : `<div class="gram-rule-head gram-rule-head-enonly"><span class="gram-rule-kind" dir="ltr">${esc(titleEn)}</span></div>`;
        const inner = grammarRuleBodyLines(m[2].trim()) || `<p class="gram-rule-line" dir="ltr">${esc(m[2].trim())}</p>`;
        blocks.push(`<div class="gram-rule-block">${headHtml}<div class="gram-rule-body" dir="ltr">${inner}</div></div>`);
      } else {
        blocks.push(
          `<div class="gram-rule-block"><div class="gram-rule-body" dir="ltr">${grammarRuleBodyLines(p) || `<p class="gram-rule-line" dir="ltr">${esc(p)}</p>`}</div></div>`,
        );
      }
    }
    return blocks.length
      ? blocks.join("")
      : `<div class="gram-rule-block"><div class="gram-rule-body" dir="ltr">${grammarRuleBodyLines(text) || `<p class="gram-rule-line" dir="ltr">${esc(text)}</p>`}</div></div>`;
  }

    return t(msgKey).replace(/\{\{a\}\}/g, String(a)).replace(/\{\{tot\}\}/g, String(tot)).replace(/\{\{r\}\}/g, String(r));
  }

  function shuffle(a) {
    const arr = a.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;

  function buildArMc(pool, curIdx) {
    const cur = pool[curIdx];
    const correct = cur.ar;
    const wrongSet = [];
    for (let i = 0; i < pool.length; i++) {
      if (i === curIdx) continue;
      const a = pool[i].ar;
      if (a && a !== correct && !wrongSet.includes(a)) wrongSet.push(a);
    }
    shuffle(wrongSet);
    const need = Math.min(3, wrongSet.length);
    const wrong = wrongSet.slice(0, need);
    const merged = shuffle([correct, ...wrong]);
    return { opts: merged, correctIdx: merged.indexOf(correct) };
  }

  function beep(ok) {
    if (!soundOn) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      const n = ctx.currentTime;
      o.frequency.setValueAtTime(ok ? 760 : 280, n);
      g.gain.setValueAtTime(0.0001, n);
      g.gain.exponentialRampToValueAtTime(0.06, n + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, n + 0.1);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(n);
      o.stop(n + 0.11);
    } catch (_) {}
  }

  function blankState() {
    const d = new Date().toISOString().slice(0, 10);

  function loadState() {
    try {
      const legacyKey = "enmastery:v2";
      let raw = localStorage.getItem(LS) || localStorage.getItem(legacyKey);
      if (!raw) return blankState();
      const p = JSON.parse(raw);
      if (!p.qs || typeof p.qs !== "object") return blankState();
      if (!p.daily || typeof p.daily.day !== "string") p.daily = { day: new Date().toISOString().slice(0, 10), answered: 0 };
      const today = new Date().toISOString().slice(0, 10);
      if (p.daily.day !== today) p.daily = { day: today, answered: 0 };
      if (!Array.isArray(p.studentVocab)) p.studentVocab = [];
      if (!p.session) p.session = { activeQuiz: QUIZ_ORDER[0], activeIdx: 0, quizFocusMode: false };
      if (typeof p.session.quizFocusMode !== "boolean") p.session.quizFocusMode = false;
      try {
        delete p.session.quizCompactOpts;
      } catch (_) {}
      if (typeof p.goal !== "number") p.goal = DEFAULT_DAILY_GOAL;
      if (!p.grammar || typeof p.grammar !== "object") p.grammar = { completed: {}, fav: {}, lastLesson: "" };
      if (!p.grammar.completed || typeof p.grammar.completed !== "object") p.grammar.completed = {};
      if (!p.grammar.fav || typeof p.grammar.fav !== "object") p.grammar.fav = {};
      if (typeof p.grammar.lastLesson !== "string") p.grammar.lastLesson = "";
      if (!p.grammar.ui || typeof p.grammar.ui !== "object") p.grammar.ui = {};
      if (!Array.isArray(p.vocabReview)) p.vocabReview = [];
      if (!Array.isArray(p.grammarReview)) p.grammarReview = [];
      if (!p.vocabKnown || typeof p.vocabKnown !== "object") p.vocabKnown = {};
      if (typeof p.vocabShowUnknownOnly !== "boolean") p.vocabShowUnknownOnly = false;
      if (!p.vocabPhaseOpen || typeof p.vocabPhaseOpen !== "object") p.vocabPhaseOpen = {};
      p.v = APP_V;
      localStorage.setItem(LS, JSON.stringify(p));
      try {
        localStorage.removeItem(legacyKey);
      } catch (_) {}
      return p;
    } catch {
      return blankState();
    }
  }

  function normalize(raw) {
    const opts = Array.isArray(raw.options) ? raw.options.map(String) : [];
    let c = raw.correct;
    if (typeof c !== "number") c = parseInt(String(c), 10);
    if (!Number.isFinite(c)) c = 0;
    c = clamp(c, 0, Math.max(0, opts.length - 1));
    return {
      id: String(raw.id),
      quiz: String(raw.quiz || "Quiz 1"),
      question: String(raw.question_en ?? raw.question ?? ""),
      options: opts,
      correctIndex: c,

      sentence_translation_ar: String(raw.sentence_translation_ar || raw.translation_ar || ""),
      needs_review: !!raw.needs_review,
    };
  }

  function vocabMap(q) {
    const m = Object.create(null);
    for (const p of q.vocabulary.split("|")) {
      const seg = p.trim();
      if (!seg) continue;
      const eq = seg.split("=");
      if (eq.length >= 2) {
        const w = eq[0].trim().toLowerCase().replace(/^['']|['']$/g, "");
        const ar = eq.slice(1).join("=").trim();
        if (w) m[w] = ar;
      }
    }
    return m;
  }

  function stripOptPrefix(s) {
    return String(s).replace(/^(?:[a-zA-Z]\.\s*|[A-Z]\.\s*)/, "").trim();
  }

  let _vocabCuratedMapCache = null;
  function vocabCuratedMap() {
    if (_vocabCuratedMapCache) return _vocabCuratedMapCache;
    const m = Object.create(null);
    if (typeof VOCAB_BANK !== "undefined" && Array.isArray(VOCAB_BANK)) {
      for (const pair of VOCAB_BANK) {
        if (!pair || pair.length < 2) continue;
        const k = String(pair[0]).toLowerCase().trim();
        if (k) m[k] = pair[1];
      }
    }
    _vocabCuratedMapCache = m;
    return _vocabCuratedMapCache;
  }

  function vocabBlocksForQuestion(q) {
    const map = { ...vocabMap(q), ...EXTRA_HINTS, ...vocabCuratedMap() };
    const bank = [];
    const covered = new Set();
    for (const p of q.vocabulary.split("|")) {
      const seg = p.trim();
      if (!seg) continue;
      const eq = seg.split("=");
      if (eq.length >= 2) {
        const w = eq[0].trim();
        const ar = eq.slice(1).join("=").trim();
        const keyFull = w.toLowerCase().replace(/^['']|['']$/g, "");
        if (!keyFull) continue;
        bank.push({ en: w, ar: ar || t("noTr") });
        for (const part of keyFull.split(/\s+/)) {
          const norm = part.replace(/[^a-z']/gi, "");
          if (norm) covered.add(norm);
        }
      }
    }
    const auto = [];
    const seen = new Set();
    const blob = q.question + " " + q.options.map(stripOptPrefix).join(" ");
    const re = /\b[A-Za-z]+(?:'[A-Za-z]+)?\b/g;
    let mt;
    while ((mt = re.exec(blob))) {
      const w = mt[0];
      const k = w.toLowerCase();
      const norm = k.replace(/[^a-z']/gi, "");
      if (w.length < 2 || !norm || covered.has(norm) || seen.has(k)) continue;
      seen.add(k);
      auto.push({ en: w, ar: map[k] || map[norm] || t("noTr") });
    }
    return { bank, auto };
  }

  function vocSheetHtml(rows) {
    if (!rows.length) return "";
    return rows

        (r) =>
          `<div class="voc-row"><span class="voc-en">${esc(r.en)}</span><span class="voc-eq">=</span><span class="voc-ar">${esc(r.ar)}</span></div>`
      )
      .join("");
  }

  function htmlVocabPanels(q) {

    if (vb.bank.length) {
      html += `<h5>${esc(t("vocFromBank"))}</h5><div class="voc-sheet">${vocSheetHtml(vb.bank)}</div>`;

    if (!html) html = `<div class="empty" style="padding:14px;text-align:center">${esc(t("vocEmpty"))}</div>`;
    return html;

  function translateParagraph(q) {
    if (q.sentence_translation_ar.trim()) return q.sentence_translation_ar.trim();
    const parts = [q.arabic_explanation, q.why_answer_ar].filter(Boolean);
    return parts.join(" ") || (lang === "ar" ? "لا توجد ترجمة جملة مخصصة بعد." : "No dedicated sentence translation yet.");
  }

  function allVocabAgg() {
    const g = new Map();
    const upsert = (row, fromBank) => {
      const k = row.en.toLowerCase();
      const prev = g.get(k);
      const ar = row.ar;
      const good = ar && ar !== t("noTr");
      if (!prev) {
        g.set(k, { en: row.en, ar, isBank: fromBank });
        return;
      }
      const prevGood = prev.ar && prev.ar !== t("noTr");
      if (fromBank && !prev.isBank) {
        g.set(k, { en: row.en, ar: good ? ar : prev.ar, isBank: true });
      } else if (!prevGood && good) {
        g.set(k, { ...prev, ar });
      } else if (fromBank && good && prev.ar !== ar) {
        g.set(k, { ...prev, ar, isBank: true });
      }
    };
    if (typeof VOCAB_BANK !== "undefined" && Array.isArray(VOCAB_BANK)) {
      for (const pair of VOCAB_BANK) {
        if (!pair || pair.length < 2) continue;
        upsert({ en: pair[0], ar: pair[1] }, true);
      }
    }
    for (const q of questions) {
      const vb = vocabBlocksForQuestion(q);
      vb.bank.forEach((row) => upsert(row, true));
      vb.auto.forEach((row) => upsert(row, false));
    }
    const grammarWordRowsFromItem = (it) => {
      const map = { ...EXTRA_HINTS, ...vocabCuratedMap() };
      const blob = [it.question_en || "", ...((it.options || []).map(String))].join(" ");
      const re = /\b[A-Za-z]+(?:'[A-Za-z]+)?\b/g;
      const rows = [];
      const seen = new Set();
      let mt;
      while ((mt = re.exec(blob))) {
        const w = mt[0];
        const k = w.toLowerCase();
        if (seen.has(k)) continue;
        seen.add(k);
        const norm = k.replace(/[^a-z']/gi, "");
        if (w.length < 2 || !norm) continue;
        const ar = map[k] || map[norm] || t("noTr");
        rows.push({ en: w, ar });
      }
      return rows;
    };
    if (Array.isArray(grammarQuizPoolAll)) {
      for (const it of grammarQuizPoolAll) {
        grammarWordRowsFromItem(it).forEach((row) => upsert(row, false));
      }
    }
    try {
      const blend = grammarAuditReadJson("blended-unique-quiz-json");
      const bItems = blend && Array.isArray(blend.items) ? blend.items : [];
      for (const it of bItems) {
        grammarWordRowsFromItem(it).forEach((row) => upsert(row, false));
      }
    } catch (_) {}
    return [...g.values()].sort((a, b) => a.en.localeCompare(b.en));
  }

  /** Map for hover translations on grammar quiz stems + options (merged with bank hints). */
  function grammarQuizWordMap(item) {
    if (!item) return { ...EXTRA_HINTS, ...vocabCuratedMap() };
    const base = { ...EXTRA_HINTS, ...vocabCuratedMap() };
    const out = Object.assign(Object.create(null), base);
    const blob = [item.question_en || "", ...((item.options || []).map(String))].join(" ");
    const re = /\b[A-Za-z]+(?:'[A-Za-z]+)?\b/g;
    let mt;
    while ((mt = re.exec(blob))) {
      const w = mt[0];
      const k = w.toLowerCase();
      const norm = k.replace(/[^a-z']/gi, "");
      if (w.length < 2 || !norm) continue;
      if (!out[k]) {
        const tr = base[k] || base[norm] || t("noTr");
        out[k] = tr;
        if (norm && norm !== k) out[norm] = tr;
      }
    }
    return out;
  }

  function readingQuestions() {

  /** Text of the reading passage (before comprehension lines). */
  function readingPassageExtract(q) {
    const full = String(q.question || "");
    const lower = full.toLowerCase();
    const needle = "read the text:";
    const ix = lower.indexOf(needle);
    if (ix < 0) return full.replace(/\s+/g, " ").trim().slice(0, 500);
    let rest = full.slice(ix + needle.length).trim();
    const lines = rest.split(/\n/);
    const kept = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) {
        if (kept.length > 0) break;
        continue;
      }
      if (/\.{4,}/.test(line)) break;
      if (/^(choose|select|complete|fill in|answer)\b/i.test(line)) break;
      kept.push(line);
      if (kept.join("\n").length > 4000) break;
    }
    const joined = kept.join("\n").trim();
    return joined || rest.replace(/\s+/g, " ").trim().slice(0, 500);
  }

  function readingLessonsDeduped(rq) {
    const seen = new Map();
    for (const q of rq) {
      const body = readingPassageExtract(q);
      const key = body.replace(/\s+/g, " ").trim().slice(0, 1500) || `__id:${q.id}`;
      if (!seen.has(key)) seen.set(key, q);
    }
    return [...seen.values()];
  }

  function readingGroupByQuiz(rq) {
    const order = [];
    const map = Object.create(null);
    for (const q of rq) {
      const qz = q.quiz || "Quiz";
      if (!map[qz]) {
        map[qz] = [];
        order.push(qz);
      }
      map[qz].push(q);
    }
    for (const k of order) {
      map[k].sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
    }
    return { order, map };
  }

  function bootGrammar() {
    grammarLessonsById = {};
    grammarQuizPoolAll = [];
    grammarRuleFirstLessonByKey = {};
    const G = typeof GRAMMAR_DATA !== "undefined" && GRAMMAR_DATA && GRAMMAR_DATA.lessons ? GRAMMAR_DATA : { lessons: {} };
    function grammarLessonQuizItemsFlat(L) {
      const out = [];
      if (Array.isArray(L.quiz)) out.push(...L.quiz);
      if (Array.isArray(L.quizStages)) {
        for (const st of L.quizStages) {
          if (Array.isArray(st.quiz)) out.push(...st.quiz);
        }
      }
      if (Array.isArray(L.quizComprehensive)) out.push(...L.quizComprehensive);
      return out;
    }
    for (const id of Object.keys(G.lessons || {})) {
      const L = G.lessons[id];
      grammarLessonsById[id] = L;
      try {
        const fp = String(L.rule_en || "").toLowerCase().replace(/\s+/g, " ").trim();
        if (fp && !grammarRuleFirstLessonByKey[fp]) grammarRuleFirstLessonByKey[fp] = id;
      } catch (_) {}
      const qs = grammarLessonQuizItemsFlat(L);
      for (let i = 0; i < qs.length; i++) {
        grammarQuizPoolAll.push({
          lessonId: id,
          qi: i,
          question_en: qs[i].question_en,
          options: qs[i].options,
          correct: qs[i].correct,
          why_ar: qs[i].why_ar,

  function findGrammarLessonByQuery(raw) {
    const needle = raw.trim().toLowerCase();
    if (!needle) return "";
    for (const id of Object.keys(grammarLessonsById)) {
      const L = grammarLessonsById[id];
      const blob = [id, L.title_en, L.title_ar, ...(L.keywords || [])].join(" ").toLowerCase();
      if (blob.includes(needle)) return id;
    }
    const parts = needle.split(/\s+/).filter(Boolean);
    for (const id of Object.keys(grammarLessonsById)) {
      const L = grammarLessonsById[id];
      const blob = [L.title_en, L.title_ar, ...(L.keywords || []), L.rule_en || "", L.explanation_ar || ""].join(" ").toLowerCase();
      if (parts.length && parts.every((p) => blob.includes(p))) return id;
    }
    return "";
  }

  function grammarEnsureQuizState(lessonId) {
    const L = grammarLessonsById[lessonId];
    if (!L) return null;
    const exCount = (L.examples || []).length;
    const stages = Array.isArray(L.quizStages) ? L.quizStages : null;
    const finalQs = Array.isArray(L.quizComprehensive) ? L.quizComprehensive : null;

    if (stages && stages.length > 0 && finalQs && finalQs.length > 0) {
      if (!grammarLessonQuiz[lessonId] || !grammarLessonQuiz[lessonId].multi) {
        grammarLessonQuiz[lessonId] = {
          multi: true,
          exPos: 0,
          stages: stages.map((s) => ({
            picks: Array((s.quiz || []).length).fill(null),
            quizPos: 0,
          })),
          final: { picks: Array(finalQs.length).fill(null), quizPos: 0 },
        };
      } else {
        const st = grammarLessonQuiz[lessonId];
        const nextStages = stages.map((s, i) => {
          const n = (s.quiz || []).length;
          const prev = st.stages && st.stages[i];
          if (prev && Array.isArray(prev.picks) && prev.picks.length === n) return prev;
          return { picks: Array(n).fill(null), quizPos: 0 };
        });
        st.stages = nextStages;
        if (!st.final || !Array.isArray(st.final.picks) || st.final.picks.length !== finalQs.length) {
          st.final = { picks: Array(finalQs.length).fill(null), quizPos: 0 };
        }
        if (typeof st.exPos !== "number") st.exPos = 0;
        if (exCount > 0) st.exPos = Math.min(st.exPos, exCount - 1);
        else st.exPos = 0;
      }
      return grammarLessonQuiz[lessonId];
    }

    const flatQuiz = Array.isArray(L.quiz) ? L.quiz : [];
    const n = flatQuiz.length;
    if (!grammarLessonQuiz[lessonId] || grammarLessonQuiz[lessonId].multi) {
      grammarLessonQuiz[lessonId] = { picks: Array(n).fill(null), quizPos: 0, exPos: 0 };
    }
    const st = grammarLessonQuiz[lessonId];
    if (typeof st.quizPos !== "number" || st.quizPos < 0) st.quizPos = 0;
    if (typeof st.exPos !== "number" || st.exPos < 0) st.exPos = 0;
    if (!Array.isArray(st.picks) || st.picks.length !== n) {
      st.picks = Array(n).fill(null);
      st.quizPos = 0;
    }
    if (n > 0) st.quizPos = Math.min(st.quizPos, n - 1);
    else st.quizPos = 0;
    if (exCount > 0) st.exPos = Math.min(st.exPos, exCount - 1);
    else st.exPos = 0;
    return st;
  }

  function grammarLessonComplete(lessonId) {
    const L = grammarLessonsById[lessonId];
    if (!L) return false;
    const st = grammarLessonQuiz[lessonId];
    if (!st) return false;
    if (st.multi) {
      const stagesOk =
        Array.isArray(st.stages) &&
        st.stages.every((s) => s.picks.every((x) => x !== null && x !== undefined));
      const finalOk =
        st.final &&
        Array.isArray(st.final.picks) &&
        st.final.picks.every((x) => x !== null && x !== undefined);
      return stagesOk && finalOk;
    }
    if (!Array.isArray(L.quiz)) return false;
    return st.picks.every((x) => x !== null && x !== undefined);
  }

  function totals() {
    const T = questions.length;
    let ans = 0, ok = 0, bad = 0;
    for (const q of questions) {
      const s = state.qs[q.id];
      if (s && s.answered !== null) {
        ans++;
        if (s.ok) ok++;
        else bad++;
      }

    return { T, ans, ok, bad };
  }

  function pct(a, b) {
    return b ? Math.round((a / b) * 100) : 0;
  }

  function tokenizeEn(el, text, map) {
    el.textContent = "";
    const escapeRe = (s) => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const cleanKey = (s) => String(s).toLowerCase().trim().replace(/^['']|['']$/g, "");
    const phraseKeys = Object.keys(map || {})
      .map(cleanKey)
      .filter((k) => k && k.includes(" ") && /^[a-z' ]+$/.test(k))
      .sort((a, b) => b.length - a.length);

    const emitWords = (chunk) => {
      const re = /([A-Za-z]+(?:'[A-Za-z]+)?)|([^A-Za-z]+)/g;
      let m;
      while ((m = re.exec(chunk))) {
        if (m[1]) {
          const sp = document.createElement("span");
          sp.className = "w-token";
          sp.textContent = m[1];
          sp.dataset.w = cleanKey(m[1]);
          el.appendChild(sp);
        } else el.appendChild(document.createTextNode(m[2] || ""));
      }
    };

    if (!phraseKeys.length) {
      emitWords(text);
      wireTokens(el, map);
      return;
    }

    // Phrase-aware tokenization (e.g. "air conditioner") using keys from your own vocab data.
    const phraseRe = new RegExp(
      `\\b(?:${phraseKeys.map((k) => escapeRe(k).replace(/\\s+/g, "\\\\s+")).join("|")})\\b`,
      "gi",
    );
    let last = 0;
    let mt;
    while ((mt = phraseRe.exec(text))) {
      const start = mt.index;
      const end = start + mt[0].length;
      if (start > last) emitWords(text.slice(last, start));
      const sp = document.createElement("span");
      sp.className = "w-token";
      sp.textContent = mt[0];
      sp.dataset.w = cleanKey(mt[0]).replace(/\s+/g, " ");
      el.appendChild(sp);
      last = end;
    }
    if (last < text.length) emitWords(text.slice(last));
    wireTokens(el, map);
  }

  function wireTokens(root, map) {
    const tip = $("#wtip");
    let longPress = null;
    const show = (sp, clientX, clientY) => {
      const w = sp.dataset.w || "";
      const curMap = vocabCuratedMap();
      let ar = map[w] || EXTRA_HINTS[w] || curMap[w] || t("noTr");
      tip.style.display = "block";
      tip.innerHTML = `<b>${esc(sp.textContent)}</b><div>${esc(ar)}</div>`;
      const r = sp.getBoundingClientRect();
      let x = r.left + r.width / 2 - tip.offsetWidth / 2;
      let y = r.bottom + 8;
      if (clientX) {
        x = clientX - tip.offsetWidth / 2;
        y = clientY + 12;
      }
      x = clamp(x, 8, innerWidth - tip.offsetWidth - 8);
      y = clamp(y, 8, innerHeight - tip.offsetHeight - 8);
      tip.style.left = x + "px";
      tip.style.top = y + "px";
    };
    const isTouch = "ontouchstart" in window;
    root.querySelectorAll(".w-token").forEach((sp) => {
      sp.addEventListener("mouseenter", () => {
        if (isTouch) return;
        show(sp);
      });
      sp.addEventListener("mouseleave", () => {
        if (isTouch) return;
        tip.style.display = "none";
      });
      sp.addEventListener("touchstart", (e) => {
        clearTimeout(longPress);
        const touch = e.touches[0];
        longPress = setTimeout(() => {
          show(sp, touch.clientX, touch.clientY);
          navigator.vibrate?.(12);
        }, 480);
      }, { passive: true });
      sp.addEventListener("touchend", () => clearTimeout(longPress));
      sp.addEventListener("touchmove", () => {
        clearTimeout(longPress);
        tip.style.display = "none";
      });
    });
  }

  function parseRoute() {
    const raw = (location.hash || "#/").replace(/^#\/?/, "");
    const parts = raw.split("/").filter(Boolean);
    const top = parts[0] || "home";

    grammarSeg = {
      cat: "",
      lesson: "",
      g2Lesson: "",
      final: false,
      review: false,
      unitQuiz: "",
      unitReview: false,
      reviewSolutions: false,
      blendedQuiz: false,
      blendedReview: false,
      hubTab: "",
      track: "g1",
    };

    const clearFinalTick = () => {
      if (grammarFinalSession && grammarFinalSession.intervalId) {
        clearInterval(grammarFinalSession.intervalId);
        grammarFinalSession.intervalId = null;
      }
      if (grammarBlendedSession && grammarBlendedSession.intervalId) {
        clearInterval(grammarBlendedSession.intervalId);
        grammarBlendedSession.intervalId = null;
      }
    };
    clearFinalTick();

    if (top === "grammar") {
      route = "grammar";
      // Tracks:
      // - Grammar 1 (current): default, uses existing routes
      // - Grammar 2: placeholder until content arrives
      if (parts[1] === "g2") {
        grammarSeg.track = "g2";
        if (parts[2]) grammarSeg.g2Lesson = decodeURIComponent(parts[2]);
        return;
      }
      if (parts[1] === "lessons") grammarSeg.hubTab = "lessons";
      else if (parts[1] === "tests") grammarSeg.hubTab = "tests";
      if (parts[1] === "cat" && parts[2]) grammarSeg.cat = decodeURIComponent(parts[2]);
      else if (parts[1] === "lesson" && parts[2]) grammarSeg.lesson = decodeURIComponent(parts[2]);
      else if (parts[1] === "quiz" && parts[2]) {
        grammarSeg.unitQuiz = decodeURIComponent(parts[2]);
        if (parts[3] === "review") grammarSeg.unitReview = true;
      } else if (parts[1] === "final") {
        grammarSeg.final = true;
        if (parts[2] === "review") grammarSeg.review = true;
      } else if (parts[1] === "review-solutions") grammarSeg.reviewSolutions = true;
      else if (parts[1] === "blended-quiz") {
        grammarSeg.blendedQuiz = true;
        if (parts[2] === "review") grammarSeg.blendedReview = true;
      }
      return;
    }

    clearFinalTick();

    const ok = ["home", "tests", "quiz", "vocab", "reading", "progress", "favorites", "review", "review-later", "dump"];
    route = ok.includes(top) ? top : "home";
  }

  function navHtml() {
    const cur = route;
    const show = cur !== "home";
    if (!show) return "";
    return `<a href="#/" class="nav-home-ic" data-r="home" aria-label="${esc(t("navHome"))}" title="${esc(t("navHome"))}" aria-current="page">${EM_ICON.home}</a>`;
  }

  function renderNav() {

    if (n) n.innerHTML = navHtml();

      a.addEventListener("click", (e) => {

  function navToHashMaybe(raw) {
    const h = String(raw || "");
    if (!h) return false;
    if (!(h.startsWith("#/") || h.startsWith("#"))) return false;
    location.hash = h.startsWith("#") ? h : `#${h}`;
    return true;
  }

  function getEvtEl(e) {
    const t = e && e.target;
    // Some browsers may target Text nodes or SVG sub-elements.
    if (t && t.nodeType === 1) return t; // Element
    if (t && t.parentElement) return t.parentElement;
    return null;
  }

  // Global in-app navigation handler.
  // Capture phase so it still works even if some UI stops bubbling.
  // Use pointerup to be reliable on mobile.
  const onNav = (e) => {

  function grammarFinalizeResults() {
    if (!grammarFinalSession || grammarFinalSession.phase !== "run") return;
    const S = grammarFinalSession;
    if (S.intervalId) {
      clearInterval(S.intervalId);
      S.intervalId = null;
    }
    let score = 0;
    const items = S.items.map((it, i) => {
      const ok = S.picks[i] === it.correct;
      if (ok) score++;
      const lesson = grammarLessonsById[it.lessonId];
      return {
        ...it,
        pick: S.picks[i],
        lessonTitle: lesson ? lesson.title_en : "",
      };
    });
    const total = items.length;
    const pct = total ? Math.round((score / total) * 100) : 0;
    grammarFinalSession = {
      phase: "done",
      results: { score, total, pct, items },
    };
  }

    const lessonCard = (L) => `<div class="qrow" data-g2-open="${esc(L.id)}" style="cursor:pointer">

    const openLesson = (id) => {
      const L = G2.find((x) => x.id === id);
      if (!L) return;
      const getBlock = (k) => (L.blocks || []).find((b) => b.k === k) || { lines: [] };
      const enLines = (getBlock("EN").lines || []).slice();
      const arLines = (getBlock("AR").lines || []).slice();
      const srcLines = (getBlock("SRC").lines || []).slice();

      const mkList = (lines, ltr) =>
        `<ul style="margin:0;padding-inline-start:18px;line-height:1.75;${ltr ? "direction:ltr;text-align:left" : "direction:rtl;text-align:right"}">${(lines || [])
          .map((x) => `<li>${esc(x)}</li>`)
          .join("")}</ul>`;

      const pickExamplesHtml = () => {
        const isExampleLine = (s) => {
          const x = String(s || "").trim();
          if (!x) return false;
          if (/^source\s*:/i.test(x)) return false;
          // Prefer real sentences.
          if (/[.?]$/.test(x) && /[A-Za-z]/.test(x)) return true;
          return false;
        };
        const isHeading = (s) => {
          const x = String(s || "").trim();
          if (!x) return false;
          if (x.length > 42) return false;
          // headings like AFFIRMATIVE:, NEGATIVE FORM (-), INTERROGATIVE FORM ...
          return /^[A-Z0-9][A-Z0-9\s/()'+-]*:?$/.test(x) && /[A-Z]/.test(x) && !/[.?]$/.test(x);
        };

        const groups = [];
        let cur = { title: "", lines: [] };
        const pushCur = () => {
          if (cur.lines.length) groups.push(cur);
          cur = { title: "", lines: [] };
        };

        const seenSent = new Set();
        const pushExample = (arr, s) => {
          const k = String(s || "").trim();
          if (!k) return;
          if (seenSent.has(k)) return;
          seenSent.add(k);
          arr.push(k);
        };

        for (const raw of enLines) {
          const s = String(raw || "").trim();
          if (!s) continue;
          if (isHeading(s)) {
            pushCur();
            cur.title = s.replace(/:$/, "");
            continue;
          }
          if (isExampleLine(s)) pushExample(cur.lines, s);
        }
        pushCur();

        // Keep 1 example per group; if there are no groups, keep 6 max.
        const hasGroups = groups.some((g) => g.title && g.lines.length);
        if (hasGroups) {
          const body = groups
            .filter((g) => g.lines.length)
            .map((g) => {
              const pick = g.lines.slice(0, 1);
              // No heading repetition: show the example only.
              return `<div class="panel" style="padding:14px 14px;border-radius:14px;background:color-mix(in srgb, var(--surface2) 88%, transparent);border:1px solid var(--border)">${mkList(
                pick,
                true,
              )}</div>`;
            })
            .join(`<div style="height:10px"></div>`);
          return body || `<p class="empty">(no examples found)</p>`;
        }

        const fallback = [];
        for (const s of enLines) if (isExampleLine(s)) pushExample(fallback, s);
        return mkList(fallback.length ? fallback : ["(no examples found)"], true);
      };

      const buildPractice = () => {
        const ex = [];

        const pushQ = (q) => {
          if (!q || !q.answer_en || !q.stem_en || !q.choices_en || q.choices_en.length < 2) return;
          ex.push(q);
        };

        const isSentence = (s) => {
          const x = String(s || "").trim();
          return !!x && /[A-Za-z]/.test(x) && /[.?]$/.test(x);
        };

        const explainBe = (sent, answer) => {
          const s = String(sent || "");
          const a = String(answer || "");
          if (/^am$/i.test(a) || /^am not$/i.test(a)) return "شرح: نستخدم am مع I فقط.";
          if (/^is$/i.test(a) || /^is not$/i.test(a) || /^isn't$/i.test(a)) return "شرح: نستخدم is مع he / she / it.";
          if (/^are$/i.test(a) || /^are not$/i.test(a) || /^aren't$/i.test(a)) return "شرح: نستخدم are مع you / we / they.";
          if (/^am$/i.test(a) || /^is$/i.test(a) || /^are$/i.test(a)) return "شرح: اختر فعل be الصحيح حسب الفاعل.";
          // generic fallback
          return "شرح: اختر الصيغة الصحيحة حسب القاعدة في الشرح.";
        };

        const blankFirst = (line, opts) => {
          const m = String(line).match(/^\s*([A-Za-z]+(?:'[A-Za-z]+)?)\b(.*)$/);
          if (!m) return null;
          const head = m[1];
          const rest = m[2] || "";
          const correct = head;
          const choices = shuffle([correct, ...opts.filter((x) => x !== correct)]).slice(0, 4);
          return {
            prompt_ar: "اختر الكلمة الصحيحة لإكمال السؤال:",
            stem_en: `____${rest}`,
            choices_en: choices,
            answer_en: correct,
            explain_ar: explainBe(line, correct),
          };
        };
        const beHeads = ["Am", "Are", "Is"];
        const doHeads = ["Do", "Does", "Did"];
        const willHeads = ["Will"];
        const canHeads = ["Can"];
        for (const line of enLines) {
          if (line.startsWith("Am ") || line.startsWith("Are ") || line.startsWith("Is ")) {
            const q = blankFirst(line, beHeads);
            if (q) pushQ(q);
          } else if (line.startsWith("Do ") || line.startsWith("Does ") || line.startsWith("Did ")) {
            const q = blankFirst(line, doHeads);
            if (q) pushQ(q);
          } else if (line.startsWith("Will ")) {
            const q = blankFirst(line, willHeads);
            if (q) pushQ(q);
          } else if (line.startsWith("Can ")) {
            const q = blankFirst(line, canHeads);
            if (q) pushQ(q);
          }
        }
        // Only build exercises from the current lesson's English lines (no cross-lesson mixing).
        const addBlankFromLine = (line, target, options) => {
          const idx = String(line).indexOf(target);
          if (idx < 0) return;
          const stem = String(line).slice(0, idx) + "____" + String(line).slice(idx + target.length);
          const correct = target;
          const choices = shuffle([correct, ...options.filter((x) => x !== correct)]).slice(0, 4);
          pushQ({ prompt_ar: "اختر الكلمة الصحيحة:", stem_en: stem, choices_en: choices, answer_en: correct, explain_ar: explainBe(line, correct) });
        };
        for (const line of enLines) {
          if (line.includes(" and ")) addBlankFromLine(line, "and", ["or", "but"]);
          if (line.includes(" or ")) addBlankFromLine(line, "or", ["and", "but"]);
          if (line.includes(" but ")) addBlankFromLine(line, "but", ["and", "or"]);
          if (line.includes("There is ")) addBlankFromLine(line, "is", ["are"]);
          if (line.includes("There are ")) addBlankFromLine(line, "are", ["is"]);
          if (line.includes(" going to ")) addBlankFromLine(line, "going to", ["will"]);
          if (line.includes("have ") || line.includes("has ")) addBlankFromLine(line, "have", ["has"]);
        }

        // Sentence-based be practice (am/is/are + negatives) from examples only (English as-is).
        const sents = enLines.filter(isSentence);
        const beTargets = [" am not ", " are not ", " is not ", " am ", " are ", " is ", " aren't ", " isn't "];
        for (const s of sents) {
          const t = beTargets.find((tok) => String(s).includes(tok));
          if (!t) continue;
          const targetWord = t.trim();
          const idx = String(s).indexOf(t);
          if (idx < 0) continue;
          const stem = String(s).slice(0, idx) + " ____ " + String(s).slice(idx + t.length);
          const pool = ["am", "is", "are", "am not", "isn't", "aren't", "is not", "are not"].filter(Boolean);
          const correct = targetWord;
          const choices = shuffle([correct, ...pool.filter((x) => x !== correct)]).slice(0, 4);
          pushQ({
            prompt_ar: "اختر الصيغة الصحيحة لفعل be:",
            stem_en: stem.replace(/\s+/g, " ").trim(),
            choices_en: choices,
            answer_en: correct,
            explain_ar: explainBe(s, correct),
          });
        }

        return ex;
      };
      const practice = buildPractice();

      const blocksHtml = `

        <div class="pillrow" style="margin:0 0 10px">
          <button type="button" class="btn btn-primary" id="g2CopyLesson">${esc("نسخ الدرس")}</button>
          <a class="btn btn-sec" href="#/grammar/g2" style="text-decoration:none">${esc("رجوع إلى Grammar 2")}</a>
        </div>
        ${blocksHtml}
      `;
      const setTab = (k) => {
        $("#g2TabExplain").style.display = k === "explain" ? "block" : "none";
        $("#g2TabExamples").style.display = k === "examples" ? "block" : "none";
        $("#g2TabPractice").style.display = k === "practice" ? "block" : "none";
        v.querySelectorAll("[data-g2tab]").forEach((b) => b.classList.toggle("on", b.getAttribute("data-g2tab") === k));
        if (k === "practice" && practice.length) {
          const host = $("#g2Practice");
          if (!host) return;
          if (host.dataset.built) return;
          host.dataset.built = "1";

          // Build a "real quiz" experience without touching the main quiz system.
          if (!state.g2 || typeof state.g2 !== "object") state.g2 = {};
          if (!state.g2[L.id] || typeof state.g2[L.id] !== "object") state.g2[L.id] = { pos: 0, picks: [] };
          const st = state.g2[L.id];
          if (!Array.isArray(st.picks)) st.picks = [];
          if (typeof st.pos !== "number") st.pos = 0;
          st.pos = clamp(st.pos, 0, Math.max(0, practice.length - 1));
          while (st.picks.length < practice.length) st.picks.push(null);

          const letters = ["A", "B", "C", "D"];
          const renderQuiz = () => {
            const qi = clamp(st.pos, 0, practice.length - 1);
            st.pos = qi;
            saveState();

            const q = practice[qi];
            const picked = st.picks[qi];
            const locked = picked !== null && picked !== undefined;
            const correct = q.answer_en;
            const correctIdx = (q.choices_en || []).indexOf(correct);
            const ok = locked && picked === correctIdx;
            const answered = st.picks.filter((x) => x !== null && x !== undefined).length;

            $("#g2PProg").textContent = `${qi + 1}/${practice.length}`;
            $("#g2PPrev").disabled = qi <= 0;
            $("#g2PNext").disabled = qi >= practice.length - 1;

            const opts = (q.choices_en || [])
              .slice(0, 4)
              .map((c, oi) => {
                let cls = "opt";
                if (locked) cls += oi === correctIdx ? " correct" : picked === oi ? " wrong" : "";
                return `<button type="button" class="${cls}" data-g2qix="${qi}" data-g2oix="${oi}" ${
                  locked ? "disabled" : ""
                }><span class="L">${letters[oi] || ""}</span><span class="txt" dir="ltr">${esc(c)}</span></button>`;
              })
              .join("");

            const fbCls = !locked ? "" : ok ? "ok" : "bad";
            const fbOn = locked ? "on" : "";
            host.innerHTML = `
              <div class="gram-step-wrap">
                <p class="gram-answer-remain">${esc(fmtAnswerRemainLine("quizAnswerRemainLine", answered, practice.length))}</p>
                <div class="gram-qblock" data-qix="${qi}">
                  <div class="q-label gram-q-line">
                    <span class="gram-q-num">${qi + 1}.</span>
                    <span class="ar-text" style="display:inline">${esc(q.prompt_ar || "")}</span>
                  </div>
                  <div class="en-text" dir="ltr" style="margin:8px 0 12px;font-weight:900">${esc(q.stem_en || "")}</div>
                  <div class="opts">${opts}</div>
                  <div class="gram-feedback ${fbCls} ${fbOn}">
                    <strong>${ok ? esc(t("gramCorrect")) : esc(t("gramWrong"))}</strong>
                    ${locked ? `— ${esc(t("gramWhy"))}: ${esc(q.explain_ar || "—")}` : ""}
                    ${locked ? `<br/>${esc(t("gramUsedRule"))}: ${esc("اختر الصيغة الصحيحة حسب الفاعل/القاعدة في الشرح.")}` : ""}
                  </div>
                </div>
              </div>
            `;

            host.querySelectorAll("[data-g2qix]").forEach((btn) => {
              btn.addEventListener("click", () => {
                const qix = parseInt(btn.getAttribute("data-g2qix"), 10);
                const oix = parseInt(btn.getAttribute("data-g2oix"), 10);
                if (!Number.isFinite(qix) || !Number.isFinite(oix)) return;
                if (st.picks[qix] !== null && st.picks[qix] !== undefined) return;
                st.picks[qix] = oix;
                saveState();
                renderQuiz();
              });
            });
          };

          $("#g2PPrev").onclick = () => {
            if (st.pos > 0) st.pos--;
            renderQuiz();
          };
          $("#g2PNext").onclick = () => {
            if (st.pos < practice.length - 1) st.pos++;
            renderQuiz();
          };

          renderQuiz();
        }
      };
      v.querySelectorAll("[data-g2tab]").forEach((b) => b.addEventListener("click", () => setTab(b.getAttribute("data-g2tab"))));
      $("#g2CopyLesson").onclick = async () => {
        const plain = [L.title, ...L.blocks.flatMap((b) => [b.k + ":", ...(b.lines || [])])].join("\n");
        try {
          await navigator.clipboard.writeText(plain);
          toast("تم النسخ.", "ok");
        } catch (_) {
          toast("لم يتم النسخ تلقائياً.", "bad");
        }
      };
    };

    // If user navigated directly to a lesson hash, open it.
    if (grammarSeg.g2Lesson) {
      openLesson(grammarSeg.g2Lesson);
      return;
    }

    $("#g2List")?.querySelectorAll("[data-g2-open]").forEach((row) => {
      row.addEventListener("click", () => {
        const id = row.getAttribute("data-g2-open");
        if (!id) return;
        location.hash = "#/grammar/g2/" + encodeURIComponent(id);
      });
    });

    $("#g2CopyAll").onclick = async () => {
      const plain = G2.map((L) => [L.title, ...L.blocks.flatMap((b) => [b.k + ":", ...(b.lines || [])]), ""].join("\n")).join("\n");
      try {
        await navigator.clipboard.writeText(plain);
        toast("تم النسخ.", "ok");
      } catch (_) {
        toast("لم يتم النسخ تلقائياً.", "bad");
      }
    };
    $("[data-back]")?.addEventListener("click", () => (location.hash = "#/grammar"));
  }

  function renderGrammarCategory(catId) {
    const G = typeof GRAMMAR_DATA !== "undefined" ? GRAMMAR_DATA : { categories: [] };
    const cat = (G.categories || []).find((c) => c.id === catId);
    const v = $("#view");
    if (!cat) {

      $("[data-back]")?.addEventListener("click", () => (location.hash = "#/grammar/lessons"));
      return;
    }
    const slugs = cat.lesson_slugs || [];
    const desc =
      lang === "en" && cat.desc_en && String(cat.desc_en).trim()
        ? String(cat.desc_en).trim()
        : cat.desc_ar || "";
    const rows = slugs
      .map((sid) => {
        const L = grammarLessonsById[sid];
        if (!L) return "";
        const done = !!state.grammar.completed[sid];
        const fav = !!state.grammar.fav[sid];
        const qn = Array.isArray(L.quiz) ? L.quiz.length : 0;
        const metaBits = [];
        if (done) metaBits.push("✓ " + esc(t("gramCompleted")));
        if (fav) metaBits.push("★");
        const quizLbl = t("gramCatQuizCount").replace(/\{\{n\}\}/g, String(qn));
        metaBits.push(esc(quizLbl));
        return `<div class="qrow" data-lid="${esc(sid)}">
        <div class="t gram-lesson-row-titles">
          <span class="gram-lesson-row-ar">${esc(L.title_ar)}</span>
          <span class="gram-lesson-row-en" dir="ltr">${esc(L.title_en)}</span>
        </div>
        <div class="m">${metaBits.join(" · ")}</div>
      </div>`;
      })
      .join("");

    v.innerHTML = `
      ${backBar("#/grammar/lessons")}

          <span class="gram-cat-chip">${esc(t("gramCatBadgeGrammar"))}</span>

    { base: "be (am/is/are)", past: "was / were", v3: "been", meaning: "يكون", past_ar: "كان / كانوا", v3_ar: "كان قد… / في حالة كون", group: 2, stage: 6 },
    { base: "begin", past: "began", v3: "begun", meaning: "يبدأ", past_ar: "بدأ", v3_ar: "بدأ / اُبتُدِئَ", group: 2, stage: 6 },
    { base: "choose", past: "chose", v3: "chosen", meaning: "يختار", past_ar: "اختار", v3_ar: "اُختير / مُختار", group: 2, stage: 6 },
    { base: "do", past: "did", v3: "done", meaning: "يفعل", past_ar: "فعل", v3_ar: "فُعلَ / تمّ فعله", group: 2, stage: 6 },
    { base: "drink", past: "drank", v3: "drunk", meaning: "يشرب", past_ar: "شرب", v3_ar: "شُرِبَ / مُشْرَب", group: 2, stage: 6 },
    { base: "eat", past: "ate", v3: "eaten", meaning: "يأكل", past_ar: "أكل", v3_ar: "أُكِلَ / مَأْكُول", group: 2, stage: 6 },
    { base: "fall", past: "fell", v3: "fallen", meaning: "يسقط", past_ar: "سقط / وقع", v3_ar: "سقط / ساقط", group: 2, stage: 6 },
    { base: "fly", past: "flew", v3: "flown", meaning: "يطير", past_ar: "طار", v3_ar: "طار / مُطير", group: 2, stage: 6 },
    { base: "forget", past: "forgot", v3: "forgotten", meaning: "ينسى", past_ar: "نسي", v3_ar: "مَنْسِيّ / نُسي", group: 2, stage: 6 },
    { base: "give", past: "gave", v3: "given", meaning: "يعطي", past_ar: "أعطى", v3_ar: "أُعْطِيَ / مُعْطًى", group: 2, stage: 7 },
    { base: "go", past: "went", v3: "gone", meaning: "يذهب", past_ar: "ذهب", v3_ar: "ذَهَبَ / غائب", group: 2, stage: 7 },
    { base: "grow", past: "grew", v3: "grown", meaning: "ينمو", past_ar: "نما / زرع", v3_ar: "نَمَى / مَزْروع", group: 2, stage: 7 },
    { base: "know", past: "knew", v3: "known", meaning: "يعرف", past_ar: "عرف", v3_ar: "مَعْرُوف / عُرِفَ", group: 2, stage: 7 },
    { base: "see", past: "saw", v3: "seen", meaning: "يرى", past_ar: "رأى", v3_ar: "مَرْئِيّ / رُئِيَ", group: 2, stage: 7 },
    { base: "speak", past: "spoke", v3: "spoken", meaning: "يتكلم", past_ar: "تكلّم / قال", v3_ar: "تُكَلَّمَ / مَنْطُوق", group: 2, stage: 7 },
    { base: "swim", past: "swam", v3: "swum", meaning: "يسبح", past_ar: "سبح", v3_ar: "سُبِحَ / مَسْبُوح", group: 2, stage: 7 },
    { base: "take", past: "took", v3: "taken", meaning: "يأخذ", past_ar: "أخذ", v3_ar: "أُخِذَ / مَأْخُوذ", group: 2, stage: 7 },
    { base: "wake", past: "woke", v3: "woken", meaning: "يستيقظ", past_ar: "استيقظ", v3_ar: "مُسْتَيْقِظ", group: 2, stage: 7 },
    { base: "wear", past: "wore", v3: "worn", meaning: "يلبس", past_ar: "لبس", v3_ar: "مَلْبُوس / لُبِسَ", group: 2, stage: 7 },
    { base: "write", past: "wrote", v3: "written", meaning: "يكتب", past_ar: "كتب", v3_ar: "مَكْتُوب / كُتِبَ", group: 2, stage: 7 },
  ];

  function renderGrammarLesson(lessonId) {
    const L = grammarLessonsById[lessonId];
    const v = $("#view");
    if (!L) {
      v.innerHTML = `${backBar("#/grammar/lessons")}<div class="panel"><p>${esc(t("gramEmptyCat"))}</p></div>`;
      $("[data-back]")?.addEventListener("click", () => (location.hash = "#/grammar/lessons"));
      return;
    }

    state.grammar.lastLesson = lessonId;
    saveState();

    const cat = L.categoryId || "";
    const back = cat ? "#/grammar/cat/" + encodeURIComponent(cat) : "#/grammar/lessons";

    const G = typeof GRAMMAR_DATA !== "undefined" ? GRAMMAR_DATA : { categories: [] };
    const catObj = (G.categories || []).find((c) => c.id === cat);
    const catTitleCrumb =
      catObj &&
      (lang === "en" && catObj.title_en && String(catObj.title_en).trim()
        ? String(catObj.title_en).trim()
        : catObj.title_ar || "");
    const lessonTitleCrumb =
      lang === "en" && L.title_en && String(L.title_en).trim()
        ? String(L.title_en).trim()
        : L.title_ar || "";
    const breadcrumbHtml = `
      <nav class="gram-breadcrumb" aria-label="${esc(t("grammarTitle"))}">
        <a href="#/grammar/lessons">${esc(t("gramLandingGrammarCard"))}</a>
        <span class="gram-bc-sep" aria-hidden="true">›</span>
        ${
          catObj && catTitleCrumb
            ? `<a href="#/grammar/cat/${encodeURIComponent(catObj.id)}">${esc(catTitleCrumb)}</a>
        <span class="gram-bc-sep" aria-hidden="true">›</span>`
            : ""
        }
        <span aria-current="page">${esc(lessonTitleCrumb)}</span>
      </nav>`;
    const hasText = (s) => !!String(s || "").trim();
    const topicInfer = () => {
      const blob = [L.title_en, L.title_ar, L.rule_en, L.explanation_ar, L.keywords ? L.keywords.join(" ") : ""]
        .join(" ")
        .toLowerCase();
      const TOPICS = [
        "past simple",
        "present simple",
        "present continuous",
        "present perfect",
        "articles",
        "prepositions",
        "there is",
        "there are",
        "comparative",
        "superlative",
        "countable",
        "uncountable",
        "going to",
        "will",
        "possessive adjectives",
        "pronouns",
      ];
      for (const k of TOPICS) {
        if (blob.includes(k)) return { en: k, ar: EXTRA_HINTS[k] || "" };
      }
      return { en: "", ar: "" };
    };
    const topic = topicInfer();
    const contextExample = () => {
      const ex = Array.isArray(L.examples) && L.examples.length ? L.examples[0] : null;
      if (ex && (ex.en || ex.ar)) return ex;
      const qx = Array.isArray(L.quiz) && L.quiz.length ? L.quiz[0] : null;
      if (qx && qx.question_en) return { en: qx.question_en, ar: "" };
      return null;
    };
    const ctx = contextExample();
    const conceptText = String(L.explanation_ar || "").trim();
    const explainBlock = conceptText
      ? `<div class="gram-lesson-lead-card">
        <span class="gram-lesson-lead-kicker">${esc(t("gramLessonExplainLabel"))}</span>
        ${grammarScopeDescHtml(conceptText)}
        ${
          ctx && ctx.en
            ? `<div class="panel" style="margin-top:12px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb, var(--surface) 78%, transparent);border:1px dashed color-mix(in srgb, var(--border) 75%, transparent)">
              <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:900;margin-bottom:6px">Context example</div>
              <div class="en-text" dir="ltr">${esc(ctx.en)}</div>
              ${ctx.ar ? `<div class="ar-text" style="margin-top:6px">${esc(ctx.ar)}</div>` : ""}
            </div>`
            : ""
        }
      </div>`
      : "";

    const isIrregular = lessonId === "past-simple-irregular-verbs";
    const irrNormBaseKey = (s) =>
      String(s || "")
        .trim()
        .toLowerCase()
        .replace(/\s*\/\s*/g, "/")
        .replace(/\s+/g, " ");
    const irrMasterByBase = (() => {
      const m = new Map();
      for (const x of IRR_APPROVED_MASTER) {
        const k = irrNormBaseKey(x.base);
        if (k) m.set(k, x);
      }
      return m;
    })();
    const irrLookupRow = (row) => {
      if (!Array.isArray(row) || row.length < 2) return null;
      const v1 = irrNormBaseKey(row[1]);
      return irrMasterByBase.get(v1) || null;
    };
    const irrHeaderAr = (h) => {
      const s = String(h || "").trim();
      if (s.includes("المصدر") && s.includes("V1")) return "المضارع (الشكل الأول)";
      if (s.includes("الماضي") && s.includes("V2")) return "الماضي";
      if (s.includes("المشار إليه") || (s.includes("V3") && s.includes("المشار"))) return "التصريف الثالث";
      return s;
    };

    function grammarLessonTableBlock(T) {
      if (!T || !T.headers || !T.rows) return "";
      const titleRaw =
        lang === "en" && T.title_en && String(T.title_en).trim()
          ? String(T.title_en).trim()
          : T.title_ar || T.title_en || "";
      const cap = titleRaw
        ? `<h4 class="gram-table-caption" style="margin:14px 0 8px;font-size:15px;font-weight:700;color:var(--text)">${esc(titleRaw)}</h4>`
        : "";
      const thead =
        isIrregular && Array.isArray(T.headers)
          ? `<thead><tr>${T.headers.map((h) => `<th dir="rtl" style="font-family:var(--font);font-weight:800">${esc(irrHeaderAr(h))}</th>`).join("")}</tr></thead>`
          : `<thead><tr>${T.headers.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead>`;
      const tbodyIrregular = () =>
        `<tbody>${T.rows
          .map((r) => {
            const irr = irrLookupRow(r);
            const cells = r.map((c, colIdx) => {
              const raw = String(c ?? "").trim();
              if (colIdx === 0) return `<td dir="rtl" style="vertical-align:top">${esc(raw)}</td>`;
              let arHint = "";
              if (irr) {
                if (colIdx === 1) arHint = String(irr.meaning || "").trim();
                else if (colIdx === 2) arHint = String(irr.past_ar || "").trim();
                else if (colIdx === 3) arHint = String(irr.v3_ar || "").trim();
              }
              const sub = arHint
                ? `<div dir="rtl" style="margin-top:5px"><span class="chip" style="font-size:12px;opacity:.92">${esc(arHint)}</span></div>`
                : "";
              return `<td dir="ltr" style="font-family:var(--irr-en);font-weight:750;vertical-align:top">${esc(raw)}${sub}</td>`;
            });
            return `<tr>${cells.join("")}</tr>`;
          })
          .join("")}</tbody>`;
      const tbodyDefault = () =>
        `<tbody>${T.rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>`;
      const inner = `<table class="gram-table gram-table--irr-source">${thead}${isIrregular ? tbodyIrregular() : tbodyDefault()}</table>`;
      return cap + `<div class="table-responsive" role="region" aria-label="${esc(titleRaw || t("gramSecTable"))}">${inner}</div>`;
    }
    const tbl =
      Array.isArray(L.tables) && L.tables.length > 0
        ? L.tables.map(grammarLessonTableBlock).join("")
        : grammarLessonTableBlock(L.table);
    const hasTable = !!String(tbl || "").trim();
    const hasRule = hasText(L.rule_en);

    const hasMultiQuiz =
      Array.isArray(L.quizStages) &&
      L.quizStages.length > 0 &&
      Array.isArray(L.quizComprehensive) &&
      L.quizComprehensive.length > 0;
    grammarEnsureQuizState(lessonId);
    if (grammarLessonComplete(lessonId)) grammarMarkLessonDone(lessonId);

    const exList = L.examples || [];
    const qs = hasMultiQuiz ? [] : Array.isArray(L.quiz) ? L.quiz : [];
    const hasExamples = Array.isArray(exList) && exList.length > 0;
    const hasQuiz = !!(hasMultiQuiz || (Array.isArray(qs) && qs.length > 0));

    const st = grammarLessonQuiz[lessonId];
    const favOn = !!state.grammar.fav[lessonId];
    const doneOn = !!state.grammar.completed[lessonId];

    const ei = exList.length ? Math.min(st.exPos, exList.length - 1) : 0;
    const exampleBody =
      exList.length > 0
        ? `<div class="gram-ex" data-ex-i="${ei}">
        <div class="en">${esc(exList[ei].en)}</div>
        <div class="ar">${esc(exList[ei].ar)}</div>
        <button type="button" class="gram-speak" data-speak="${esc(exList[ei].en)}">🔊 Listen</button>
      </div>`
        : `<p class="empty">${esc(t("quizEmptySoon"))}</p>`;

    const exNav =
      exList.length > 1
        ? `<div class="gram-step-nav">
        <span class="gram-step-meta">${esc(grammarFmtProgress("gramExProgress", ei + 1, exList.length))}</span>
        <div class="gram-step-btns">
          <button type="button" class="btn" id="gramExPrev" ${ei <= 0 ? "disabled" : ""}>${esc(t("prev"))}</button>
          <button type="button" class="btn btn-primary" id="gramExNext" ${ei >= exList.length - 1 ? "disabled" : ""}>${esc(t("next"))}</button>
        </div>
      </div>`
        : exList.length === 1
          ? `<div class="gram-step-meta" style="margin-bottom:10px">${esc(grammarFmtProgress("gramExProgress", 1, 1))}</div>`
          : "";

    function grammarLessonQuizPanel(items, stPart, idsPrefix, dataGramQuiz) {
      const nq = (items || []).length;
      if (!nq) return `<p class="empty">${esc(t("emptyQuiz"))}</p>`;
      const qi = clamp(stPart.quizPos, 0, nq - 1);
      stPart.quizPos = qi;
      const item = items[qi];
      const picked = stPart.picks[qi];
      const locked = picked !== null && picked !== undefined;
      const ok = locked && picked === item.correct;
      const deepWrong = locked && !ok ? grammarDeepFeedbackHtml(item, picked) : "";
      const gramRevOffer = locked && !ok ? grammarReviewOfferHtml(lessonId, qi, String(dataGramQuiz)) : "";
      const nQuizAnswered = stPart.picks.filter((x) => x !== null && x !== undefined).length;
      const letters = ["A", "B", "C"];
      const opts = item.options
        .map((op, oi) => {
          let cls = "opt";
          if (locked) cls += oi === item.correct ? " correct" : picked === oi ? " wrong" : "";
          return `<button type="button" class="${cls}" data-qix="${qi}" data-oix="${oi}" data-gram-quiz="${esc(
            dataGramQuiz
          )}" ${locked ? "disabled" : ""}><span class="L">${letters[oi]}</span><span class="txt gram-opt-tok" dir="ltr" id="${idsPrefix}-opt-${qi}-${oi}"></span></button>`;
        })
        .join("");
      const fbCls = !locked ? "" : ok ? "ok" : "bad";
      const fbOn = locked ? "on" : "";
      return `
        <div class="gram-step-wrap">
          <div class="gram-step-nav">
            <span class="gram-step-meta">${esc(grammarFmtProgress("gramQuizProgress", qi + 1, nq))}</span>
            <div class="gram-step-btns">
              <button type="button" class="btn" id="${idsPrefix}-quiz-prev" ${qi <= 0 ? "disabled" : ""}>${esc(t("prev"))}</button>
              <button type="button" class="btn btn-primary" id="${idsPrefix}-quiz-next" ${qi >= nq - 1 ? "disabled" : ""}>${esc(t("next"))}</button>
            </div>
          </div>
          <p class="gram-answer-remain">${esc(fmtAnswerRemainLine("quizAnswerRemainLine", nQuizAnswered, nq))}</p>
          <div class="gram-qblock" data-qix="${qi}">
            <div class="q-label gram-q-line" dir="ltr"><span class="gram-q-num">${qi + 1}.</span> <span class="gram-q-tokens-host" id="${idsPrefix}-qtok-${qi}"></span></div>
            <div class="opts">${opts}</div>
            <div class="gram-feedback ${fbCls} ${fbOn}" id="${idsPrefix}-gf-${qi}">
              <strong>${ok ? esc(t("gramCorrect")) : esc(t("gramWrong"))}</strong> —
              ${esc(t("gramWhy"))}: ${esc(item.why_ar)}<br/>
              ${esc(t("gramUsedRule"))}: ${esc(item.rule_ar)}
              ${deepWrong}
              ${gramRevOffer}
            </div>
          </div>
        </div>`;
    }

    let quizHtml = "";
    let quizSection = "";
    if (hasMultiQuiz) {
      const mst = st;
      if (!mst.ui || typeof mst.ui !== "object") mst.ui = { mode: "stage", stage: 0 };
      if (mst.ui.mode !== "stage" && mst.ui.mode !== "final") mst.ui.mode = "stage";
      if (typeof mst.ui.stage !== "number") mst.ui.stage = 0;
      mst.ui.stage = clamp(mst.ui.stage, 0, Math.max(0, (L.quizStages || []).length - 1));

      const stageChips = (L.quizStages || [])
        .map((stage, si) => {
          const title =
            lang === "en" && stage.title_en && String(stage.title_en).trim()
              ? String(stage.title_en).trim()
              : stage.title_ar || "";
          const on = mst.ui.mode === "stage" && mst.ui.stage === si;
          return `<button type="button" class="pill ${on ? "on" : ""}" data-gqtab="stage" data-stage="${si}">${esc(
            title || ("Stage " + (si + 1)),
          )}</button>`;
        })
        .join("");
      const finalChip = `<button type="button" class="pill ${mst.ui.mode === "final" ? "on" : ""}" data-gqtab="final">${esc(
        t("gramQuizComprehensiveTitle"),
      )}</button>`;

      const inner =
        mst.ui.mode === "final"
          ? grammarLessonQuizPanel(L.quizComprehensive, mst.final, `gqf`, `final`)
          : grammarLessonQuizPanel((L.quizStages[mst.ui.stage] || {}).quiz || [], mst.stages[mst.ui.stage], `gqs${mst.ui.stage}`, `stage:${mst.ui.stage}`);

      quizSection = `
        <div class="gram-quiz-stages-wrap" style="margin-bottom:10px">
          <p style="margin:0 0 10px;font-size:13px;color:var(--muted);line-height:1.55;font-weight:650">${esc(t("gramQuizStagesLead"))}</p>
          <div class="pillrow" style="gap:10px;flex-wrap:wrap">${stageChips}${finalChip}</div>
        </div>
        <div class="gram-quiz-block">${inner}</div>
      `;
    } else if (qs.length === 0) {
      quizSection = `<p class="empty">${esc(t("emptyQuiz"))}</p>`;
    } else {
      const qi = st.quizPos;
      const item = qs[qi];
      const picked = st.picks[qi];
      const locked = picked !== null && picked !== undefined;
      const ok = locked && picked === item.correct;
      const nQuizAnswered = st.picks.filter((x) => x !== null && x !== undefined).length;
      const letters = ["A", "B", "C"];
      const opts = item.options
        .map((op, oi) => {
          let cls = "opt";
          if (locked) cls += oi === item.correct ? " correct" : picked === oi ? " wrong" : "";
          return `<button type="button" class="${cls}" data-qix="${qi}" data-oix="${oi}" data-gram-quiz="legacy" ${locked ? "disabled" : ""}><span class="L">${letters[oi]}</span><span class="txt gram-opt-tok" dir="ltr" id="gramL-opt-${qi}-${oi}"></span></button>`;
        })
        .join("");
      const deepWrong = locked && !ok ? grammarDeepFeedbackHtml(item, picked) : "";
      const gramRevOffer = locked && !ok ? grammarReviewOfferHtml(lessonId, qi, "legacy") : "";
      const fbCls = !locked ? "" : ok ? "ok" : "bad";
      const fbOn = locked ? "on" : "";
      quizHtml = `
        <div class="gram-step-wrap">
          <div class="gram-step-nav">
            <span class="gram-step-meta">${esc(grammarFmtProgress("gramQuizProgress", qi + 1, qs.length))}</span>
            <div class="gram-step-btns">
              <button type="button" class="btn" id="gramQuizPrev" ${qi <= 0 ? "disabled" : ""}>${esc(t("prev"))}</button>
              <button type="button" class="btn btn-primary" id="gramQuizNext" ${qi >= qs.length - 1 ? "disabled" : ""}>${esc(t("next"))}</button>
            </div>
          </div>
          <p class="gram-answer-remain">${esc(fmtAnswerRemainLine("quizAnswerRemainLine", nQuizAnswered, qs.length))}</p>
          <div class="gram-qblock" data-qix="${qi}">
            <div class="q-label gram-q-line" dir="ltr"><span class="gram-q-num">${qi + 1}.</span> <span class="gram-q-tokens-host" id="gramL-qtok-${qi}"></span></div>
            <div class="opts">${opts}</div>
            <div class="gram-feedback ${fbCls} ${fbOn}" id="gf-${qi}">
              <strong>${ok ? esc(t("gramCorrect")) : esc(t("gramWrong"))}</strong> —
              ${esc(t("gramWhy"))}: ${esc(item.why_ar)}<br/>
              ${esc(t("gramUsedRule"))}: ${esc(item.rule_ar)}
              ${deepWrong}
              ${gramRevOffer}
            </div>
          </div>
        </div>`;
      quizSection = `${quizHtml}`;
    }

    // Prevent repetition: if rule_en already appeared in a previous lesson, show a reference instead of repeating.
    const ruleFp = String(L.rule_en || "").toLowerCase().replace(/\s+/g, " ").trim();
    const firstRuleLesson = ruleFp ? grammarRuleFirstLessonByKey[ruleFp] : "";
    const isRuleDuplicate = !!(firstRuleLesson && firstRuleLesson !== lessonId);

    const warnMark = (why) => `<span class="warn" title="${esc(why)}">❗</span>`;
    const suspiciousText = (s) => {
      const x = String(s || "").trim();
      if (!x) return true;
      if (x === "—" || x === "-" || x.toLowerCase().includes("todo")) return true;
      return false;
    };
    const ruleWarn = hasRule && suspiciousText(L.rule_en) ? "نص القاعدة غير واضح/ناقص" : "";

    const rulePanel = hasRule
      ? `<div class="panel gram-sec glass-card">
        <h3 class="gram-sec-title">${esc("Snap explanation")}
          ${ruleWarn ? warnMark(ruleWarn) : ""}
        </h3>
        ${
          isRuleDuplicate
            ? `<p class="lead" style="margin:0 0 10px;font-size:13px;font-weight:700;color:var(--muted)">تم شرح هذه القاعدة مسبقًا في درس آخر. يمكنك فتحه بدل إعادة القراءة هنا.</p>
               <a class="btn btn-sec" href="#/grammar/lesson/${encodeURIComponent(firstRuleLesson)}" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center">${esc(
                 (grammarLessonsById[firstRuleLesson] && (lang === "ar" ? grammarLessonsById[firstRuleLesson].title_ar : grammarLessonsById[firstRuleLesson].title_en)) ||
                   t("gramOpen"),
               )}</a>`
            : `<div class="gram-rule-sec-inner">
              <div class="gram-rule-hint-wrap">
                <p class="gram-rule-hint">${esc(t("gramRuleEnHint"))}</p>
              </div>
              <div class="gram-rule-stack">${grammarFormatRuleEn(L.rule_en)}</div>
            </div>`
        }
      </div>`
      : "";

            if (cells.length >= 3 && w(cells[0]) && w(cells[1]) && w(cells[2])) {

      let irrQuizGroup = 0; // 0=all, 1=G1, 2=G2
      const mkQuiz = (group) => {

        const qs = [];
        const uniq = (arr) => [...new Set(arr)];

        const fourChoices = (correct, distractorPool) => {

        const pastIx = shuffle([...Array(pastPool.length).keys()]);

        if (qs.length < 8 && pastPool.length) {
          const revIx = shuffle([...Array(pastPool.length).keys()]);
          for (let j = 0; j < Math.min(12, pastPool.length); j++) {

            });

      let quiz = mkQuiz(irrQuizGroup);
